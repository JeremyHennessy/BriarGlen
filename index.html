<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Briar Glen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <h1>Briar Glen</h1>
        <p id="world-line">A small place with a long memory.</p>
      </div>
      <div class="top-stats" aria-label="world status">
        <span id="clock">Day 1 · 08:00</span>
        <span id="coins">0c</span>
      </div>
    </header>

    <section class="game-shell">
      <div class="canvas-wrap">
        <canvas id="game" width="960" height="540" aria-label="Briar Glen game world"></canvas>
        <div id="toast" class="toast" aria-live="polite"></div>
        <div class="mobile-controls" aria-label="touch controls">
          <div class="dpad">
            <button data-move="up">▲</button>
            <button data-move="left">◀</button>
            <button data-move="down">▼</button>
            <button data-move="right">▶</button>
          </div>
          <div class="actions">
            <button id="attack-btn">Attack</button>
            <button id="interact-btn">Use</button>
          </div>
        </div>
      </div>

      <aside class="sidebar">
        <section class="card player-card">
          <div class="card-title"><span>You</span><span id="standing">Unknown</span></div>
          <div class="meters">
            <label>Health <progress id="hp" max="100" value="100"></progress></label>
            <label>Energy <progress id="energy" max="100" value="100"></progress></label>
          </div>
          <div id="known-for" class="known-for">Known for: nothing yet</div>
        </section>

        <section class="card">
          <div class="card-title"><span>Skills</span><small>use them to improve them</small></div>
          <div id="skills" class="skills"></div>
        </section>

        <section class="card">
          <div class="card-title"><span>Pack</span><small id="pack-weight"></small></div>
          <div id="inventory" class="inventory"></div>
        </section>

        <section class="card">
          <div class="card-title"><span>Nearby</span><small id="nearby-type"></small></div>
          <div id="nearby" class="nearby">Walk up to someone or something useful.</div>
        </section>

        <section class="card log-card">
          <div class="card-title"><span>World log</span><button id="clear-log" type="button">clear</button></div>
          <div id="log" class="log"></div>
        </section>
      </aside>
    </section>

    <footer>
      <span>Move: WASD / arrows</span>
      <span>Attack: Space</span>
      <span>Use: E</span>
      <span>Skills: 1–4</span>
      <span>Save: automatic</span>
    </footer>
  </main>
  <script src="src/game.js"></script>
</body>
</html>
