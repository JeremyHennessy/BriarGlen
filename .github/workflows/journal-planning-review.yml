name: Journal planning release review (branch only)
on:
  push:
    branches: [custodian/ui-expedition-planning]
    paths: [.github/workflows/journal-planning-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 2ef0482e8f4acf76bb0eb14b1ed0d30fe33a6a5a
      PROTOTYPE: e4eda15b11d00da15052e4f8db90d4b1193d0928
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reapply only the reviewed Journal slice to exact verified current main
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor efb547dc5390a243c465c939f3b3fd27b0844381 HEAD
          git merge-base --is-ancestor b25cce7600bea24bee42e689af9e84d713982b3e HEAD
          git diff --exit-code "$BASE" -- src tests index.html styles.css
          mkdir -p evidence/before evidence/source evidence/screens
          git archive "$BASE" src tests index.html styles.css .github/workflows/reboot-game-proof.yml | tar -x -C evidence/before
          git show "$PROTOTYPE:.journal-plan-author.py" > .journal-author.py
          test "$(git hash-object .journal-author.py)" = cd9e1d0fabb471e285c3851a1afdb5f079bf95c2
          python3 .journal-author.py > evidence/author.diff
          git show "$PROTOTYPE:.journal-guide-test.mjs" > tests/expedition-guide.mjs
          test "$(git hash-object tests/expedition-guide.mjs)" = 67036eec07fc510cba02ef223b6b418df0b524f1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/play-ui.mjs');old=p.read_text()
          a="import { proveCombatUi } from './combat-ui.mjs';";b="import { proveExpeditionGuide } from './expedition-guide.mjs';\n"+a
          assert old.count(a)==1;new=old.replace(a,b)
          a2='  await proveCombatUi(page, vp);';b2=a2+'\n  await proveExpeditionGuide(page, vp);';assert new.count(a2)==1;new=new.replace(a2,b2)
          assert new.replace(b2,a2).replace(b,a)==old;p.write_text(new)
          base=Path('evidence/before')
          for name in ['index.html','styles.css','tests/smoke.mjs','tests/combat-ui.mjs','tests/interaction-ui.mjs','tests/live-ui-stability.mjs','tests/skill-ui.mjs','.github/workflows/reboot-game-proof.yml']:
              assert Path(name).read_bytes()==(base/name).read_bytes(),name
          old=(base/'src/game.js').read_text();new=Path('src/game.js').read_text()
          start='  // Read existing progress only: carried supplies are not Waycache deposits.\n'
          assert new.count(start)==1
          helper=start+new.split(start)[1].split('  function renderPlayHud(){')[0]
          assert new.replace(helper,'').replace('  renderExpeditionSupplyPlan(p);\n','')==old
          assert "briar-glen-reboot-v1" in new
          print('PASS exact runtime inversion: only the pure supply helper and HUD call; all action/renderer/save/NPC/gameplay code identical to verified base')
          PY
          node --check src/game.js && node --check src/play-ui.js && node --check tests/expedition-guide.mjs && node --check tests/play-ui.mjs && node --check tests/smoke.mjs
          git diff --check
          cp -r src tests index.html styles.css evidence/source/
          git diff "$BASE" -- src tests > evidence/candidate.diff
          git diff --no-index /dev/null tests/expedition-guide.mjs >> evidence/candidate.diff || test "$?" = 1
      - name: Install pinned browser engines and serve before and after
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 4173 >/tmp/journal-after.log 2>&1 &
          python3 -m http.server 4174 --directory evidence/before >/tmp/journal-before.log 2>&1 &
          sleep 2
      - name: Full canonical Chromium gameplay and all UI proofs
        env:
          UI_EVIDENCE_DIR: evidence/canonical-chromium
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/canonical-chromium.log
      - name: Full canonical body in WebKit with only engine substitution
        env:
          UI_EVIDENCE_DIR: evidence/canonical-webkit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tests/smoke.mjs').read_text();a="import { chromium } from 'playwright';";b="import { webkit as chromium } from 'playwright';"
          assert s.count(a)==1;n=s.replace(a,b);assert n.replace(b,a)==s;Path('tests/.journal-webkit.mjs').write_text(n)
          PY
          set -o pipefail
          node tests/.journal-webkit.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/canonical-webkit.log
      - name: Actual before-after screenshots, five sizes per engine and native flow acceptance
        run: |
          cat > .journal-release-visual.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          import {chromium,webkit} from 'playwright';
          import {proveExpeditionGuide} from './tests/expedition-guide.mjs';
          import {provePlayUi} from './tests/play-ui.mjs';
          const records=[];
          const sizes=[{name:'desktop',width:1440,height:900,touch:false},{name:'landscape',width:844,height:390,touch:true},{name:'portrait',width:390,height:844,touch:true},{name:'small-landscape',width:667,height:375,touch:true},{name:'small-portrait',width:375,height:667,touch:true}];
          for(const [engine,type] of Object.entries({chromium,webkit})){
            const browser=await type.launch({headless:true});
            try{for(const vp of sizes)for(const version of ['before','after']){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.touch,isMobile:vp.touch}),page=await context.newPage(),errors=[],r={engine,vp,version};
              page.on('pageerror',e=>errors.push(e.message));
              const activate=async s=>vp.touch?page.locator(s).tap():page.locator(s).click();
              const name=`${engine}-${vp.name}-${version}`;
              await page.goto(`http://127.0.0.1:${version==='after'?4173:4174}/`,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelector('#guide-preparation')?.textContent.includes('health'));
              await page.screenshot({path:`evidence/screens/${name}-default.png`});
              await activate('#objective-open');await page.screenshot({path:`evidence/screens/${name}-journal-top.png`});
              if(version==='before'){
                await page.locator('#guide-preparation').scrollIntoViewIfNeeded();await page.screenshot({path:`evidence/screens/${name}-preparation.png`});
                r.text=await page.locator('.expedition-guide').innerText();
              }else{
                await proveExpeditionGuide(page,{...vp,name});
                if(vp.name.startsWith('small-'))await provePlayUi(page,{...vp,name});
                // Fresh separate fixture for representative provision screenshots and live-growth focus.
                await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.setPosition(900,600);d.give('arrows',6);d.advance(0);});
                await activate('#objective-open');await page.locator('#guide-arrows-plan').scrollIntoViewIfNeeded();
                await page.screenshot({path:`evidence/screens/${name}-provisions.png`});
                const summary=page.locator('.guide-sources summary');await summary.focus();await page.keyboard.press('Enter');await summary.scrollIntoViewIfNeeded();
                const focusGeometry=()=>summary.evaluate(el=>{const b=el.getBoundingClientRect(),p=document.querySelector('#panel-journal').getBoundingClientRect();return{focused:document.activeElement===el,inBounds:b.top>=p.top-1&&b.bottom<=p.bottom+1};});
                assert.deepEqual(await focusGeometry(),{focused:true,inBounds:true});
                await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.give('bread',1000000);d.give('arrows',1000000);d.advance(0);});
                await page.waitForTimeout(650);assert.deepEqual(await focusGeometry(),{focused:true,inBounds:true});
                await page.screenshot({path:`evidence/screens/${name}-focused-sources.png`});
                for(const id of ['pack','craft','character','nearby','journal']){await activate(`[data-panel="${id}"]`);assert.equal(await page.locator(`#panel-${id}`).isVisible(),true);assert.equal(await page.locator('.play-panel:visible').count(),1);}
                const geometry=()=>page.evaluate(()=>({w:innerWidth,h:innerHeight,sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,pw:document.querySelector('#panel-journal').clientWidth,psw:document.querySelector('#panel-journal').scrollWidth,controls:['attack-btn','interact-btn','quick-brace','quick-tonic'].map(id=>document.getElementById(id).getBoundingClientRect().toJSON())}));
                const check=g=>{assert.ok(g.sw<=g.w+1&&g.sh<=g.h+1&&g.psw<=g.pw+1,'Page/panel overflow');for(const b of g.controls)assert.ok(b.width>=44&&b.height>=44&&b.top>=0&&b.left>=0&&b.right<=g.w+1&&b.bottom<=g.h+1,'Persistent control bounds');for(let i=0;i<g.controls.length;i++)for(let j=i+1;j<g.controls.length;j++){const a=g.controls[i],b=g.controls[j];assert.ok(a.right<=b.left+1||b.right<=a.left+1||a.bottom<=b.top+1||b.bottom<=a.top+1,'Action control overlap');}};
                check(await geometry());
                if(vp.touch){await page.setViewportSize({width:vp.height,height:vp.width});await page.waitForTimeout(250);check(await geometry());await page.setViewportSize({width:vp.width,height:vp.height});await page.waitForTimeout(250);check(await geometry());await page.addStyleTag({content:'body{padding:20px 12px 16px!important}#app{height:calc(100dvh - 36px)!important}'});await page.waitForTimeout(250);check(await geometry());await page.screenshot({path:`evidence/screens/${name}-insets.png`});}
                r.geometry=await geometry();r.pass=true;
              }
              assert.deepEqual(errors,[]);records.push(r);await writeFile('evidence/visual.json',JSON.stringify(records,null,2));await context.close();
            }}finally{await browser.close();}
          }
          console.log('PASS 20 actual before-after browser/size presentations; ten native guide lifecycle, held input, live focus, panel, orientation and inset checks; extra small-size full UI proofs');
          JS
          set -o pipefail
          UI_EVIDENCE_DIR=evidence/screens node .journal-release-visual.mjs 2>&1 | tee evidence/visual.log
      - name: Commit only verified source and additive tests on unchanged owned branch
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/custodian/ui-expedition-planning | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code "$BASE" -- index.html styles.css .github/workflows/reboot-game-proof.yml tests/smoke.mjs tests/combat-ui.mjs tests/interaction-ui.mjs tests/live-ui-stability.mjs tests/skill-ui.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js src/play-ui.js src/play-ui.css tests/play-ui.mjs tests/expedition-guide.mjs
          git commit -m 'UI: make expedition preparation and Waycache provisioning clear'
          git push origin HEAD:refs/heads/custodian/ui-expedition-planning
          git rev-parse HEAD > evidence/candidate-head.txt
          git ls-tree -r HEAD > evidence/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-planning-acceptance
          path: evidence
          retention-days: 14
