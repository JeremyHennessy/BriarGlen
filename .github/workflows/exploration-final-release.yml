name: Exploration final release proof (temporary)
on:
  push:
    branches: [custodian/ui-exploration-leads]
    paths: [.github/workflows/exploration-final-release.yml]
permissions:
  contents: read
env:
  BASE: e18b09e4c24ca0e05f51066e1f3f2c42cc20d460
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact candidate with proved fixture-only isolation and preserved original assertions
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor efb547dc5390a243c465c939f3b3fd27b0844381 HEAD
          git merge-base --is-ancestor b25cce7600bea24bee42e689af9e84d713982b3e HEAD
          git diff --exit-code "$BASE" -- src tests index.html styles.css
          mkdir -p evidence/before evidence/source
          git archive "$BASE" src tests index.html styles.css | tar -x -C evidence/before
          python3 .exploration-author-final.py | tee evidence/preservation.log
          python3 .exploration-rendered-sync.py | tee -a evidence/preservation.log
          python3 .detour-fixture-author.py | tee -a evidence/preservation.log
          test "$(git hash-object src/game.js)" = 97ca81a2f598e54a946dafbe26638512691a3aeb
          test "$(git hash-object src/play-ui.js)" = bc96a9b42d089d183312e027a6df45f665b0183e
          test "$(git hash-object tests/expedition-guide.mjs)" = 604017c8c8657b3c3927fdb24e6a70990b88acfe
          test "$(git hash-object tests/smoke.mjs)" = 3381a6b6b6f97d9315fd8284109cb0f62b15e84d
          git diff --exit-code "$BASE" -- src/play-ui.css index.html styles.css tests/play-ui.mjs tests/combat-ui.mjs tests/interaction-ui.mjs tests/live-ui-stability.mjs tests/skill-ui.mjs tests/panel-reading.mjs tests/narrow-actions.mjs .github/workflows/reboot-game-proof.yml
          git diff --check
          node --check src/game.js && node --check src/play-ui.js && node --check tests/expedition-guide.mjs && node --check tests/smoke.mjs
          cp -r src tests index.html styles.css evidence/source/
          git diff "$BASE" -- src tests > evidence/candidate.diff
          git rev-parse HEAD > evidence/author-head.txt
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps $ENGINE
          python3 -m http.server 4173 >/tmp/after.log 2>&1 &
          python3 -m http.server 4174 --directory evidence/before >/tmp/before.log 2>&1 &
          sleep 2
      - name: Entire canonical game and UI suite
        env:
          UI_EVIDENCE_DIR: evidence/canonical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('tests/smoke.mjs').read_text()
          if os.environ['ENGINE']=='webkit':
              a="import { chromium } from 'playwright';";b="import { webkit as chromium } from 'playwright';"
              assert s.count(a)==1;n=s.replace(a,b);assert n.replace(b,a)==s
          else:n=s
          Path('tests/.final-canonical.mjs').write_text(n)
          PY
          set -o pipefail
          node tests/.final-canonical.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/canonical.log
      - name: Complete before-after layouts and native controls across seven sizes
        env:
          UI_EVIDENCE_DIR: evidence/screens
        run: |
          set -o pipefail
          node .exploration-visual-final.mjs 2>&1 | tee evidence/visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploration-final-${{ matrix.engine }}
          path: evidence
          retention-days: 14
  commit:
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit exact accepted four-file candidate and remove all previous tooling
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/custodian/ui-exploration-leads | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code "$BASE" -- src tests index.html styles.css
          python3 .exploration-author-final.py
          python3 .exploration-rendered-sync.py
          python3 .detour-fixture-author.py
          test "$(git hash-object src/game.js)" = 97ca81a2f598e54a946dafbe26638512691a3aeb
          test "$(git hash-object src/play-ui.js)" = bc96a9b42d089d183312e027a6df45f665b0183e
          test "$(git hash-object tests/expedition-guide.mjs)" = 604017c8c8657b3c3927fdb24e6a70990b88acfe
          test "$(git hash-object tests/smoke.mjs)" = 3381a6b6b6f97d9315fd8284109cb0f62b15e84d
          python3 - <<'PY'
          import subprocess,os
          added=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=A',os.environ['BASE'],'HEAD']).decode().splitlines())
          final='.github/workflows/exploration-final-release.yml'
          expected={'.exploration-game-author.py','.exploration-game-helper-v2.txt','.exploration-game-helper.txt','.exploration-note.txt','.exploration-play-ui-author-v2.py','.exploration-play-ui-author.py','.exploration-author-final.py','.exploration-visual-final.mjs','.exploration-sync-final.py','.exploration-rendered-sync.py','.detour-fixture-author.py','.github/workflows/exploration-leads-review.yml','.github/workflows/exploration-keyboard-diagnostic.yml','.github/workflows/exploration-lifecycle-trace.yml','.github/workflows/exploration-close-layout-proof.yml','.github/workflows/detour-fixture-diagnostic.yml','.github/workflows/detour-isolation-proof.yml',final}
          assert added==expected,(added,expected)
          subprocess.run(['git','rm','--',*sorted(added-{final})],check=True)
          PY
          git diff --check
          git add src/game.js src/play-ui.js tests/expedition-guide.mjs tests/smoke.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'UI: add post-Stonepine exploration leads; isolate detour test hazards'
          git push origin HEAD:refs/heads/custodian/ui-exploration-leads
          git rev-parse HEAD
