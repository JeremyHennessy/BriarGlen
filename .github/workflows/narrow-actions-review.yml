name: Narrow action lane (evidence only)
on:
  push:
    branches: [custodian/verify-narrow-actions-20261004]
    paths: [.github/workflows/narrow-actions-review.yml, .narrow-probe.mjs, .narrow-candidate.css]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve approved source and prepare the same CSS hypothesis
        run: |
          set -eu
          git diff --exit-code 707dd5d2049fa7995a81c51b5ed89aeba5c21136 -- src tests index.html styles.css
          mkdir -p evidence/before evidence/screens
          cp -r src tests index.html styles.css evidence/before/
          cp .narrow-probe.mjs evidence/probe.mjs
          cp .narrow-candidate.css evidence/proposed.css
          node --check .narrow-probe.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 4173 >/tmp/briar.log 2>&1 &
          sleep 2
      - name: Atomic same-scene before-after and native panel acceptance
        run: |
          set -o pipefail
          node .narrow-probe.mjs 2>&1 | tee evidence/probe.log
      - name: Confirm original runtime and tests remain untouched
        if: always()
        run: git diff --exit-code 707dd5d2049fa7995a81c51b5ed89aeba5c21136 -- src tests index.html styles.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narrow-action-lane
          path: evidence
          retention-days: 14
