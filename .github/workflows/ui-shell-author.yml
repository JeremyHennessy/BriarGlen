name: UI shell assembly and proof
on:
  push:
    branches: [custodian/build-0.94-playability-shell]
    paths: [.github/workflows/ui-shell-author.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/custodian/build-0.94-playability-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact input files
        run: |
          test "$(git hash-object src/game.js)" = 6f21f9f2c18500a50a8ed970b32618c218c2afba
          test "$(git hash-object tests/smoke.mjs)" = 94f9712afb59d7837fd77e149abe8b65b2614d4f
          test "$(git hash-object index.html)" = 433ff2c94b3fbed77f46b9276563066547c1275a
          test "$(git hash-object src/play-ui.js)" = e3a1a6e4e1103e92c7e7169b14b3161cc2666302
          test "$(git hash-object src/play-ui.css)" = 463c2c348cfe4c2a671fd069e1249250ca565d0e
          test "$(git hash-object tests/play-ui.mjs)" = 8b98af302e841fdd9cfdd6d4e2fb49521f2d398d
      - name: Assemble scoped presentation and adapt real UI paths in existing tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text();s=s.replace('<link rel="stylesheet" href="styles.css">','<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="src/play-ui.css">');s=s.replace('<script src="src/game.js"></script>','<script src="src/game.js"></script>\n  <script src="src/play-ui.js"></script>');p.write_text(s)
          p=Path('src/game.js');s=p.read_text().replace("version:'0.93.0'","version:'0.94.0'")
          hud=r'''  function renderPlayHud(){
              const text=(id,value)=>{const el=document.getElementById(id);if(el&&el.textContent!==value)el.textContent=value;};
              text('hp-text',`${Math.ceil(player.hp)} / ${player.maxHp}`);text('energy-text',`${Math.floor(player.energy)} / ${player.maxEnergy}`);
              if(!document.getElementById('objective-text'))return;
              const p=stonepineExpeditionProgress(),targetId=!p.started||p.ready?'stonepine-trail-ledger':!p.overlook?'stonepine-overlook':'stonepine-waycache',target=world.landmarks.find(l=>l.id===targetId);
              const next=p.completed?(itemCount('trailpack')?'Route proven · explore the wilds':'Craft your earned Trail Pack'):!p.started?'Visit the Stonepine Trail Ledger':stonepineExpeditionNext(p);
              let direction='';if(!p.completed&&target){const dx=target.x-player.x,dy=target.y-player.y;direction=dist(player,target)<=55?'Within reach · press Use':`${['East','South-east','South','South-west','West','North-west','North','North-east'][(Math.round(Math.atan2(dy,dx)/(Math.PI/4))+8)%8]} · ${targetId==='stonepine-trail-ledger'?'Briar Glen':'Stonepine Ridge'}`;}
              text('objective-text',next);text('objective-direction',p.completed?(itemCount('trailpack')?'Your supplies remain in the Waycache':'Make · 2 Wolf Hides + 1 Ashwood'):direction);
              const guide=document.getElementById('guide-body');if(guide){const html=`<p>${!p.started?'Begin at the Trail Ledger in Briar Glen.':p.completed?'Expedition complete. Your Trail Pack recipe is unlocked.':'Chart the ridge, secure its cache, leave supplies, and return.'}</p>`+[[p.overlook,'Chart Stonepine Overlook'],[p.cache,'Secure the Waycache'],[p.bread>=1&&p.arrows>=6,`Leave supplies: ${Math.min(p.bread,1)}/1 bread · ${Math.min(p.arrows,6)}/6 arrows`],[p.completed,'Return to the Trail Ledger']].map(([done,label])=>`<div class="guide-step" data-complete="${done}">${done?'✓':'○'} ${label}</div>`).join('')+'<p>Reward: 18c, Fieldcraft experience, and the Trail Pack recipe. Stored provisions remain yours.</p>';if(guide.innerHTML!==html)guide.innerHTML=html;}
              const weapon=player.equippedWeapon,working=weapon&&player.inventory[weapon]?.durability>0;
              text('guide-preparation',`${Math.ceil(player.hp)} health · ${Math.floor(player.energy)} energy. ${working?itemDefs[weapon].name+' equipped.':'No working weapon equipped; make one or equip it in Pack.'} ${itemCount('arrows')} arrows · ${itemCount('bread')} bread · ${itemCount('tonic')} tonics. ${player.hp<65?'Low health: brew and drink a tonic before a difficult fight.':''} ${player.energy<30?'Low energy: stop to rest before travelling farther.':''}`);
              for(const el of document.querySelectorAll('[data-recipe-requirements]')){const id=el.dataset.recipeRequirements,r=recipes[id];if(!r)continue;const unlocked=id!=='trailpack'||p.completed,level=player.skills[r.skill].level>=r.level,needs=Object.entries(r.input).map(([mat,qty])=>`${itemCount(mat)}/${qty} ${itemDefs[mat].name}`).join(' · '),value=`${!unlocked?'Complete Stonepine first · ':!level?`${skillDefs[r.skill].name} ${r.level} required · `:''}${needs}`;if(el.textContent!==value)el.textContent=value;el.dataset.ready=String(unlocked&&level&&hasItems(r.input));}
            }
          '''
          # Normalize only the insertion indentation, leaving existing source lines unchanged.
          hud='\n'.join(line[2:] if line.startswith('    ') else line for line in hud.split('\n'))
          anchor='  function renderUI(){';assert s.count(anchor)==1;s=s.replace(anchor,hud+anchor);s=s.replace('renderNearby();renderApprentice();}','renderNearby();renderApprentice();renderPlayHud();}')
          old="addEventListener('keydown',e=>{if(['ArrowUp'";new="addEventListener('keydown',e=>{if(e.defaultPrevented||e.target.closest?.('input,textarea,select,[contenteditable=\"true\"]')||(['Space','Enter'].includes(e.code)&&e.target.closest?.('button,summary,[role=\"button\"]')))return;if(['ArrowUp'";assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          p=Path('tests/smoke.mjs');s=p.read_text().replace("'0.93.0'","'0.94.0'")
          s=s.replace("const errors=[];", "const openPanel=async id=>{const tab=page.locator(`[data-panel=\"${id}\"]`);if(await tab.getAttribute('aria-selected')!=='true'){if(vp.touch)await tab.tap();else await tab.click();}};\n    const errors=[];",1)
          s=s.replace("const activateGear=async row=>{", "const activateGear=async row=>{await openPanel('pack');")
          for anchor,panel in [("const takeIron=page.locator(",'nearby'),("const expeditionBread=page.locator(",'nearby'),("const makeTrailPack=page.locator(",'craft'),("const arrowButton=page.locator(",'craft')]:
              assert s.count(anchor)==1;s=s.replace(anchor,f"await openPanel('{panel}');\n    "+anchor)
          s=s.replace("await page.locator('#nearby [data-near=buy]').click();", "await openPanel('nearby');await page.locator('#nearby [data-near=buy]').click();")
          s=s.replace("const apprenticeButton=page.locator(","await openPanel('character');await page.locator('#apprentice-details > summary').click();\n    const apprenticeButton=page.locator(")
          s=s.replace("await page.keyboard.press('ArrowLeft');","await page.locator('#game').focus();await page.keyboard.press('ArrowLeft');")
          s="import { provePlayUi } from './play-ui.mjs';\n"+s;s=s.replace('    if(errors.length)throw new Error(', '    await provePlayUi(page,vp);\n    if(errors.length)throw new Error(',1);p.write_text(s)
          PY
          node --check src/game.js && node --check src/play-ui.js && node --check tests/smoke.mjs && node --check tests/play-ui.mjs
          git diff --check
      - name: Full Reboot and real interface proof
        env:
          UI_EVIDENCE_DIR: ui-evidence
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/ui-shell.log 2>&1 &
          sleep 2
          node tests/smoke.mjs http://127.0.0.1:4173/
      - name: Capture default screens and exact candidate
        if: always()
        run: |
          mkdir -p ui-evidence/source/src ui-evidence/source/tests
          cp src/game.js src/play-ui.js src/play-ui.css ui-evidence/source/src/
          cp tests/smoke.mjs tests/play-ui.mjs ui-evidence/source/tests/
          cp index.html styles.css ui-evidence/source/
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch();
          try{for(const [name,width,height] of [['desktop',1440,900],['landscape',844,390],['portrait',390,844],['small-landscape',667,375]]){const page=await browser.newPage({viewport:{width,height},hasTouch:name!=='desktop'});await page.goto('http://127.0.0.1:4173/');await page.waitForTimeout(250);await page.screenshot({path:`ui-evidence/${name}-default.png`});await page.close();}}finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briar-ui-0.94-evidence
          path: ui-evidence/
          retention-days: 30
      - name: Commit tested candidate only and remove temporary jobs
        run: |
          test "$(git ls-remote origin refs/heads/custodian/build-0.94-playability-shell | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object .github/workflows/reboot-game-proof.yml)" = 2dc5e4a39e7ab21d917a0c0af6afe69c0d5fc070
          git rm .github/workflows/ui-phase-baseline.yml .github/workflows/ui-shell-author.yml
          git add index.html src/game.js tests/smoke.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'BUILD 0.94: verified playability shell with unchanged gameplay rules'
          git push origin HEAD:refs/heads/custodian/build-0.94-playability-shell
