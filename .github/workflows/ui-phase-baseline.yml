name: UI phase baseline capture
on:
  push:
    branches: [custodian/build-0.94-playability-shell]
    paths: [.github/workflows/ui-phase-baseline.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efb547dc5390a243c465c939f3b3fd27b0844381
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture exact source and screenshots
        run: |
          test "$(git rev-parse HEAD)" = efb547dc5390a243c465c939f3b3fd27b0844381
          mkdir -p ui-reference/source ui-reference/screens
          cp index.html styles.css ui-reference/source/
          cp -r src tests ui-reference/source/
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/ui-baseline.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch();
          try { for (const [name,width,height] of [['desktop',1440,900],['landscape',844,390],['portrait',390,844]]) {
            const context=await browser.newContext({viewport:{width,height},hasTouch:name!=='desktop'});
            const page=await context.newPage();await page.goto('http://127.0.0.1:4173/');
            await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build().version==='0.93.0');
            await page.screenshot({path:`ui-reference/screens/${name}.png`,fullPage:true});
            writeFileSync(`ui-reference/screens/${name}.json`,JSON.stringify(await page.evaluate(()=>({viewport:{w:innerWidth,h:innerHeight},canvas:document.querySelector('canvas').getBoundingClientRect().toJSON(),scroll:{w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight}})),null,2));
            await context.close();
          }} finally {await browser.close();}
          JS
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: briar-pre-ui-0.93
          path: ui-reference/
          retention-days: 30
