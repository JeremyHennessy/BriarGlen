name: Existing detour fixture diagnosis (temporary)
on:
  push:
    branches: [custodian/ui-exploration-leads]
    paths: [.github/workflows/detour-fixture-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verified original source and passive diagnostic copy
        run: |
          set -eu
          test "$(git hash-object src/game.js)" = bbe35f9f86c33b4408f73a20ae4ea803e2c7105e
          test "$(git hash-object tests/smoke.mjs)" = 46f1961cd7538e5d8a38ef73f9c3e8b5c8382214
          mkdir -p evidence
          cp src/game.js tests/smoke.mjs evidence/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game.js');s=p.read_text()
          a='  function residentDangerDetour(n){';b=a+"if(n.id==='mira'&&n.blockedByDanger)(window.__detourCalls??=[]).push({phase:'enter',minute:world.minute,mira:copy(n),enemies:copy(world.enemies)});"
          assert s.count(a)==1;s=s.replace(a,b)
          a='const safe=fieldSpot(report.itemId,n,true);return safe?{report,enemy,safe}:null;'
          b="const safe=fieldSpot(report.itemId,n,true);if(n.id==='mira')(window.__detourCalls??=[]).push({phase:'eligible',minute:world.minute,safe:copy(safe),age:dangerReportAge(report),warden:copy(warden)});return safe?{report,enemy,safe}:null;"
          assert s.count(a)==1;s=s.replace(a,b)
          p.write_text(s)
          PY
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/game.log 2>&1 &
          sleep 2
      - name: Fixed reproducer seed62 with exact original outcomes
        run: |
          cat > .detour-probe.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          const source=await readFile('tests/smoke.mjs','utf8'),start='    const autonomousDangerDetour=await page.evaluate(',line=source.split('\n').find(l=>l.startsWith(start));assert.ok(line);
          let fn=line.slice(start.length,-2);assert.ok(fn.startsWith('()=>'));
          const old='return{wolfId,wardenGoal,before,after};',added='return{wolfId,wardenGoal,before,after,warden:{...t},mira:{...m},minute:d.snapshot().minute,day:d.snapshot().day,resources:d.resourcesAll(),enemies:d.enemies(),calls:window.__detourCalls};';assert.equal(fn.split(old).length,2);fn=fn.replace(old,added);
          const browser=await chromium.launch(),page=await browser.newPage(),records=[];
          try{await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__);
            for(const seed of [62,1,62]){
              const r=await page.evaluate(({fn,seed})=>{window.__detourCalls=[];const original=Math.random;let value=seed;Math.random=()=>((value=(Math.imul(value,1664525)+1013904223)>>>0)/4294967296);try{return (0,eval)(`(${fn})`)();}finally{Math.random=original;}},{fn,seed});
              r.seed=seed;records.push(r);console.log(JSON.stringify({seed,after:r.after,warden:r.warden,eligibleCalls:r.calls.filter(c=>c.phase==='eligible'),lastCalls:r.calls.slice(-2),enemies:r.enemies}));
            }
          }finally{await writeFile('evidence/rich-detour-records.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          set -o pipefail
          node .detour-probe.mjs 2>&1 | tee evidence/rich.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detour-fixture-rich-diagnostic
          path: evidence
          retention-days: 14
