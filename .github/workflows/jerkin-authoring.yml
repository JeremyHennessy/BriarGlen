name: Branch-only jerkin authoring
on:
  push:
    branches: [custodian/build-0.89-wolfhide-jerkin]
    paths: [.github/workflows/jerkin-authoring.yml]
permissions:
  contents: write
jobs:
  author:
    if: github.ref == 'refs/heads/custodian/build-0.89-wolfhide-jerkin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact verified base and unchanged source blobs
        run: |
          test "$(git rev-parse HEAD^)" = b8f2e2aba68abd331691567bd5cc5ec234ce1a8b
          test "$(git hash-object src/game.js)" = 39b60c66f3c2e19ff2ef0c4f7427d0a60cdab665
          test "$(git hash-object tests/smoke.mjs)" = 912509c8fe522cc9ce9a3bcad644b34fe416361c
          test "$(git ls-remote origin refs/heads/custodian/build-0.89-wolfhide-jerkin | cut -f1)" = "$GITHUB_SHA"
      - name: Apply scoped armor runtime and proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game.js');s=p.read_text()
          def replace(old,new,count=1):
              global s
              assert s.count(old)==count, (old,s.count(old),count)
              s=s.replace(old,new)
          replace("version:'0.88.0'","version:'0.89.0'")
          replace("    bedroll:{name:","    jerkin:{name:'Wolfhide Jerkin',weight:2.2,base:56,kind:'armor',color:'#b99878'},\n    bedroll:{name:")
          replace("    bedroll:{skill:","    jerkin:{skill:'fieldcraft',level:1,input:{hide:3,wood:1},output:'jerkin'},\n    bedroll:{skill:")
          replace("equippedTool:null,equippedWeapon:null,knownFor:","equippedTool:null,equippedWeapon:null,equippedArmor:null,knownFor:")
          replace("return kind==='tool'||kind==='weapon';","return kind==='tool'||kind==='weapon'||kind==='armor';")
          replace("if(player.equippedWeapon===id)player.equippedWeapon=null;return true;}","if(player.equippedWeapon===id)player.equippedWeapon=null;if(player.equippedArmor===id)player.equippedArmor=null;return true;}")
          replace("player.equippedWeapon=equipped?null:id;}else return false;","player.equippedWeapon=equipped?null:id;}else if(def.kind==='armor'){equipped=player.equippedArmor===id;player.equippedArmor=equipped?null:id;}else return false;")
          replace("player.equippedTool=null;player.equippedWeapon=null;player.knownFor=","player.equippedTool=null;player.equippedWeapon=null;player.equippedArmor=null;player.knownFor=")
          replace("if(itemDefs[id]?.kind==='weapon')player.equippedWeapon=id;deriveIdentity();","if(itemDefs[id]?.kind==='weapon')player.equippedWeapon=id;if(itemDefs[id]?.kind==='armor')player.equippedArmor=id;deriveIdentity();")
          replace("Object.assign(player,s.player);player.servicesCompleted=","Object.assign(player,s.player);player.equippedArmor=s.player.equippedArmor==='jerkin'&&s.player.inventory?.jerkin?.qty>0?'jerkin':null;player.servicesCompleted=")
          replace("equipped=player.equippedTool===id||player.equippedWeapon===id,","equipped=player.equippedTool===id||player.equippedWeapon===id||player.equippedArmor===id,")
          replace("controllable=artifact&&['tool','weapon'].includes","controllable=artifact&&['tool','weapon','armor'].includes")
          replace(" · repaired ${artifact.provenance.repairs}×`:''"," · repaired ${artifact.provenance.repairs}×${id==='jerkin'?` · protection ${armorRating()}`:''}`:''")
          replace("if(itemDefs[id].kind==='weapon')player.equippedWeapon=id;return true;","if(itemDefs[id].kind==='weapon')player.equippedWeapon=id;if(itemDefs[id].kind==='armor')player.equippedArmor=id;return true;")
          helpers=r'''  function armorRating(){const slot=player.inventory.jerkin;if(player.equippedArmor!=='jerkin'||!slot||slot.durability<=0)return 0;const q=avgQuality('jerkin');return q>=2.6?3:q>=1.7?2:1;}
            function takePlayerHit(amount){const absorbed=amount>2?Math.min(armorRating(),Math.max(0,amount-1)):0;if(absorbed>0)player.inventory.jerkin.durability=Math.max(0,player.inventory.jerkin.durability-2);player.hp=Math.max(0,player.hp-(amount-absorbed));if(absorbed>0){save();toast(`Wolfhide Jerkin absorbed ${absorbed} · ${Math.round(player.inventory.jerkin.durability)} durability left`);}return amount-absorbed;}
            function patchJerkin(){const slot=player.inventory.jerkin?normalizeArtifactSlot('jerkin',player.inventory.jerkin):null;if(!slot){toast('Craft a Wolfhide Jerkin before patching');return false;}if(slot.durability>=slot.maxDurability){toast('Wolfhide Jerkin is already fully patched');return false;}if(itemCount('hide')<1){toast('Patch Jerkin needs 1 Wolf Hide');return false;}const quality=avgQuality('hide'),before=slot.durability,repair=Math.round(30+player.skills.fieldcraft.level*4+clamp(quality-1,-.5,2)*6);removeItem('hide',1);slot.durability=Math.min(slot.maxDurability,slot.durability+repair);slot.provenance.repairs+=1;slot.provenance.history.push(`Patched by You on Day ${world.day} with ${qualityLabel(quality)} Wolf Hide.`);if(slot.provenance.history.length>8)slot.provenance.history.shift();skillXp('fieldcraft',4);save();renderUI();toast(`Wolfhide Jerkin patched +${Math.round(slot.durability-before)} · ${Math.round(slot.durability)}/${Math.round(slot.maxDurability)}`);return true;}
          
          '''
          replace('  function combatProfile(){',helpers+'  function combatProfile(){')
          replace('player.hp=Math.max(0,player.hp-dmg);','takePlayerHit(dmg);',3)
          replace('<button data-craft="bedroll">Craft Trail Bedroll</button>','<button data-craft="bedroll">Craft Trail Bedroll</button><button data-craft="jerkin">Craft Wolfhide Jerkin</button><button id="patch-jerkin">Patch Jerkin (1 hide)</button>')
          replace("document.getElementById('make-camp').addEventListener", "document.getElementById('patch-jerkin').addEventListener('click',()=>{manualTakeover('Manual armor repair took control.');patchJerkin();});document.getElementById('make-camp').addEventListener")
          p.write_text(s)
          p=Path('tests/smoke.mjs');s=p.read_text()
          assert "const jerkinCraft=" not in s and s.count('    // Deep Quarry Seam:')==1
          assert s.count("'0.88.0'")>=48
          s=s.replace("'0.88.0'","'0.89.0'")
          block=r'''    // Wolfhide Jerkin connects hunts, quality, independent equipment, protection and repair.
              const jerkinCraft=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.setPosition(30,30);const missing=d.craft('jerkin');d.give('hide',3,2.8);d.give('wood',1,2.8);const before=d.snapshot().player,made=d.craft('jerkin'),after=d.snapshot().player;d.give('hide',3,1);d.give('wood',1,1);const duplicateBefore=d.snapshot().player.inventory,duplicate=d.craft('jerkin'),duplicateAfter=d.snapshot().player.inventory;d.give('pick',1,1.3);d.give('blade',1,1.4);d.equip('pick');d.equip('blade');d.setDurability('jerkin',60);d.advance(0);d.save();return{missing,before,made,after,duplicateBefore,duplicate,duplicateAfter,gear:d.snapshot().player,controls:!!document.querySelector('[data-craft="jerkin"]')&&!!document.getElementById('patch-jerkin')};});
              if(jerkinCraft.missing||!jerkinCraft.made||!jerkinCraft.controls||jerkinCraft.after.inventory.hide||jerkinCraft.after.inventory.wood||jerkinCraft.after.inventory.jerkin?.qty!==1||Math.abs(jerkinCraft.after.inventory.jerkin.qualitySum-2.8)>1e-9||jerkinCraft.after.inventory.jerkin.provenance.maker!=='You'||jerkinCraft.after.inventory.jerkin.provenance.source!=='Player-crafted'||jerkinCraft.after.skills.fieldcraft.xp!==jerkinCraft.before.skills.fieldcraft.xp+10||jerkinCraft.after.equippedArmor!=='jerkin'||jerkinCraft.duplicate||JSON.stringify(jerkinCraft.duplicateBefore)!==JSON.stringify(jerkinCraft.duplicateAfter))throw new Error(`${vp.name}: Jerkin craft materials/quality/singularity/provenance failed ${JSON.stringify(jerkinCraft)}`);
              if(jerkinCraft.gear.equippedTool!=='pick'||jerkinCraft.gear.equippedWeapon!=='blade'||jerkinCraft.gear.equippedArmor!=='jerkin')throw new Error(`${vp.name}: armor replaced a weapon or tool slot`);
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build?.().version==='0.89.0',{timeout:5000});
              const jerkinReload=await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.snapshot().player);
              if(jerkinReload.equippedArmor!=='jerkin'||jerkinReload.inventory.jerkin?.durability!==60||jerkinReload.inventory.jerkin.provenance.maker!=='You'||jerkinReload.equippedTool!=='pick'||jerkinReload.equippedWeapon!=='blade')throw new Error(`${vp.name}: independent armor equipment/lineage did not persist ${JSON.stringify(jerkinReload)}`);
              const jerkinRow=page.locator('#inventory [data-equip="jerkin"]');await activateGear(jerkinRow);
              const stowedJerkin=await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.snapshot().player);
              if(stowedJerkin.equippedArmor||stowedJerkin.equippedTool!=='pick'||stowedJerkin.equippedWeapon!=='blade')throw new Error(`${vp.name}: keyboard/touch stow disturbed another equipment slot`);
              await activateGear(jerkinRow);
              if(!(await jerkinRow.innerText()).includes('equipped')||!(await jerkinRow.innerText()).includes('protection 3'))throw new Error(`${vp.name}: equipped fine armor protection was not visible`);
              const armorHits=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;const trial=(kind,q=null,durability=100,braced=false,stowed=false)=>{d.reset();d.clearEnemies();d.setPosition(30,30);d.setEnergy(100);if(q!==null){d.give('jerkin',1,q);d.setDurability('jerkin',durability);if(!stowed)d.equip('jerkin');}if(braced)d.useSkill('guard');const id=kind==='emberback'?d.spawnEmberbackAt(30,30):kind==='briarwolf'?d.spawnBriarWolfAt(30,30):d.spawnWolfAt(30,30),e=d.enemy(id);if(kind==='emberback')e.windup=.001;if(kind==='briarwolf'){e.pounce=.4;e.windup=0;e.leapX=0;e.leapY=0;e.pounceHit=false;}const original=Storage.prototype.setItem,writes=[];Storage.prototype.setItem=function(k,v){if(k===d.build().saveKey&&String(new Error().stack).includes('takePlayerHit'))writes.push(JSON.parse(v));return original.call(this,k,v);};try{d.advance(.01);}finally{Storage.prototype.setItem=original;}const result={kind,hp:d.snapshot().player.hp,armor:d.artifact('jerkin'),direct:writes.at(-1)||null};d.clearEnemies();return result;};return['wolf','briarwolf','emberback'].map(kind=>({kind,bare:trial(kind),plain:trial(kind,1),good:trial(kind,1.9),fine:trial(kind,2.8),stowed:trial(kind,2.8,100,false,true),broken:trial(kind,2.8,0),braced:trial(kind,2.8,100,true)}));});
              for(const r of armorHits){const raw={wolf:10,briarwolf:14,emberback:18}[r.kind];if(r.bare.hp!==100-raw||r.stowed.hp!==r.bare.hp||r.broken.hp!==r.bare.hp||r.stowed.armor.durability!==100||r.broken.armor.durability!==0||r.braced.hp!==100-(r.kind==='emberback'?2:1)||r.braced.armor.durability!==100)throw new Error(`${vp.name}: armor changed unarmored/broken/stowed/Brace baseline ${JSON.stringify(r)}`);for(const [name,protection] of Object.entries({plain:1,good:2,fine:3})){const hit=r[name];if(hit.hp!==100-raw+protection||hit.armor.durability!==98||hit.direct?.player?.hp!==hit.hp||hit.direct?.player?.inventory?.jerkin?.durability!==98)throw new Error(`${vp.name}: ${r.kind} ${name} armor hit did not synchronously apply exact protection/wear ${JSON.stringify(hit)}`);}}
              const armorBreak=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.setPosition(30,30);d.give('jerkin',1,2.8);d.equip('jerkin');d.setDurability('jerkin',1);const id=d.spawnWolfAt(30,30);d.advance(.01);const first=d.snapshot().player;d.enemy(id).attackCd=0;d.advance(.01);const second=d.snapshot().player;d.clearEnemies();return{first,second};});
              if(armorBreak.first.hp!==93||armorBreak.first.inventory.jerkin.durability!==0||armorBreak.second.hp!==83||armorBreak.second.inventory.jerkin.durability!==0)throw new Error(`${vp.name}: broken armor retained protection or wore below zero ${JSON.stringify(armorBreak)}`);
              const armorPatch=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,button=document.getElementById('patch-jerkin');d.reset();d.clearEnemies();button.click();const noArmor=document.getElementById('toast').textContent;d.give('jerkin',1,2);d.setDurability('jerkin',0);button.click();const missing={armor:d.artifact('jerkin'),toast:document.getElementById('toast').textContent};d.give('hide',1,1);d.setDurability('jerkin',100);const fullBefore=d.snapshot().player;button.click();const fullAfter=d.snapshot().player;const repair=(q)=>{d.reset();d.clearEnemies();d.give('jerkin',1,2);d.setDurability('jerkin',0);d.give('hide',1,q);const before=d.snapshot().player;button.click();return{before,after:d.snapshot().player,saved:JSON.parse(localStorage.getItem(d.build().saveKey))};};return{noArmor,missing,fullBefore,fullAfter,plain:repair(1),fine:repair(2.8)};});
              if(!armorPatch.noArmor.includes('Craft a Wolfhide Jerkin')||!armorPatch.missing.toast.includes('1 Wolf Hide')||armorPatch.missing.armor.durability!==0||JSON.stringify(armorPatch.fullBefore.inventory)!==JSON.stringify(armorPatch.fullAfter.inventory)||armorPatch.fullBefore.skills.fieldcraft.xp!==armorPatch.fullAfter.skills.fieldcraft.xp)throw new Error(`${vp.name}: armor repair denial consumed material or granted XP ${JSON.stringify(armorPatch)}`);
              for(const r of [armorPatch.plain,armorPatch.fine])if(r.after.inventory.hide||r.after.inventory.jerkin.durability<=0||r.after.inventory.jerkin.durability>r.after.inventory.jerkin.maxDurability||r.after.inventory.jerkin.provenance.repairs!==1||!r.after.inventory.jerkin.provenance.history.some(x=>x.includes('Patched by You')&&x.includes('Wolf Hide'))||r.after.skills.fieldcraft.xp!==r.before.skills.fieldcraft.xp+4||r.saved.player.inventory.jerkin.durability!==r.after.inventory.jerkin.durability)throw new Error(`${vp.name}: hide patch did not restore and persist functional armor ${JSON.stringify(r)}`);
              if(armorPatch.fine.after.inventory.jerkin.durability<=armorPatch.plain.after.inventory.jerkin.durability)throw new Error(`${vp.name}: patch quality had no repair consequence`);
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build?.().version==='0.89.0',{timeout:5000});
              const patchedReload=await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.artifact('jerkin'));
              if(patchedReload?.durability!==armorPatch.fine.after.inventory.jerkin.durability||patchedReload.provenance.repairs!==1)throw new Error(`${vp.name}: patched armor condition/history did not survive reload`);
              await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.give('pick',1,1.3);d.give('blade',1,1.4);d.equip('pick');d.equip('blade');d.save();const key=d.build().saveKey,s=JSON.parse(localStorage.getItem(key));delete s.player.equippedArmor;localStorage.setItem(key,JSON.stringify(s));});
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build?.().version==='0.89.0',{timeout:5000});
              const armorLegacy=await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.snapshot().player);
              if(armorLegacy.equippedArmor!==null||armorLegacy.inventory.jerkin||armorLegacy.equippedTool!=='pick'||armorLegacy.equippedWeapon!=='blade')throw new Error(`${vp.name}: pre-armor save invented armor or changed existing equipment ${JSON.stringify(armorLegacy)}`);
              await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.reset());
          
          '''
          lines=block.splitlines(True);block=lines[0]+''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          s=s.replace('    // Deep Quarry Seam:',block+'    // Deep Quarry Seam:',1);p.write_text(s)
          PY
          node --check src/game.js
          node --check tests/smoke.mjs
          git diff --check
      - name: Commit feature and remove temporary authoring workflow
        run: |
          test "$(git ls-remote origin refs/heads/custodian/build-0.89-wolfhide-jerkin | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/jerkin-authoring.yml
          git add src/game.js tests/smoke.mjs
          git diff --cached --stat
          git -c user.name='Briar Glen Custodian' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'BUILD 0.89: Wolfhide Jerkin equipment, protection and patching'
          git push origin HEAD:refs/heads/custodian/build-0.89-wolfhide-jerkin
