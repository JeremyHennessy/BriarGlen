name: Narrow action lane release review (temporary)
on:
  push:
    branches: [custodian/ui-narrow-action-lane]
    paths: [.github/workflows/narrow-release-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 3251115cfd16d2bac8bdb7be3546773afbfd02bc
      INPUT: 449c47841ba43d0e46388bf81bead8218cf10f7b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reapply only reviewed CSS and isolated additive test on the new verified checkpoint
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/checkpoint/panel-reading-ui-verified-20261004 | cut -f1)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor efb547dc5390a243c465c939f3b3fd27b0844381 HEAD
          git merge-base --is-ancestor b25cce7600bea24bee42e689af9e84d713982b3e HEAD
          git diff --exit-code "$BASE" -- src tests index.html styles.css
          mkdir -p evidence/before evidence/source evidence/screens
          git archive "$BASE" src tests index.html styles.css | tar -x -C evidence/before
          git show "$INPUT:.narrow-candidate.css" > .narrow-candidate.css
          git show "$INPUT:.narrow-actions.mjs" > tests/narrow-actions.mjs
          test "$(git hash-object .narrow-candidate.css)" = 3e901fdcf3c3f4a9f62a7d3f5501e70b70b96158
          test "$(git hash-object tests/narrow-actions.mjs)" = eb0fc352793b7c5f0629a88bf5cbf14ef6d063f1
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess
          p=Path('src/play-ui.css');old=p.read_bytes();patch=Path('.narrow-candidate.css').read_bytes();new=old+patch
          assert old==subprocess.check_output(['git','show',os.environ['BASE']+':src/play-ui.css'])
          assert new[:-len(patch)]==old;p.write_bytes(new)
          p=Path('tests/play-ui.mjs');old=p.read_text();a="import { provePanelReading } from './panel-reading.mjs';";b="import { proveNarrowActions } from './narrow-actions.mjs';\n"+a
          c='  await provePanelReading(page, vp);';d=c+'\n  await proveNarrowActions(page, vp);'
          assert old.count(a)==1 and old.count(c)==1
          new=old.replace(a,b).replace(c,d);assert new.replace(d,c).replace(b,a)==old;p.write_text(new)
          s=subprocess.check_output(['git','show',os.environ['INPUT']+':.narrow-probe.mjs'],text=True)
          oldurl='http://127.0.0.1:4173/';assert s.count(oldurl)==1
          Path('.narrow-probe.mjs').write_text(s.replace(oldurl,'http://127.0.0.1:4174/'))
          print('PASS exact source inversion: only525-byte scoped CSS append and two additive test integration lines; new native regression pinned')
          PY
          test "$(git hash-object src/play-ui.css)" = dc7c14b879f0eef861063bcc3f7d509a5e501822
          test "$(git hash-object tests/play-ui.mjs)" = ea0d86376c1a962860c173cf919efc53aab225be
          git diff --check
          git diff --exit-code "$BASE" -- src/game.js src/play-ui.js index.html styles.css tests/smoke.mjs tests/combat-ui.mjs tests/interaction-ui.mjs tests/live-ui-stability.mjs tests/skill-ui.mjs tests/expedition-guide.mjs tests/panel-reading.mjs .github/workflows/reboot-game-proof.yml
          node --check tests/narrow-actions.mjs && node --check tests/play-ui.mjs
          cp -r src tests index.html styles.css evidence/source/
          cp .narrow-probe.mjs evidence/probe.mjs
          cp .narrow-candidate.css evidence/proposed.css
          git diff "$BASE" -- src tests > evidence/candidate.diff
          git diff --no-index /dev/null tests/narrow-actions.mjs >> evidence/candidate.diff || test "$?" = 1
      - name: Install pinned engines and serve separate baseline and candidate
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 4173 >/tmp/briar-candidate.log 2>&1 &
          python3 -m http.server 4174 --directory evidence/before >/tmp/briar-before.log 2>&1 &
          sleep 2
      - name: Exact same-scene source-matched before-after geometry across22 engine-size cases
        run: |
          set -o pipefail
          node .narrow-probe.mjs 2>&1 | tee evidence/geometry.log
      - name: Full original and additive canonical Chromium game proof
        env:
          UI_EVIDENCE_DIR: evidence/chromium-canonical
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/chromium-canonical.log
      - name: Full canonical WebKit assertions with engine import only
        env:
          UI_EVIDENCE_DIR: evidence/webkit-canonical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tests/smoke.mjs').read_text();a="import { chromium } from 'playwright';";assert s.count(a)==1
          Path('tests/.narrow-webkit.mjs').write_text(s.replace(a,"import { webkit as chromium } from 'playwright';"))
          PY
          set -o pipefail
          node tests/.narrow-webkit.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/webkit-canonical.log
      - name: Original populated panel and keyboard reading subproofs inside the new narrow layout
        run: |
          cat > .narrow-depth.mjs <<'JS'
          import {chromium,webkit} from 'playwright';
          import {proveEquipmentReadiness} from './tests/play-ui.mjs';
          import {proveInteractionUi} from './tests/interaction-ui.mjs';
          import {proveLiveUiStability} from './tests/live-ui-stability.mjs';
          import {proveSkillReadiness} from './tests/skill-ui.mjs';
          import {proveCombatUi} from './tests/combat-ui.mjs';
          import {proveExpeditionGuide} from './tests/expedition-guide.mjs';
          import {provePanelReading} from './tests/panel-reading.mjs';
          const vp={name:'narrow-landscape',width:600,height:375,touch:true};
          for(const [engine,type] of Object.entries({chromium,webkit})){
            const browser=await type.launch();
            try{
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:true}),page=await context.newPage(),errors=[];
              page.on('pageerror',e=>errors.push(e.message));process.env.UI_EVIDENCE_DIR=`evidence/depth-${engine}`;
              await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>!!document.querySelector('#guide-preparation')?.textContent);
              for(const prove of [proveEquipmentReadiness,proveInteractionUi,proveLiveUiStability,proveSkillReadiness,proveCombatUi,proveExpeditionGuide,provePanelReading])await prove(page,vp);
              if(errors.length)throw new Error(JSON.stringify(errors));
              console.log(`PASS ${engine}: all original populated equipment/interaction/focus/skill/combat/Journal/reading subproofs at600x375; all assertions unchanged`);
            }finally{await browser.close();}
          }
          JS
          cp .narrow-depth.mjs evidence/depth.mjs
          set -o pipefail
          node .narrow-depth.mjs 2>&1 | tee evidence/depth.log
      - name: Commit only the three verified files on the unchanged owned branch
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/custodian/ui-narrow-action-lane | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/play-ui.css tests/play-ui.mjs tests/narrow-actions.mjs
          git commit -m 'UI: keep all actions reachable in narrow landscape windows'
          git push origin HEAD:refs/heads/custodian/ui-narrow-action-lane
          git rev-parse HEAD > evidence/candidate-head.txt
          git ls-tree -r HEAD > evidence/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narrow-release-acceptance
          path: evidence
          retention-days: 14
