name: Hosted Pages diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Pages publishing configuration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          curl -sS -f \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/pages" | python3 -m json.tool
      - name: Probe currently served Pages bytes
        shell: bash
        run: |
          set -eu
          base="https://jeremyhennessy.github.io/BriarGlen"
          for attempt in 1 2 3; do
            echo "=== ATTEMPT $attempt ==="
            curl -sS -L -D /tmp/index.headers -o /tmp/index.html "$base/?diag=${{ github.sha }}-$attempt"
            echo "--- index headers ---"
            head -20 /tmp/index.headers
            echo "--- index fingerprint ---"
            wc -c /tmp/index.html
            grep -Eo '<title>[^<]+|src="[^"]+|href="[^"]+' /tmp/index.html | head -30 || true
            curl -sS -L -D /tmp/game.headers -o /tmp/game.js "$base/src/game.js?diag=${{ github.sha }}-$attempt"
            echo "--- game headers ---"
            head -20 /tmp/game.headers
            echo "--- game fingerprint ---"
            wc -c /tmp/game.js
            grep -Eo "version:'[^']+'|briar-glen-reboot-v1|canonical-manifest-hooks-v1" /tmp/game.js | head -20 || true
            sleep 10
          done
