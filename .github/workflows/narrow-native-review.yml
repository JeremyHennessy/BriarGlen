name: Narrow native actions (evidence only)
on:
  push:
    branches: [custodian/verify-narrow-actions-20261004]
    paths: [.github/workflows/narrow-native-review.yml, .narrow-actions.mjs]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify base and apply only the visually inspected CSS in working tree
        run: |
          set -eu
          git diff --exit-code 707dd5d2049fa7995a81c51b5ed89aeba5c21136 -- src tests index.html styles.css
          mkdir -p evidence/source evidence/native
          cat .narrow-candidate.css >> src/play-ui.css
          cp -r src tests index.html styles.css evidence/source/
          cp .narrow-actions.mjs evidence/narrow-actions.mjs
          cp .narrow-candidate.css evidence/patch.css
          git diff -- src/play-ui.css > evidence/candidate.diff
          node --check .narrow-actions.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 4173 >/tmp/briar.log 2>&1 &
          sleep 2
      - name: Both-engine native directional and primary-action outcomes
        run: |
          cat > .narrow-native-run.mjs <<'JS'
          import {chromium,webkit} from 'playwright';
          import {proveNarrowActions} from './.narrow-actions.mjs';
          for(const [engine,type] of Object.entries({chromium,webkit})){
            const browser=await type.launch();
            try{const page=await browser.newPage();await page.goto('http://127.0.0.1:4173/');process.env.UI_EVIDENCE_DIR=`evidence/native/${engine}`;await proveNarrowActions(page,{name:'desktop'});}
            finally{await browser.close();}
          }
          JS
          set -o pipefail
          node .narrow-native-run.mjs 2>&1 | tee evidence/native.log
      - name: Revert the experiment and confirm no runtime or original test change remains
        if: always()
        run: |
          git restore src/play-ui.css
          git diff --exit-code 707dd5d2049fa7995a81c51b5ed89aeba5c21136 -- src tests index.html styles.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narrow-native-actions
          path: evidence
          retention-days: 14
