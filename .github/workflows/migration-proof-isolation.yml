name: Branch-only migration proof isolation
on:
  push:
    branches: [custodian/0.95-migration-proof-isolation]
    paths: [.github/workflows/migration-proof-isolation.yml]
permissions:
  contents: write
jobs:
  isolate:
    if: github.ref == 'refs/heads/custodian/0.95-migration-proof-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact unchanged main and fixture
        run: |
          test "$(git rev-parse HEAD^)" = 3d1347a654537a42db29e1249e68cd8cbc9e0518
          test "$(git hash-object tests/smoke.mjs)" = 9e9c0ca69062ec25c434e9f7e13377f5ce6377f2
          test "$(git hash-object .github/workflows/reboot-game-proof.yml)" = 0d7eeb6b70ca426a6e5140d1ad82bec4aec21d37
      - name: Prepare identical runtime and targeted fixtures
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/migration-server.log 2>&1 &
          sleep 2
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/smoke.mjs');s=p.read_text()
          lines=s.splitlines();found=[line for line in lines if 'await page.evaluate' in line and "id:'legacy-dead-wolf'" in line]
          assert len(found)==1
          old=found[0]
          guard="const write=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){if(k===key)return;return write.call(this,k,v);};"
          assert old.endswith('localStorage.setItem(key,JSON.stringify(state));});')
          new=old.replace('localStorage.setItem(key,JSON.stringify(state));});','localStorage.setItem(key,JSON.stringify(state));'+guard+'});')
          for label,line in [('original',old),('isolated',new)]:
              Path(f'evidence/{label}-setup.txt').write_text(line.strip().removeprefix('await page.evaluate(').removesuffix(');'))
          Path('evidence/replacement-old.txt').write_text(old)
          Path('evidence/replacement-new.txt').write_text(new)
          PY
      - name: Reproduce native autosave race and prove isolated reload
        run: |
          cat > migration-diagnostic.mjs <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const browser=await chromium.launch({headless:true}),evidence=[];
          try {
            for(const isolated of [false,true]) {
              const page=await browser.newPage({viewport:{width:390,height:844}});
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build().version==='0.95.0');
              const expression=readFileSync(`evidence/${isolated?'isolated':'original'}-setup.txt`,'utf8');
              await page.evaluate('('+expression+')()');
              const setup=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,key=d.build().saveKey;window.__migrationWrites=0;const write=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){if(k===key)window.__migrationWrites++;return write.call(this,k,v);};return JSON.parse(localStorage.getItem(key));});
              assert.equal(setup.world.enemies.find(e=>e.id==='emberback').dead,true);
              await page.waitForFunction(()=>window.__migrationWrites>0,null,{timeout:7000});
              const afterAutosave=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;return{attempts:window.__migrationWrites,stored:JSON.parse(localStorage.getItem(d.build().saveKey))};});
              assert.ok(afterAutosave.attempts>0,'Real frame autosave must attempt a write');
              assert.equal(afterAutosave.stored.world.enemies.find(e=>e.id==='emberback').dead,isolated,'Original overwrite must reproduce; isolated fixture must remain dead');
              if(isolated)assert.deepEqual(afterAutosave.stored,setup,'Protected fixture bytes changed before reload');
              await page.reload({waitUntil:'domcontentloaded'});
              const migrated=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.save();return{wolf:d.enemy('legacy-dead-wolf')||null,emberback:d.enemy('emberback'),writes:window.__migrationWrites??null,saved:JSON.parse(localStorage.getItem(d.build().saveKey))};});
              assert.equal(migrated.wolf,null);assert.equal(migrated.emberback.dead,isolated);assert.equal(migrated.emberback.type,'emberback');
              assert.equal(migrated.writes,null,'Fixture hook must not survive document reload');
              assert.equal(migrated.saved.world.enemies.some(e=>e.id==='legacy-dead-wolf'),false,'Native saving must resume after reload');
              evidence.push({isolated,autosaveAttempts:afterAutosave.attempts,storedDead:afterAutosave.stored.world.enemies.find(e=>e.id==='emberback').dead,reloadedDead:migrated.emberback.dead,deadWolfPruned:!migrated.wolf,normalSavingRestored:true});
              await page.close();
            }
            writeFileSync('evidence/native-autosave-reproduction.json',JSON.stringify(evidence,null,2));
            console.log('NATIVE_AUTOSAVE_REPRODUCTION',JSON.stringify(evidence));
          } finally {await browser.close();}
          JS
          node migration-diagnostic.mjs
          rm migration-diagnostic.mjs
      - name: Apply only the proved fixture guard and full regression suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/smoke.mjs');s=p.read_text();old=Path('evidence/replacement-old.txt').read_text();new=Path('evidence/replacement-new.txt').read_text()
          assert s.count(old)==1
          p.write_text(s.replace(old,'    // Hold this synthetic legacy save until reload; live autosave must not replace the fixture.\n'+new))
          PY
          node --check tests/smoke.mjs
          git diff --check
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/full-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-fixture-proof-0.95
          path: evidence/
          retention-days: 14
      - name: Commit only tested fixture and remove temporary tooling
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 82da3b933b3a0ba3b0c5deed9badff3c47e1d918
          test "$(git ls-remote origin refs/heads/custodian/0.95-migration-proof-isolation | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code -- src/game.js src/play-ui.js src/play-ui.css index.html styles.css tests/play-ui.mjs .github/workflows/reboot-game-proof.yml
          git rm .github/workflows/migration-proof-isolation.yml
          git add tests/smoke.mjs
          test "$(git diff --cached --name-only | wc -l)" = 2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Test: hold synthetic legacy save stable until reload'
          git push origin HEAD:refs/heads/custodian/0.95-migration-proof-isolation
