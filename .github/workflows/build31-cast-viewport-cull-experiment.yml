name: Build 31 cast viewport-cull experiment

on:
  pull_request:
    paths:
      - 'src/v27/41-living-cast.js'
      - 'tests/stonepine-scree-viewport-cull-probe.mjs'
      - '.github/workflows/build31-cast-viewport-cull-experiment.yml'
  workflow_dispatch:

jobs:
  viewport-cull-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 > /tmp/briarglen-viewport-cull-probe.log 2>&1 &
          sleep 2
      - name: Measure scree cadence with viewport-culled cast
        run: node tests/stonepine-scree-viewport-cull-probe.mjs http://127.0.0.1:4173/
