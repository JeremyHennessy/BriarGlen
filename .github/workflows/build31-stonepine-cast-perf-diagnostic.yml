name: Build 31 Stonepine cast performance diagnostic

on:
  pull_request:
    paths:
      - 'tests/stonepine-scree-cast-probe.mjs'
      - '.github/workflows/build31-stonepine-cast-perf-diagnostic.yml'
  workflow_dispatch:

jobs:
  scree-cast-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 > /tmp/briarglen-scree-cast-probe.log 2>&1 &
          sleep 2
      - name: Measure scree with and without Living Cast
        run: node tests/stonepine-scree-cast-probe.mjs http://127.0.0.1:4173/
