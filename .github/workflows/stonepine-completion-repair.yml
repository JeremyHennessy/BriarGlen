name: Branch-only Stonepine completion repair
on:
  push:
    branches: [custodian/build-0.91-stonepine-expedition]
    paths: [.github/workflows/stonepine-completion-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/custodian/build-0.91-stonepine-expedition'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD^)" = "68392d6c10b155af2a730eb0bf097c4535cbdf86"
          test "$(git hash-object src/game.js)" = "e38ae7fdde677390e78295409397a55f06b50650"
          test "$(git hash-object tests/smoke.mjs)" = "$(git rev-parse HEAD^:tests/smoke.mjs)"
      - name: Reproduce stale reference and test minimal correction
        run: |
          cat > /tmp/stonepine-repair.cjs <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const path='src/game.js',source=fs.readFileSync(path,'utf8');
          const names=['normalizeStonepineExpedition','stonepineExpeditionState','stonepineExpeditionProgress','stonepineExpeditionNext','visitStonepineLedger'];
          function trial(text){
            const functions=names.map(name=>{const line=text.split('\n').find(s=>s.startsWith('  function '+name+'('));assert.ok(line,name);return line;}).join('\n');
            const cache={claimed:true,stash:{bread:{qty:1,qualitySum:1},arrows:{qty:6,qualitySum:6}}};
            const player={x:0,y:0,coins:0,expeditions:{stonepine:{started:true,completed:false,rewarded:false}}};
            const writes=[],ledger={x:0,y:0};let xp=0;
            const context=vm.createContext({player,world:{landmarks:[{id:'stonepine-overlook',discovered:true}]},ensureStonepineWaycache:()=>cache,normalizeWaycacheStash:c=>c.stash,ensureStonepineLedger:()=>ledger,dist:(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),toast:()=>{},log:()=>{},save:()=>writes.push(JSON.parse(JSON.stringify(player))),skillXp:(id,n)=>{xp+=n;}});
            vm.runInContext(functions+'\nfunction renderUI(){stonepineExpeditionProgress();}',context);
            vm.runInContext('visitStonepineLedger()',context);const first={coins:player.coins,completed:player.expeditions.stonepine.completed,rewarded:player.expeditions.stonepine.rewarded,xp};
            vm.runInContext('visitStonepineLedger()',context);return{first,coins:player.coins,completed:player.expeditions.stonepine.completed,rewarded:player.expeditions.stonepine.rewarded,xp,writes};
          }
          const before=trial(source);assert.equal(before.first.coins,18);assert.equal(before.first.completed,false);assert.equal(before.coins,36);assert.equal(before.completed,false);console.log('REPRODUCED detached completion state',JSON.stringify(before));
          const line=source.split('\n').find(s=>s.startsWith('  function visitStonepineLedger('));
          const oldStart='const state=stonepineExpeditionState();',newStart='const progress=stonepineExpeditionProgress(),state=stonepineExpeditionState();';
          const oldProgress='const progress=stonepineExpeditionProgress();if(!progress.ready)';
          assert.equal(line.split(oldStart).length,2);assert.equal(line.split(oldProgress).length,2);
          const changed=line.replace(oldStart,newStart).replace(oldProgress,'if(!progress.ready)');
          const fixed=source.replace(line,changed);assert.notEqual(fixed,source);
          const after=trial(fixed);assert.equal(after.first.completed,true);assert.equal(after.first.rewarded,true);assert.equal(after.coins,18);assert.equal(after.xp,10);assert.equal(after.writes.length,1);assert.equal(after.writes[0].expeditions.stonepine.completed,true);assert.equal(after.writes[0].expeditions.stonepine.rewarded,true);console.log('PASS active state and synchronous one-time reward',JSON.stringify(after));
          fs.writeFileSync(path,fixed);
          NODE
          node /tmp/stonepine-repair.cjs
          node --check src/game.js
          node --check tests/smoke.mjs
          git diff --check
      - name: Commit only correction and remove temporary tooling
        run: |
          test "$(git ls-remote origin refs/heads/custodian/build-0.91-stonepine-expedition | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/stonepine-completion-repair.yml
          git add src/game.js .github/workflows/stonepine-completion-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Stonepine reward completion on active expedition state'
          test "$(git diff --name-only 68392d6c10b155af2a730eb0bf097c4535cbdf86 HEAD)" = 'src/game.js'
          git diff --stat 68392d6c10b155af2a730eb0bf097c4535cbdf86 HEAD
          git push origin HEAD:refs/heads/custodian/build-0.91-stonepine-expedition
