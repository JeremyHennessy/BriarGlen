name: Combat UI acceptance (branch only)
on:
  push:
    branches: [custodian/ui-first-outing]
    paths: [.github/workflows/combat-ui-review.yml, .combat-ui-author.py, tests/combat-ui.mjs]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact baseline and browser
        run: |
          set -eu
          git diff --exit-code 9c1c957ebf48b97e93ea23d7daa2ed7e87a7dcdf -- src index.html styles.css
          mkdir -p evidence/before evidence/source
          git archive 9c1c957ebf48b97e93ea23d7daa2ed7e87a7dcdf src tests index.html styles.css | tar -x -C evidence/before
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/briar.log 2>&1 &
          sleep 2
      - name: Reproduce actual damage with hidden overlapping ordinary wolf
        run: |
          cat > .combat-red.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {writeFile,mkdir} from 'node:fs/promises';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true}),records=[];
          try{for(const vp of [{name:'desktop',width:1440,height:900},{name:'landscape',width:844,height:390},{name:'portrait',width:390,height:844}]){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}}),page=await context.newPage();await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');
            await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.setPosition(900,600);d.spawnWolfAt(900,600);d.advance(0);});await page.waitForTimeout(1250);
            const red=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,c=document.querySelector('#game'),ctx=c.getContext('2d'),p=d.snapshot().player,e=d.enemies()[0],x=Math.floor(c.width/2),y=Math.floor(c.height/2);let pixels=0;for(let dy=-21;dy<=21;dy++)for(let dx=-21;dx<=21;dx++){if(Math.hypot(dx,dy)<15||Math.hypot(dx,dy)>21)continue;const a=ctx.getImageData(x+dx,y+dy,1,1).data;if(Math.abs(a[0]-213)<8&&Math.abs(a[1]-122)<8&&Math.abs(a[2]-111)<8)pixels++;}return{hp:p.hp,wolfHp:e.hp,distance:Math.hypot(e.x-p.x,e.y-p.y),wolfRadius:e.r,playerRadius:p.r,alertPixels:pixels,hasCue:!!document.querySelector('#combat-cue')};});
            assert.ok(red.hp<100);assert.ok(red.distance<2);assert.equal(red.alertPixels,0);assert.equal(red.hasCue,false);
            await mkdir('evidence/before-screens',{recursive:true});await page.screenshot({path:`evidence/before-screens/${vp.name}-occluded.png`});records.push({vp,...red});await context.close();
          }console.log('PASS unchanged baseline reproduces damaging wolf obscured by player body in all three viewports');}finally{await writeFile('evidence/baseline.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          node .combat-red.mjs
      - name: Apply presentation-only candidate after reproduced evidence
        run: |
          set -o pipefail
          python3 .combat-ui-author.py | tee evidence/preservation.log
          node --check src/game.js && node --check src/play-ui.js && node --check tests/combat-ui.mjs
          git diff --check
          cp -r src tests index.html styles.css evidence/source/
          git diff 9c1c957ebf48b97e93ea23d7daa2ed7e87a7dcdf -- src tests > evidence/candidate.diff
      - name: Full canonical gameplay and UI proof
        env:
          UI_EVIDENCE_DIR: evidence/canonical
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ | tee evidence/full-proof.log
      - name: Five-size full UI and combat visual proof
        run: |
          cat > .combat-visual.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {mkdir,writeFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          import {provePlayUi} from './tests/play-ui.mjs';
          const browser=await chromium.launch({headless:true}),records=[];
          try{for(const vp of [{name:'desktop',width:1440,height:900,touch:false},{name:'landscape',width:844,height:390,touch:true},{name:'portrait',width:390,height:844,touch:true},{name:'small-landscape',width:667,height:375,touch:true},{name:'small-portrait',width:375,height:667,touch:true}]){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.touch}),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');await mkdir('evidence/screens',{recursive:true});await page.screenshot({path:`evidence/screens/${vp.name}-default.png`});
            await provePlayUi(page,vp);
            await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.setPosition(900,600);const id=d.spawnWolfAt(900,600);d.enemy(id).attackCd=100;d.advance(0);});await page.waitForTimeout(80);
            if(vp.name==='portrait'||vp.name==='landscape'){await page.addStyleTag({content:'body{padding:20px 12px 16px!important}#app{height:calc(100dvh - 36px)!important}'});await page.waitForTimeout(220);}
            const geometry=await page.evaluate(()=>{const c=document.querySelector('#combat-cue'),b=c.getBoundingClientRect(),w=document.querySelector('#game').getBoundingClientRect();return{w:innerWidth,h:innerHeight,sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,box:b.toJSON(),canvas:w.toJSON(),textWidth:c.scrollWidth,clientWidth:c.clientWidth,actions:[...document.querySelectorAll('.action-deck button')].filter(e=>e.getBoundingClientRect().width).map(e=>e.getBoundingClientRect().toJSON())};});
            assert.ok(geometry.sw<=geometry.w+1&&geometry.sh<=geometry.h+1&&geometry.textWidth<=geometry.clientWidth+1);assert.ok(geometry.box.bottom<=geometry.canvas.bottom&&geometry.box.top>=geometry.canvas.top);for(const b of geometry.actions)assert.ok(b.top>=geometry.box.bottom&&b.left>=0&&b.right<=geometry.w&&b.bottom<=geometry.h);
            await page.screenshot({path:`evidence/screens/${vp.name}-close-threat.png`});assert.deepEqual(errors,[]);records.push({vp,geometry,pass:true});await context.close();
          }console.log('PASS five-size original and new UI controls, inventories, skill/combat states, native inputs, rotations and safe insets');}finally{await writeFile('evidence/visual.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          set -o pipefail
          UI_EVIDENCE_DIR=evidence/screens node .combat-visual.mjs | tee evidence/visual.log
      - name: Commit only proven candidate to exact owned branch
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 9c1c957ebf48b97e93ea23d7daa2ed7e87a7dcdf
          test "$(git ls-remote origin refs/heads/custodian/ui-first-outing | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js src/play-ui.js src/play-ui.css tests/play-ui.mjs
          git commit -m 'UI: reveal overlapping threats and current combat action readiness'
          git push origin HEAD:refs/heads/custodian/ui-first-outing
          git rev-parse HEAD > evidence/candidate-head.txt
          git ls-tree -r HEAD > evidence/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-ui-acceptance
          path: evidence
          retention-days: 14
