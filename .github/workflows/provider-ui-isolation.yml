name: Branch-only provider UI proof isolation
on:
  push:
    branches: [custodian/0.92-provider-ui-proof-isolation]
    paths: [.github/workflows/provider-ui-isolation.yml]
permissions:
  contents: write
jobs:
  isolate:
    if: github.ref == 'refs/heads/custodian/0.92-provider-ui-proof-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact parent and unchanged runtime
        run: |
          test "$(git rev-parse HEAD^)" = "50545a06def17edc8134e808c9336f64f50adf33"
          test "$(git hash-object src/game.js)" = "5280ebda9a7f73d8d8a7868079cd38e7430cb1e3"
          test "$(git hash-object tests/smoke.mjs)" = "03b803484e94fd62711aadb07f15b3ee4584c7c1"
      - name: Reproduce contextual overlap against unchanged game
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/provider-proof.log 2>&1 &
          sleep 2
          cat > provider-overlap-diagnostic.mjs <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();await page.goto('http://127.0.0.1:4173/');
            const result=await page.evaluate(()=>{
              const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();const r=d.npc('rowan'),l=d.landmarks().find(x=>x.id==='stonepine-trail-ledger');
              r.goal='idle';r.think=999;r.x=l.x;r.y=l.y;r.target={x:r.x,y:r.y};d.setPosition(r.x,r.y);d.advance(0);
              const near={name:document.querySelector('#nearby b').textContent,type:document.getElementById('nearby-type').textContent};
              r.x=30;r.y=30;r.target={x:r.x,y:r.y};d.setPosition(r.x,r.y);d.advance(0);
              const isolated={name:document.querySelector('#nearby b').textContent,type:document.getElementById('nearby-type').textContent};return{near,isolated};
            });
            assert.equal(result.near.name,'Stonepine Trail Ledger');assert.equal(result.near.type,'expedition');assert.equal(result.isolated.name,'Rowan');assert.equal(result.isolated.type,'trader');console.log('REPRODUCED context priority; isolated NPC view',JSON.stringify(result));
          }finally{await browser.close();}
          JS
          node provider-overlap-diagnostic.mjs
          rm provider-overlap-diagnostic.mjs
      - name: Correct only the failing fixture position
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/smoke.mjs');text=p.read_text()
          old="    const contradictedProviderUi=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,r=d.npc('rowan');d.setPosition(r.x,r.y);d.advance(.01);return document.querySelector('#nearby')?.innerText||'';});"
          new="    // Read Rowan's provider evidence outside landmark context; a wandering NPC can stand beside the Trail Ledger.\n"+old.replace("r=d.npc('rowan');d.setPosition", "r=d.npc('rowan');r.x=30;r.y=30;d.setPosition")
          assert text.count(old)==1;text=text.replace(old,new);p.write_text(text)
          PY
          node --check tests/smoke.mjs
          git diff --check
          test "$(git hash-object src/game.js)" = "5280ebda9a7f73d8d8a7868079cd38e7430cb1e3"
      - name: Preflight full unchanged runtime and corrected proof
        run: node tests/smoke.mjs http://127.0.0.1:4173/
      - name: Commit test-only correction and remove temporary job
        run: |
          test "$(git ls-remote origin refs/heads/custodian/0.92-provider-ui-proof-isolation | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/provider-ui-isolation.yml
          git add tests/smoke.mjs .github/workflows/provider-ui-isolation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Test: isolate provider evidence view from landmark context'
          test "$(git diff --name-only 50545a06def17edc8134e808c9336f64f50adf33 HEAD)" = 'tests/smoke.mjs'
          git diff --stat 50545a06def17edc8134e808c9336f64f50adf33 HEAD
          git push origin HEAD:refs/heads/custodian/0.92-provider-ui-proof-isolation
