name: Isolate cooperation proof from incidental rescues
on:
  push:
    branches: [custodian/0.94-cooperation-proof-isolation]
    paths: [.github/workflows/cooperation-proof-isolation.yml]
permissions:
  contents: write
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact merged UI and isolate only the failed test
        run: |
          test "$(git rev-parse HEAD^)" = c9bf80c02c07a7a838ab4c26596281ec56ff2b56
          test "$(git hash-object src/game.js)" = 61d38c8a67bbbfe9c2cb64e396058bdf70021173
          test "$(git hash-object tests/smoke.mjs)" = f5b2331d528177f08908c8aa75d214f7eea9e720
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/smoke.mjs');s=p.read_text();start=s.index('    const damagedCooperation=await page.evaluate(');end=s.index('    const damagedTamsin=',start);old=s[start:end]
          assert old.count('d.advance(.5)')==1 and old.count('d.advance(.25)')==2
          helper="const advanceWithoutDanger=seconds=>{const steps=Math.max(1,Math.ceil(seconds/.1));for(let step=0;step<steps;step++){d.clearEnemies();d.advance(seconds/steps);}d.clearEnemies();};"
          patched=old.replace('d.reset();d.clearEnemies();','d.reset();d.clearEnemies();'+helper,1).replace('d.advance(.5)','advanceWithoutDanger(.5)').replace('d.advance(.25)','advanceWithoutDanger(.25)')
          comment='    // Keep this relationship-only fixture free of random wolf rescues, using the same simulation substeps.\n'
          s=s[:start]+comment+patched+s[end:];p.write_text(s)
          # The complete original outcome assertions after the fixture are unchanged.
          assert s[s.index('    const damagedTamsin='):]==Path('tests/smoke.mjs').read_text()[s.index('    const damagedTamsin='):]
          PY
          node --check tests/smoke.mjs
          git diff --check
      - name: Repeat exact isolated assertions then run full gameplay and UI proof
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/cooperation-proof.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readFileSync} from 'node:fs';
          const source=readFileSync('tests/smoke.mjs','utf8');
          const start=source.indexOf('    const damagedCooperation=await page.evaluate(');
          const end=source.indexOf('    await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.save());',start);
          const fixture=source.slice(start,end);
          const browser=await chromium.launch();
          try{const page=await browser.newPage();await page.goto('http://127.0.0.1:4173/');const vp={name:'isolated-cooperation'};
            for(let i=0;i<12;i++){
              const run=new Function('page','vp',`return (async()=>{${fixture};return {relationAfterReferral:damagedCooperation.relationAfterReferral,relationAfterPoor:damagedCooperation.relationAfterPoor,chosen:damagedCooperation.chosen};})()`);
              console.log('COOPERATION_ISOLATED',i,JSON.stringify(await run(page,vp)));
            }
          }finally{await browser.close();}
          JS
          node tests/smoke.mjs http://127.0.0.1:4173/
      - name: Commit test-only correction and remove temporary workflow
        run: |
          test "$(git ls-remote origin refs/heads/custodian/0.94-cooperation-proof-isolation | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code -- src/game.js src/play-ui.js src/play-ui.css index.html styles.css tests/play-ui.mjs .github/workflows/reboot-game-proof.yml
          git rm .github/workflows/cooperation-proof-isolation.yml
          git add tests/smoke.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Test: isolate social repair consequence from random Warden rescues'
          git push origin HEAD:refs/heads/custodian/0.94-cooperation-proof-isolation
