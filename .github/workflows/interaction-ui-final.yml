name: Contextual Use final acceptance (branch only)
on:
  push:
    branches: [custodian/ui-contextual-use]
    paths: [.github/workflows/interaction-ui-final.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Final wording and real-input regression
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/custodian/ui-contextual-use
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = d84d354aaf5918805160377e76efdebee686a984
          mkdir -p evidence/source
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='d84d354aaf5918805160377e76efdebee686a984'
          proven='7b6285036f280cacfad52401f0d85f36d0e665ba'
          p=Path('src/game.js');s=p.read_text();assert s.encode()==subprocess.check_output(['git','show',proven+':src/game.js'])
          old='Tap ${preview.name} in the world to approach and use it directly.'
          assert s.count(old)==1;s=s.replace(old,'Tap ${preview.name} when it is clear to approach it directly; wait if the resident covers it.')
          old='Nearby resident has Use priority · tap the landmark'
          assert s.count(old)==1;s=s.replace(old,'Nearby resident has Use priority · see Nearby')
          lines=s.splitlines(True);near=[x for x in lines if x.startswith('  function renderNearby(')];assert len(near)==1
          revised=near[0].replace('Use E to','When in reach, use E to').replace('Use E here to','When in reach, use E here to').replace('then use E to','then move within reach and use E to')
          assert revised!=near[0];s=s.replace(near[0],revised);p.write_text(s)
          old_game=subprocess.check_output(['git','show',base+':src/game.js']).decode()
          old_near=next(x for x in old_game.splitlines(True) if x.startswith('  function renderNearby('))
          reverse=s.replace(revised,old_near)
          start=reverse.index('  // Presentation only. Use keeps its existing NPC > landmark > resource > drop priority.')
          end=reverse.index('  function renderPlayHud(){',start)
          reverse=reverse[:start]+reverse[end:];reverse=reverse.replace('  renderInteractionCue(p);\n','')
          old_direction=next(x for x in old_game.splitlines(True) if x.startswith("  let direction='';"))
          new_direction=next(x for x in reverse.splitlines(True) if x.startswith("  let direction='';"))
          reverse=reverse.replace(new_direction,old_direction)
          assert reverse==old_game,'Runtime changed outside display helper/reach wording/nearby instructions'
          for file in ['index.html','styles.css','tests/smoke.mjs','.github/workflows/reboot-game-proof.yml']:
              assert Path(file).read_bytes()==subprocess.check_output(['git','show',base+':'+file]),file
          test=Path('tests/interaction-ui.mjs');text=test.read_text();anchor="  // Resident priority is disclosed, not silently rewritten into a new target resolver."
          addition='''  // Real mouse/touch input must execute the suggested approach, not merely a debug target call.
            await setup();await page.evaluate(l=>{const d=window.__BRIAR_GLEN_DEBUG__,n=d.npc('rowan');n.x=l.x+60;n.y=l.y;d.setPosition(l.x+90,l.y);d.advance(0);},ledger);
            await hint('Details','npc');await page.waitForTimeout(80);
            const worldCanvas=page.locator('#game'),canvasBox=await worldCanvas.boundingBox();assert.ok(canvasBox);
            const point={x:canvasBox.width/2-90,y:canvasBox.height/2};
            if(vp.touch)await worldCanvas.tap({position:point});else await worldCanvas.click({position:point});
            await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__.stonepineExpedition().started,{timeout:5000});
            assert.equal(await page.locator('#panel-nearby').isVisible(),true);await shot('canvas-approach');
          
          '''
          assert text.count(anchor)==1;test.write_text(text.replace(anchor,addition+anchor))
          print('PASS final source preservation; only display text and additional real-input test changed')
          PY
          node --check src/game.js && node --check src/play-ui.js && node --check tests/play-ui.mjs && node --check tests/interaction-ui.mjs && node --check tests/smoke.mjs
          git diff --check
          cp -r src tests index.html styles.css evidence/source/
          mkdir -p evidence/source/.github/workflows
          cp .github/workflows/reboot-game-proof.yml evidence/source/.github/workflows/
          git diff d84d354aaf5918805160377e76efdebee686a984 -- src tests > evidence/candidate.diff
      - name: Install canonical browser and serve
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Full canonical gameplay and UI proof
        env:
          UI_EVIDENCE_DIR: evidence/canonical
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/full-proof.log
      - name: Five-size final screenshots and real-input acceptance
        env:
          UI_EVIDENCE_DIR: evidence/screens
        run: |
          cat > .interaction-final.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {mkdir} from 'node:fs/promises';
          import {chromium} from 'playwright';
          import {provePlayUi} from './tests/play-ui.mjs';
          const browser=await chromium.launch();
          try{for(const vp of [{name:'desktop-large',width:1440,height:900,touch:false},{name:'landscape',width:844,height:390,touch:true},{name:'portrait',width:390,height:844,touch:true},{name:'small-landscape',width:667,height:375,touch:true},{name:'small-portrait',width:375,height:667,touch:true}]){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.touch}),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');await page.waitForTimeout(220);await mkdir('evidence/screens',{recursive:true});await page.screenshot({path:`evidence/screens/${vp.name}-default.png`});
            await provePlayUi(page,vp);assert.deepEqual(errors,[]);await context.close();
          }console.log('PASS five-size final real mouse/touch approach, all panel paths, actions, reach states, orientation and screenshots');}finally{await browser.close();}
          JS
          set -o pipefail
          node .interaction-final.mjs 2>&1 | tee evidence/visual-proof.log
      - name: Commit verified bounded final candidate
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/custodian/ui-contextual-use
          test "$(git ls-remote origin refs/heads/custodian/ui-contextual-use | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = d84d354aaf5918805160377e76efdebee686a984
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js tests/interaction-ui.mjs
          git commit -m 'UI: qualify nearby instructions and prove real canvas approach'
          git push origin HEAD:refs/heads/custodian/ui-contextual-use
          git rev-parse HEAD > evidence/candidate-head.txt
          git ls-tree -r HEAD > evidence/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextual-use-final
          path: evidence
          include-hidden-files: true
          retention-days: 14
