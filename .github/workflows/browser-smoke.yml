name: Browser smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static integrity and syntax gate
        run: node tests/static-sanity.mjs
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 > /tmp/briarglen-http.log 2>&1 &
          echo $! > /tmp/briarglen-http.pid
          sleep 2
      - name: Test Build 25 approved art scope and Canvas rollback
        run: node tests/build25-production-smoke.mjs http://127.0.0.1:4173/
      - name: Test Build 26 approved Greenway scope
        run: node tests/build26-production-smoke.mjs http://127.0.0.1:4173/
      - name: Test Build 27 Mooncap entry and ruins canopy
        run: node tests/sprite-proof-smoke.mjs http://127.0.0.1:4173/
      - name: Test Build 27 production art gate
        run: node tests/build27-production-smoke.mjs http://127.0.0.1:4173/
      - name: Upload Build 27 Mooncap screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build27-mooncap-${{ github.sha }}
          path: test-artifacts/build27/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Test repository build in browser
        run: |
          node tests/smoke.mjs http://127.0.0.1:4173/
          node tests/world-smoke.mjs http://127.0.0.1:4173/
          node tests/controls-smoke.mjs http://127.0.0.1:4173/
          node tests/aiming-gear-smoke.mjs http://127.0.0.1:4173/
          node tests/skills-smoke.mjs http://127.0.0.1:4173/
          node tests/crafting-smoke.mjs http://127.0.0.1:4173/
          node tests/map-journal-smoke.mjs http://127.0.0.1:4173/
          node tests/fen-smoke.mjs http://127.0.0.1:4173/
          node tests/contracts-smoke.mjs http://127.0.0.1:4173/
          node tests/stability-smoke.mjs http://127.0.0.1:4173/
          node tests/game-feel-smoke.mjs http://127.0.0.1:4173/
          node tests/economy2-smoke.mjs http://127.0.0.1:4173/
          node tests/combat-identity-smoke.mjs http://127.0.0.1:4173/
          node tests/art-direction-smoke.mjs http://127.0.0.1:4173/
          node tests/feedback-tuning-smoke.mjs http://127.0.0.1:4173/
          node tests/stonepine-smoke.mjs http://127.0.0.1:4173/
          node tests/stonepine-integration-smoke.mjs http://127.0.0.1:4173/
          node tests/biome-art-smoke.mjs http://127.0.0.1:4173/
          node tests/hollow-den-art-smoke.mjs http://127.0.0.1:4173/
          node tests/runtime-architecture-smoke.mjs http://127.0.0.1:4173/
          node tests/onboarding-smoke.mjs http://127.0.0.1:4173/
          node tests/balance-pacing-smoke.mjs http://127.0.0.1:4173/
          node tests/final-polish-smoke.mjs http://127.0.0.1:4173/
      - name: Test deployed GitHub Pages build in browser
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node tests/smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/world-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/controls-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/aiming-gear-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/skills-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/crafting-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/map-journal-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/fen-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/contracts-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/stability-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/game-feel-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/economy2-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/combat-identity-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/art-direction-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/feedback-tuning-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/stonepine-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/stonepine-integration-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/biome-art-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/hollow-den-art-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/runtime-architecture-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/onboarding-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/balance-pacing-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/final-polish-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/build25-production-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/build26-production-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
          node tests/build27-production-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}" --live
