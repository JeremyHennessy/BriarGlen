name: Detour fixture isolation proof (temporary)
on:
  push:
    branches: [custodian/ui-exploration-leads]
    paths: [.github/workflows/detour-isolation-proof.yml]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Original runtime and exact reversible test patch
        run: |
          set -eu
          mkdir -p evidence
          test "$(git hash-object src/game.js)" = bbe35f9f86c33b4408f73a20ae4ea803e2c7105e
          cp tests/smoke.mjs evidence/original-smoke.mjs
          python3 .detour-fixture-author.py
          test "$(git hash-object tests/smoke.mjs)" = 3381a6b6b6f97d9315fd8284109cb0f62b15e84d
          cp tests/smoke.mjs evidence/patched-smoke.mjs
          git diff -- tests/smoke.mjs > evidence/test-only.diff
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps $ENGINE
          python3 -m http.server 4173 >/tmp/briar.log 2>&1 &
          sleep 2
      - name: Original red control, isolated positive cases and dangerous negative control
        run: |
          cat > .detour-isolation.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {chromium,webkit} from 'playwright';
          const engine=process.env.ENGINE,records=[];
          const extract=s=>{const prefix='    const autonomousDangerDetour=await page.evaluate(',line=s.split('\n').find(l=>l.startsWith(prefix));assert.ok(line);return line.slice(prefix.length,-2);};
          const original=extract(await readFile('evidence/original-smoke.mjs','utf8')),patched=extract(await readFile('tests/smoke.mjs','utf8'));
          const before=r=>r.wardenGoal!=='patrol'&&r.before.goal==='avoid'&&r.before.blocked&&!r.before.route;
          const after=r=>r.after.goal==='seek'&&!r.after.blocked&&r.after.avoidEnemyId===r.wolfId&&!!r.after.route?.resourceId&&r.after.wolf?.dead===false&&Number.isFinite(r.after.wolf.x)&&Number.isFinite(r.after.wolf.y)&&r.after.trust===0&&r.after.memory.some(m=>m.text.includes('After waiting for the Warden'));
          const browser=await {chromium,webkit}[engine].launch(),page=await browser.newPage();
          try{
            await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__);
            const run=async(fn,seed)=>page.evaluate(({fn,seed})=>{const old=Math.random;let v=seed;Math.random=()=>((v=(Math.imul(v,1664525)+1013904223)>>>0)/4294967296);try{return (0,eval)(`(${fn})`)();}finally{Math.random=old;}},{fn,seed});
            const red=await run(original,62);records.push({type:'original-red',seed:62,result:red});assert.equal(before(red),true);assert.equal(after(red),false);assert.equal(red.after.goal,'avoid');assert.equal(red.after.wolf.dead,false);
            for(let seed=1;seed<=128;seed++){const r=await run(patched,seed);records.push({type:'isolated',seed,result:r});assert.equal(before(r),true,`seed${seed}: original response window`);assert.equal(after(r),true,`seed${seed}: original exact safe-detour outcome`);}
            const a="d.rethink('mira');const after={goal:m.goal",b="d.spawnWolfAt(m.x+40,m.y);d.rethink('mira');const after={goal:m.goal";assert.equal(patched.split(a).length,2);
            const unsafe=await run(patched.replace(a,b),62);records.push({type:'unsafe-negative',seed:62,result:unsafe});assert.equal(before(unsafe),true);assert.equal(unsafe.after.goal,'avoid');assert.ok(unsafe.after.blocked);assert.equal(unsafe.after.route,null);assert.equal(unsafe.after.wolf.dead,false);assert.equal(unsafe.after.trust,0);
            console.log(`PASS ${engine}: originalseed62red,128 isolated fixture cases with unchanged assertions/windows, and added-nearby-hazard refusal. No runtime code changed.`);
          }finally{await writeFile('evidence/isolation.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          set -o pipefail
          node .detour-isolation.mjs 2>&1 | tee evidence/proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detour-isolation-${{ matrix.engine }}
          path: evidence
          retention-days: 14
