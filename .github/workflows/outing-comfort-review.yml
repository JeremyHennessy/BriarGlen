name: Ordinary outing and comfort inspection (branch only)
on:
  push:
    branches: [custodian/ui-outing-comfort]
    paths: [.journey/plan.json]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact frontend and continuation pointer
        id: plan
        run: |
          set -eu
          git diff --exit-code d253e62349e1a99b4bdb2291449b7c60626b7eca -- src index.html styles.css
          echo "resume=$(node -p 'JSON.parse(require("fs").readFileSync(".journey/plan.json")).resume || 0')" >> "$GITHUB_OUTPUT"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-head.txt
          git ls-tree -r HEAD > evidence/source-tree.txt
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.resume != '0'
        with:
          name: ordinary-first-outing
          path: .journey/resume
          run-id: ${{ steps.plan.outputs.resume }}
          github-token: ${{ github.token }}
      - name: Install canonical browser and serve
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/briar.log 2>&1 &
          sleep 2
      - name: Player-visible ordinary inputs only
        run: node .journey/runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-first-outing
          path: evidence
          retention-days: 14
