name: Disclosure close-layout comparison (temporary)
on:
  push:
    branches: [custodian/ui-exploration-leads]
    paths: [.github/workflows/exploration-close-layout-proof.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENGINE: chromium
      UI_EVIDENCE_DIR: evidence/screens
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Same code, same lifecycle, native frame observation only
        run: |
          mkdir -p evidence/before evidence/source
          git archive e18b09e4c24ca0e05f51066e1f3f2c42cc20d460 src tests index.html styles.css | tar -x -C evidence/before
          python3 .exploration-author-final.py
          cp -r src tests evidence/source/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.exploration-visual-final.mjs');s=p.read_text();a=s.index('const sizes=');b=s.index('\n',a)
          s=s[:a]+"const sizes=[{name:'small-portrait',width:375,height:667}];"+s[b:];p.write_text(s)
          p=Path('tests/expedition-guide.mjs');s=p.read_text()
          a="""  await leadSummary.focus();await page.keyboard.press('Enter');assert.equal(await leads.getAttribute('open'),null);
            await page.keyboard.down('Space');await page.waitForTimeout(650);await page.keyboard.up('Space');
            assert.notEqual(await leads.getAttribute('open'),null);assert.deepEqual(await state(),beforeLeads);""".replace('\n            ','\n  ')
          b="""  const rows=[];
            await page.evaluate(()=>{window.__activationEvents=[];const d=document.querySelector('#exploration-leads');for(const type of ['keydown','keyup','click'])d.querySelector('summary').addEventListener(type,e=>window.__activationEvents.push({type,key:e.key,t:performance.now(),active:e.target.matches(':active'),open:d.open}));d.addEventListener('toggle',()=>window.__activationEvents.push({type:'toggle',t:performance.now(),open:d.open}));});
            const frames=()=>leadSummary.evaluate(el=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(()=>resolve({focus:document.activeElement===el,open:el.parentElement.open})))));
            for(let i=0;i<10;i++)for(const mode of ['immediate','rendered']){
              await leadSummary.focus();if(await leads.getAttribute('open')!==null)await page.keyboard.press('Enter');await frames();
              await activate('#exploration-leads summary');await leadSummary.focus();await page.keyboard.press('Enter');assert.equal(await leads.getAttribute('open'),null);
              if(mode==='rendered')assert.deepEqual(await frames(),{focus:true,open:false});
              await page.keyboard.down('Space');const active=await leadSummary.evaluate(el=>el.matches(':active'));await page.waitForTimeout(650);await page.keyboard.up('Space');
              const record={i,mode,active,open:await leads.getAttribute('open')!==null,focus:await leadSummary.evaluate(el=>document.activeElement===el),events:await page.evaluate(()=>window.__activationEvents.slice(-7))};rows.push(record);console.log('CLOSE_LAYOUT '+JSON.stringify(record));
              if(mode==='rendered'){assert.equal(record.open,true);assert.equal(record.focus,true);}assert.deepEqual(await state(),beforeLeads);
            }
            console.log('SUMMARY '+JSON.stringify({immediateFailures:rows.filter(r=>r.mode==='immediate'&&!r.open).length,renderedFailures:rows.filter(r=>r.mode==='rendered'&&!r.open).length}));
            assert.notEqual(await leads.getAttribute('open'),null);""".replace('\n            ','\n  ')
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          PY
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/after.log 2>&1 &
          python3 -m http.server 4174 --directory evidence/before >/tmp/before.log 2>&1 &
          sleep 2
      - name: Actual native comparison in the reproduced lifecycle context
        run: |
          set -o pipefail
          node .exploration-visual-final.mjs 2>&1 | tee evidence/comparison.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploration-close-layout-comparison
          path: evidence
          retention-days: 14
