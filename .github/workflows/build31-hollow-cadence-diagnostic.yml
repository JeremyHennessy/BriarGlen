name: Build 31 Hollow cadence diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/build31-hollow-cadence-diagnostic.yml'
      - 'tests/hollow-cadence-probe.mjs'
  workflow_dispatch:

jobs:
  hollow-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 > /tmp/briarglen-hollow-diag.log 2>&1 &
          sleep 2
      - name: Measure desktop Hollow renderer progression
        run: node tests/hollow-cadence-probe.mjs http://127.0.0.1:4173/
      - name: Re-run unchanged fixed-delay acceptance test
        run: node tests/hollow-den-art-smoke.mjs http://127.0.0.1:4173/
