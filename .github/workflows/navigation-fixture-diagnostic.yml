name: Navigation fixture diagnostic (branch only)
on:
  push:
    branches: [custodian/ui-expedition-navigation]
    paths: [.github/workflows/navigation-fixture-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser setup
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/game.log 2>&1 &
          sleep 2
      - name: Controlled old-reset versus fresh-document isolation
        run: |
          mkdir -p evidence
          cat > .fixture-diagnostic.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          const browser=await chromium.launch(),page=await browser.newPage(),records=[];
          try{
            await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');
            const original=await page.evaluate(()=>{
              const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();const l=d.landmarks().find(l=>l.id==='stonepine-trail-ledger');
              d.setPosition(l.x+53,l.y);const id=d.spawnWolfAt(l.x+53,l.y);d.setEnemyHp(id,1);d.attack();
              const created=d.drops();d.reset();d.clearEnemies();for(const n of d.snapshot().npcs){d.npc(n.id).x=30;d.npc(n.id).y=30;}d.setPosition(l.x+53,l.y);d.advance(0);
              return{created,retained:d.drops(),hint:document.querySelector('#interact-readiness').textContent,position:d.snapshot().player.x};
            });
            assert.equal(original.created.length,1);assert.equal(original.retained.length,1);assert.equal(original.hint,'Pick up');records.push({original});
            await page.evaluate(()=>localStorage.removeItem('briar-glen-reboot-v1'));await page.reload();await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');
            const isolated=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();for(const n of d.snapshot().npcs){d.npc(n.id).x=30;d.npc(n.id).y=30;}const l=d.landmarks().find(l=>l.id==='stonepine-trail-ledger');d.setPosition(l.x+53,l.y);d.advance(0);return{drops:d.drops(),hint:document.querySelector('#interact-readiness').textContent};});
            assert.equal(isolated.drops.length,0);assert.equal(isolated.hint,'Closer');records.push({isolated});
            await page.locator('[data-panel="character"]').click();await page.locator('[data-skill="guard"]').focus();
            await page.waitForTimeout(650);records.push({skillFocusRetained:await page.locator('[data-skill="guard"]').evaluate(el=>el===document.activeElement)});
            console.log('PASS controlled retained-loot reproduction: ordinary wolf drop survives reset; fresh document removes cross-test contamination without changing reset/loot/Use rules.');
          }finally{await writeFile('evidence/diagnostic.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          set -o pipefail
          node .fixture-diagnostic.mjs 2>&1 | tee evidence/proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-fixture-diagnostic
          path: evidence
          retention-days: 14
