name: Live controls final acceptance (branch only)
on:
  push:
    branches: [custodian/ui-live-control-stability]
    paths: [.github/workflows/live-controls-final.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct reproduced clipped-focus edge only
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/custodian/ui-live-control-stability
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = b498ca646705bc85fe29ad3e6c45690276ed738c
          test "$(git hash-object src/game.js)" = a200f0dc4625f568725cc163bb95d72250a46da8
          mkdir -p evidence/source evidence/before
          git archive b498ca646705bc85fe29ad3e6c45690276ed738c src tests index.html styles.css .github/workflows/reboot-game-proof.yml | tar -x -C evidence/before
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game.js');old=p.read_text()
          needle='      (replacement||panel).focus({preventScroll:true});panel.scrollTop=scrollTop;'
          extra='\n      if(replacement){const box=replacement.getBoundingClientRect(),bounds=panel.getBoundingClientRect();if(box.top<bounds.top)panel.scrollTop-=bounds.top-box.top;else if(box.bottom>bounds.bottom)panel.scrollTop+=box.bottom-bounds.bottom;}'
          assert old.count(needle)==1;new=old.replace(needle,needle+extra,1);assert new.replace(extra,'',1)==old;p.write_text(new)
          p=Path('tests/live-ui-stability.mjs');s=p.read_text()
          s=s.replace("const guard=page.locator('[data-skill=\"guard\"]');await guard.focus();","const guard=page.locator('[data-skill=\"guard\"]');await page.keyboard.press('Tab');await guard.focus();",1)
          needle="await page.waitForTimeout(650);await focusIs('[data-skill=\"guard\"]');"
          assert s.count(needle)==1;s=s.replace(needle,needle+"assert.equal(await guard.evaluate(el=>el.matches(':focus-visible')),true,'Keyboard focus must remain visibly indicated');",1)
          needle="  const beforeSwitch=await state();"
          extra='''  // A same-target live update must not scroll the focused action out of sight on a phone.
            const growing=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,n=d.npc('mira');n.x=900;n.y=600;n.name='Mira the Experienced Herbalist of Briar Glen and the Greenwood';n.goalText='Preparing a careful delivery of medicine and supplies for a resident on the far side of the village.';d.advance(0);const b=document.querySelector('[data-near="buy"]').getBoundingClientRect().toJSON(),p=document.querySelector('#panel-nearby').getBoundingClientRect().toJSON();return{b,p};});
            await focusIs('[data-near="buy"]');assert.ok(growing.b.top>=growing.p.top-1&&growing.b.bottom<=growing.p.bottom+1,`${vp.name}: live content hid the focused action`);await shot('resident-growing');
          '''
          assert s.count(needle)==1;s=s.replace(needle,extra+needle,1);p.write_text(s)
          # No changes outside the previously reviewed renderers/helper and original markup.
          original=Path('evidence/before/src/game.js').read_text();reverted=new
          a=reverted.index('  // Presentation-only DOM continuity:');b=reverted.index('  function renderSkills()',a);reverted=reverted[:a]+reverted[b:]
          for name in ['renderSkills','renderInventory','renderNearby']:
              oldline=next(l for l in original.splitlines() if f'function {name}(' in l)
              newline=next(l for l in reverted.splitlines() if f'function {name}(' in l)
              reverted=reverted.replace(newline,oldline,1)
          assert reverted==original
          for f in ['index.html','styles.css','src/play-ui.js','src/play-ui.css','tests/smoke.mjs','tests/interaction-ui.mjs','.github/workflows/reboot-game-proof.yml']:
              assert Path(f).read_bytes()==Path('evidence/before',f).read_bytes(),f
          print('PASS exact source preservation outside live-control presentation and new regression assertions')
          PY
          node --check src/game.js && node --check tests/play-ui.mjs && node --check tests/live-ui-stability.mjs
          git diff --check
          cp -r src tests index.html styles.css evidence/source/
          mkdir -p evidence/source/.github/workflows
          cp .github/workflows/reboot-game-proof.yml evidence/source/.github/workflows/
          git diff b498ca646705bc85fe29ad3e6c45690276ed738c -- src tests > evidence/candidate.diff
      - name: Install canonical browser and serve
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/game.log 2>&1 &
          sleep 2
      - name: Full canonical gameplay and UI proof
        env:
          UI_EVIDENCE_DIR: evidence/canonical
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/full-proof.log
      - name: Final five-size focus, input, UI and inset screenshots
        run: |
          cat > .live-final.mjs <<'JS'
          import assert from 'node:assert/strict';import {mkdir,writeFile} from 'node:fs/promises';import {chromium} from 'playwright';import {provePlayUi} from './tests/play-ui.mjs';
          const browser=await chromium.launch(),records=[];process.env.UI_EVIDENCE_DIR='evidence/screens';await mkdir(process.env.UI_EVIDENCE_DIR,{recursive:true});
          try{for(const vp of [{name:'desktop',width:1440,height:900,touch:false},{name:'landscape',width:844,height:390,touch:true},{name:'portrait',width:390,height:844,touch:true},{name:'small-landscape',width:667,height:375,touch:true},{name:'small-portrait',width:375,height:667,touch:true}]){
            const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.touch}),page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');await page.screenshot({path:`evidence/screens/${vp.name}-default.png`});
            await provePlayUi(page,vp);
            await page.addStyleTag({content:'body{padding:20px 12px 16px !important}'});await page.waitForTimeout(220);
            const g=await page.evaluate(()=>({w:innerWidth,h:innerHeight,sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,controls:['#hp','#energy','#attack-btn','#interact-btn','#quick-brace','#quick-tonic'].map(s=>document.querySelector(s).getBoundingClientRect().toJSON())}));assert.ok(g.sw<=g.w+1&&g.sh<=g.h+1);for(const b of g.controls)assert.ok(b.left>=11&&b.right<=g.w-11&&b.top>=19&&b.bottom<=g.h-15,'Inset control inaccessible');
            await page.screenshot({path:`evidence/screens/${vp.name}-insets.png`});assert.deepEqual(errors,[]);records.push({vp,geometry:g,errors});await ctx.close();
          }console.log('PASS final five-size native delayed/held controls, keyboard-visible focus, growing content in bounds, context changes, all panels, save/resize/inset tests');}finally{await writeFile('evidence/final.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          set -o pipefail
          node .live-final.mjs 2>&1 | tee evidence/final.log
      - name: Commit only tested final candidate
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/custodian/ui-live-control-stability
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = b498ca646705bc85fe29ad3e6c45690276ed738c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js tests/live-ui-stability.mjs
          git commit -m 'UI: keep restored action focus visible when live content grows'
          git push origin HEAD:refs/heads/custodian/ui-live-control-stability
          git rev-parse HEAD > evidence/candidate-head.txt
          git ls-tree -r HEAD > evidence/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-controls-final
          path: evidence
          include-hidden-files: true
          retention-days: 14
