name: Branch-only Mirecaller authoring
on:
  push:
    branches: [custodian/build-0.93-moss-fen-mirecaller]
    paths: [.github/workflows/mirecaller-authoring.yml]
permissions:
  contents: write
jobs:
  author:
    if: github.ref == 'refs/heads/custodian/build-0.93-moss-fen-mirecaller'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact checkpoint and input files
        run: |
          test "$(git rev-parse HEAD^)" = c77928bdfc8378afda35a4fc3ef8965e50fc32fd
          test "$(git hash-object src/game.js)" = 5280ebda9a7f73d8d8a7868079cd38e7430cb1e3
          test "$(git hash-object tests/smoke.mjs)" = 1470ce87e1830bca6cdefc2db4f6ef6716e65415
          test "$(git hash-object .github/workflows/reboot-game-proof.yml)" = 2dc5e4a39e7ab21d917a0c0af6afe69c0d5fc070
      - name: Apply the bounded encounter and regression proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game.js');s=p.read_text()
          def replace(old,new,count=1):
              global s
              assert s.count(old)==count,(old,s.count(old),count)
              s=s.replace(old,new)
          def in_function(name,old,new):
              global s
              lines=s.splitlines(keepends=True)
              indexes=[i for i,l in enumerate(lines) if l.startswith('  function '+name+'(')]
              assert len(indexes)==1,name
              i=indexes[0];assert lines[i].count(old)==1,(name,old)
              lines[i]=lines[i].replace(old,new);s=''.join(lines)
          replace("version:'0.92.0'","version:'0.93.0'")
          replace("    trailpack:{name:'Trail Pack'", "    mireglass:{name:'Mireglass Lens',weight:.2,base:0,kind:'relic',color:'#7fcaad'},\n    trailpack:{name:'Trail Pack'")
          in_function('addItem',"if(!itemDefs[id])return false;","if(!itemDefs[id])return false;if(id==='mireglass'&&itemCount(id)>0)return false;")
          replace("player.surveyUntil=performance.now()+7000;", "player.surveyUntil=performance.now()+(itemCount('mireglass')>0?11000:7000);")
          replace("'Survey: quality and resources revealed'", "(itemCount('mireglass')>0?'Mireglass Survey: quality and resources revealed for 11 seconds':'Survey: quality and resources revealed')")
          in_function('waycacheStorable',"itemDefs[id].kind!=='pack'", "itemDefs[id].kind!=='pack'&&itemDefs[id].kind!=='relic'")
          spawn="""  function ensureMirecaller(x=1635,y=1100){let e=world.enemies.find(e=>e.id==='mirecaller');if(!e){e={id:'mirecaller',type:'mirecaller',name:'Mirecaller',x,y,r:18,hp:72,maxHp:72,playerOnly:true,attackCd:0,windup:0,markX:null,markY:null,burst:0,dead:false};world.enemies.push(e);}e.playerOnly=true;return e;}
          """
          replace('  function seedEnemies(){',spawn+'  function seedEnemies(){')
          in_function('seedEnemies','ensureStonepinePack();','ensureStonepinePack();ensureMirecaller();')
          in_function('load',"!e?.dead||e?.id==='emberback'||e?.type==='emberback'", "!e?.dead||e?.id==='emberback'||e?.type==='emberback'||e?.type==='mirecaller'")
          in_function('load','ensureStonepinePack();','ensureStonepinePack();ensureMirecaller();')
          in_function('respawn',"!e.dead||e.id==='emberback'||e.type==='emberback'", "!e.dead||e.id==='emberback'||e.type==='emberback'||e.type==='mirecaller'")
          in_function('respawn','world.enemies.filter(e=>!e.dead).length<7','world.enemies.filter(e=>!e.dead&&!e.playerOnly).length<7')
          # Player-only content must not redirect resident work or be auto-farmed.
          for name in ['dangerNear','dangerOnRoute']:
              in_function(name,'if(e.dead)continue;','if(e.dead||e.playerOnly)continue;')
          in_function('dangerReportEnemy','if(!enemy){','if(!enemy||enemy.playerOnly){')
          replace('const liveEnemies=world.enemies.filter(e=>!e.dead).sort', 'const liveEnemies=world.enemies.filter(e=>!e.dead&&!e.playerOnly).sort')
          in_function('attack','if(e.dead)continue;', 'if(e.dead||(e.playerOnly&&apprenticeState().enabled))continue;')
          in_function('defeatEnemy','e.dead=true;',"e.dead=true;if(e.type==='mirecaller'){e.windup=0;e.burst=0;world.drops.push({id:`d${world.serial++}`,x:e.x,y:e.y,item:'mireglass',quality:2.8});player.coins+=12;log('The Mirecaller fell. Its Mireglass Lens lies in the reeds; carry it to extend Fieldcraft Survey.','combat');toast('Mirecaller defeated · 12c · pick up the Mireglass Lens');return true;}")
          update="""  function updateMirecaller(e,dt){if(e.dead)return;e.attackCd=Math.max(0,Number(e.attackCd||0)-dt);e.burst=Math.max(0,Number(e.burst||0)-dt);if(e.windup>0){e.windup=Math.max(0,e.windup-dt);if(e.windup===0){e.burst=.3;if(Number.isFinite(e.markX)&&Number.isFinite(e.markY)&&Math.hypot(player.x-e.markX,player.y-e.markY)<=48+player.r){const braced=player.guarded;player.guarded=false;takePlayerHit(braced?6:16);toast(braced?'Brace softened the mire burst — moving out avoids it':'Mire burst! Move outside the marked ground');if(player.hp<=0)recoverPlayerFromDefeat('The Mirecaller drove you out of Moss Fen. You were carried back to Briar Glen.');else save();}}return;}if(dist(player,e)<=160&&e.attackCd<=0){e.markX=player.x;e.markY=player.y;e.windup=.9;e.attackCd=2.4;toast('Mirecaller marks the ground — move out of the ring!');}}
          """
          replace('  function updateEnemy(e,dt){',update+"  function updateEnemy(e,dt){if(e.type==='mirecaller'){updateMirecaller(e,dt);return;}")
          draw="""  function drawMirecaller(e){const p=worldToScreen(e.x,e.y);ctx.save();if((e.windup>0||e.burst>0)&&Number.isFinite(e.markX)&&Number.isFinite(e.markY)){const m=worldToScreen(e.markX,e.markY);ctx.fillStyle=e.burst>0?'rgba(127,202,173,.5)':'rgba(240,199,120,.2)';ctx.strokeStyle='#f0c778';ctx.lineWidth=3;ctx.beginPath();ctx.arc(m.x,m.y,48,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#f0efe4';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(e.windup>0?'Move out!':'Mire burst',m.x,m.y-56);}ctx.fillStyle='#3a5550';ctx.beginPath();ctx.arc(p.x,p.y,e.r,0,TAU);ctx.fill();ctx.strokeStyle='#7fcaad';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#7fcaad';ctx.beginPath();ctx.arc(p.x,p.y,6,0,TAU);ctx.fill();ctx.fillStyle='#f0efe4';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('Mirecaller',p.x,p.y-30);ctx.fillStyle='#1b1614';ctx.fillRect(p.x-24,p.y-25,48,5);ctx.fillStyle='#7fcaad';ctx.fillRect(p.x-24,p.y-25,48*clamp(e.hp/e.maxHp,0,1),5);ctx.restore();}
          """
          replace('  function drawEnemies(){',draw+'  function drawEnemies(){')
          in_function('drawEnemies','if(e.dead)continue;',"if(e.dead)continue;if(e.type==='mirecaller'){drawMirecaller(e);continue;}")
          replace('    enemies:()=>copy(world.enemies),',"    spawnMirecallerAt:(x,y)=>ensureMirecaller(x,y).id,\n    apprenticeCandidates:()=>copy(apprenticeCandidates()),\n    enemies:()=>copy(world.enemies),")
          p.write_text(s)
          p=Path('tests/smoke.mjs');t=p.read_text();t=t.replace("version==='0.92.0'","version==='0.93.0'").replace("saved.build!=='0.92.0'","saved.build!=='0.93.0'")
          proof=r"""
              // BUILD 0.93: stationary marked-ground encounter; no resident or auto-play targeting.
              const mireSeed=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();const e=d.enemy('mirecaller'),well=d.landmarks().find(l=>l.id==='moonwell-hollow');return{enemy:{...e},count:d.enemies().filter(x=>x.id==='mirecaller').length,zone:d.zoneAtPoint(e.x,e.y)?.id,moonwellGap:Math.hypot(e.x-well.x,e.y-well.y)};});
              if(mireSeed.count!==1||mireSeed.zone!=='marsh'||mireSeed.enemy.hp!==72||!mireSeed.enemy.playerOnly||mireSeed.moonwellGap<=215)throw new Error(`${vp.name}: Mirecaller not seeded outside Moonwell interaction range ${JSON.stringify(mireSeed)}`);
              const mireLegacy=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.give('pick',1,2);d.equip('pick');d.save();const key=d.build().saveKey,s=JSON.parse(localStorage.getItem(key));s.build='0.92.0';s.world.enemies=s.world.enemies.filter(e=>e.type!=='mirecaller');localStorage.setItem(key,JSON.stringify(s));const write=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){if(k===key)return;return write.call(this,k,v);};return{coins:s.player.coins,inventory:s.player.inventory,landmarks:s.world.landmarks};});
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build?.().version==='0.93.0');
              const mireMigrated=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;return{enemies:d.enemies().filter(e=>e.type==='mirecaller'),player:d.snapshot().player,landmarks:d.landmarks()};});
              if(mireMigrated.enemies.length!==1||mireMigrated.enemies[0].dead||mireMigrated.player.coins!==mireLegacy.coins||JSON.stringify(mireMigrated.player.inventory)!==JSON.stringify(mireLegacy.inventory)||JSON.stringify(mireMigrated.landmarks)!==JSON.stringify(mireLegacy.landmarks)||mireMigrated.player.equippedTool!=='pick')throw new Error(`${vp.name}: 0.92 migration changed earned state ${JSON.stringify(mireMigrated)}`);
              const mireIsolation=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();const node=d.resourceOfType('briarleaf'),m=d.npc('mira');for(const id of ['alden','rowan','tamsin'])d.setNpcStock(id,'briarleaf',0);m.x=node.x;m.y=node.y;d.spawnMirecallerAt(node.x,node.y);d.forceNpcNeed('mira','briarleaf');const goal=d.rethink('mira'),report=m.blockedByDanger;d.setPosition(node.x-120,node.y);const auto=d.apprenticeCandidates().filter(c=>c.kind==='combat'&&c.enemyId==='mirecaller');const wolf=d.spawnWolfAt(node.x,node.y);d.forceNpcNeed('mira','briarleaf');d.rethink('mira');return{goal,report,auto,wolf,wolfReport:m.blockedByDanger};});
              if(mireIsolation.goal==='avoid'||mireIsolation.report||mireIsolation.auto.length||mireIsolation.wolfReport?.enemyId!==mireIsolation.wolf)throw new Error(`${vp.name}: Mirecaller leaked into NPC/Apprentice danger or changed wolf routing ${JSON.stringify(mireIsolation)}`);
              const mireDodge=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.spawnMirecallerAt(1635,1100);d.setPosition(1525,1100);d.advance(.01);const e=d.enemy('mirecaller'),mark={x:e.markX,y:e.markY,windup:e.windup},hp=d.snapshot().player.hp,warning=document.getElementById('toast').textContent;d.advance(.4);const beforeBurst=d.snapshot().player.hp;d.tapWorld(1365,1100);d.advance(.65);const after=d.snapshot().player,markAfter={x:e.markX,y:e.markY},windupAfter=e.windup;d.setPosition(1300,1100);d.advance(3);return{mark,hp,warning,beforeBurst,after,markAfter,windupAfter,retreat:{hp:d.snapshot().player.hp,windup:e.windup,x:e.x,y:e.y}};});
              if(mireDodge.mark.windup!==.9||mireDodge.mark.x!==1525||mireDodge.mark.y!==1100||!mireDodge.warning.includes('move out')||mireDodge.beforeBurst!==mireDodge.hp||mireDodge.after.hp!==mireDodge.hp||mireDodge.after.x>=mireDodge.mark.x-60||mireDodge.markAfter.x!==mireDodge.mark.x||mireDodge.markAfter.y!==mireDodge.mark.y||mireDodge.windupAfter!==0||mireDodge.retreat.windup!==0||mireDodge.retreat.hp!==mireDodge.hp||mireDodge.retreat.x!==1635||mireDodge.retreat.y!==1100)throw new Error(`${vp.name}: telegraph retargeted, dodge failed or retreat did not stop attacks ${JSON.stringify(mireDodge)}`);
              const mireHits=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,trial=(guard=false,armor=false,hp=100)=>{d.reset();d.clearEnemies();d.spawnMirecallerAt(1635,1100);d.setPosition(1525,1100);d.setHp(hp);if(armor){d.give('jerkin',1,2.8);d.equip('jerkin');}d.advance(.01);const braced=guard?d.useSkill('guard'):false;d.advance(1);return{braced,player:d.snapshot().player,enemy:{...d.enemy('mirecaller')},saved:JSON.parse(localStorage.getItem(d.build().saveKey)).player};};return{full:trial(),brace:trial(true),armor:trial(false,true),defeat:trial(false,false,8)};});
              if(mireHits.full.player.hp!==84||!mireHits.brace.braced||mireHits.brace.player.hp!==94||mireHits.brace.player.guarded||mireHits.brace.enemy.hp!==72||mireHits.armor.player.hp!==87||mireHits.armor.player.inventory.jerkin.durability!==98||mireHits.full.saved.hp!==84)throw new Error(`${vp.name}: marked-ground hit/Brace/armor contract failed ${JSON.stringify(mireHits)}`);
              if(mireHits.defeat.player.x!==900||mireHits.defeat.player.y!==600||mireHits.defeat.player.hp!==100||mireHits.defeat.player.coins!==14||mireHits.defeat.saved.x!==900||mireHits.defeat.saved.coins!==14||mireHits.defeat.enemy.dead)throw new Error(`${vp.name}: Mirecaller defeat recovery failed ${JSON.stringify(mireHits.defeat)}`);
              const mireCamp=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.spawnMirecallerAt(1635,1100);d.setPosition(1525,1100);d.give('bedroll',1,1);const before=d.snapshot().player,ok=d.camp(),after=d.snapshot().player;return{before,ok,after,toast:document.getElementById('toast').textContent};});
              if(mireCamp.ok||JSON.stringify(mireCamp.before)!==JSON.stringify(mireCamp.after)||!mireCamp.toast.includes('Mirecaller is too close'))throw new Error(`${vp.name}: player-only encounter incorrectly allowed unsafe camping`);
              const mireKill=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.spawnMirecallerAt(1635,1100);d.setPosition(1495,1100);d.give('bow',1,2);d.give('arrows',2,1);d.equip('bow');d.setEnemyHp('mirecaller',1);const before=d.snapshot().player,ok=d.attack(),after=d.snapshot().player,saved=JSON.parse(localStorage.getItem(d.build().saveKey));d.advance(.7);d.attack();return{before,ok,after,saved,enemy:{...d.enemy('mirecaller')},drops:d.drops().filter(x=>x.item==='mireglass'),repeat:d.snapshot().player};});
              if(!mireKill.ok||!mireKill.enemy.dead||mireKill.after.coins!==mireKill.before.coins+12||mireKill.after.inventory.mireglass||mireKill.after.inventory.arrows.qty!==1||mireKill.after.inventory.bow.durability!==99||mireKill.drops.length!==1||mireKill.repeat.coins!==mireKill.after.coins||!mireKill.saved.world.enemies.find(e=>e.id==='mirecaller')?.dead||mireKill.saved.world.drops.filter(x=>x.item==='mireglass').length!==1)throw new Error(`${vp.name}: Mirecaller one-time ranged kill/physical loot failed ${JSON.stringify(mireKill)}`);
              const mirePickup=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,drop=d.drops().find(x=>x.item==='mireglass');d.setPosition(drop.x-20,drop.y);const targeted=d.tapTarget('drop',drop.id);d.advance(.12);d.setEnergy(100);const before=d.snapshot().player,ok=d.useSkill('fieldcraft'),after=d.snapshot().player,duration=after.surveyUntil-performance.now();const duplicateBefore=after.inventory.mireglass.qty;d.give('mireglass',1,2.8);const duplicateAfter=d.snapshot().player.inventory.mireglass.qty;d.setEnergy(7);const tiredBefore=d.snapshot().player,tired=d.useSkill('fieldcraft'),tiredAfter=d.snapshot().player;return{targeted,ok,before,after,duration,duplicateBefore,duplicateAfter,tired,tiredBefore,tiredAfter,drops:d.drops().filter(x=>x.item==='mireglass')};});
              if(!mirePickup.targeted||!mirePickup.ok||mirePickup.after.inventory.mireglass?.qty!==1||mirePickup.drops.length||mirePickup.before.energy-mirePickup.after.energy!==8||Math.abs(mirePickup.duration-11000)>20||mirePickup.duplicateAfter!==mirePickup.duplicateBefore||mirePickup.tired||JSON.stringify(mirePickup.tiredBefore)!==JSON.stringify(mirePickup.tiredAfter))throw new Error(`${vp.name}: physical Lens pickup/Survey duration/energy gate failed ${JSON.stringify(mirePickup)}`);
              const mireStash=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,cache=d.landmarks().find(l=>l.id==='stonepine-waycache');d.setPosition(cache.x-35,cache.y);d.tapTarget('landmark',cache.id);d.advance(.12);const before={player:d.snapshot().player,cache:d.landmarks().find(l=>l.id===cache.id)},ok=d.waycacheStore('mireglass'),after={player:d.snapshot().player,cache:d.landmarks().find(l=>l.id===cache.id)};d.save();return{before,ok,after};});
              if(!mireStash.before.cache.claimed||mireStash.ok||JSON.stringify(mireStash.before)!==JSON.stringify(mireStash.after))throw new Error(`${vp.name}: progression Lens entered a claimed Waycache ${JSON.stringify(mireStash)}`);
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build?.().version==='0.93.0');
              const mireReload=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.advance(.1);return{enemy:d.enemies().filter(e=>e.id==='mirecaller'),player:d.snapshot().player,drops:d.drops().filter(x=>x.item==='mireglass')};});
              if(mireReload.enemy.length!==1||!mireReload.enemy[0].dead||mireReload.player.inventory.mireglass?.qty!==1||mireReload.player.coins!==mireStash.after.player.coins||mireReload.drops.length)throw new Error(`${vp.name}: defeated encounter/Lens did not persist singularly ${JSON.stringify(mireReload)}`);
              const mireFresh=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();const before=d.snapshot().player;d.useSkill('fieldcraft');const after=d.snapshot().player;return{before,after,enemy:{...d.enemy('mirecaller')},duration:after.surveyUntil-performance.now()};});
              if(mireFresh.enemy.dead||mireFresh.enemy.hp!==72||mireFresh.after.inventory.mireglass||mireFresh.after.coins!==24||mireFresh.before.energy-mireFresh.after.energy!==8||Math.abs(mireFresh.duration-7000)>20)throw new Error(`${vp.name}: fresh reset retained encounter reward or altered Survey baseline ${JSON.stringify(mireFresh)}`);
          """
          anchor='    const equipmentStart=await page.evaluate('
          assert t.count(anchor)==1;t=t.replace(anchor,proof+'\n'+anchor);p.write_text(t)
          PY
          node --check src/game.js
          node --check tests/smoke.mjs
          git diff --check
      - name: Full browser preflight on all existing viewports
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/mirecaller-preflight.log 2>&1 &
          sleep 2
          node tests/smoke.mjs http://127.0.0.1:4173/
      - name: Commit tested feature and remove temporary authoring workflow
        run: |
          test "$(git ls-remote origin refs/heads/custodian/build-0.93-moss-fen-mirecaller | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object .github/workflows/reboot-game-proof.yml)" = 2dc5e4a39e7ab21d917a0c0af6afe69c0d5fc070
          git rm .github/workflows/mirecaller-authoring.yml
          git add src/game.js tests/smoke.mjs
          test "$(git diff --cached --name-only | wc -l)" = 3
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'BUILD 0.93: Mirecaller ground hazard and earned Mireglass Survey lens'
          git push origin HEAD:refs/heads/custodian/build-0.93-moss-fen-mirecaller
