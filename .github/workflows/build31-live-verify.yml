name: Build 31 hosted Pages verification

on:
  pull_request:
    paths:
      - '.github/workflows/build31-live-verify.yml'
  workflow_dispatch:

jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Wait for Build 31 on GitHub Pages
        run: |
          set -e
          URL='https://jeremyhennessy.github.io/BriarGlen/src/runtime/release-info.js'
          ready=0
          for i in $(seq 1 36); do
            body="$(curl -fsSL "$URL?verify=c9d318dc6c0a3cac8cbb2bf9056c4ae1efedb700-$i" || true)"
            if printf '%s' "$body" | grep -Fq "version:'31'" && printf '%s' "$body" | grep -Fq "label:'Specialist Crafting'"; then
              echo "Hosted Pages reports Build 31 Specialist Crafting"
              ready=1
              break
            fi
            echo "Waiting for Pages deployment ($i/36)"
            sleep 5
          done
          test "$ready" = 1
      - name: Run hosted Build 31 regression matrix
        run: |
          set -e
          BASE='https://jeremyhennessy.github.io/BriarGlen/?sha=c9d318dc6c0a3cac8cbb2bf9056c4ae1efedb700'
          run_live() {
            test_file="$1"
            for attempt in 1 2 3; do
              echo "=== ${test_file} live attempt ${attempt}/3 ==="
              if node "tests/${test_file}" "$BASE" --live; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Retrying unchanged ${test_file} after transient hosted failure"
                sleep 5
              fi
            done
            return 1
          }
          run_live smoke.mjs
          run_live world-smoke.mjs
          run_live controls-smoke.mjs
          run_live aiming-gear-smoke.mjs
          run_live skills-smoke.mjs
          run_live crafting-smoke.mjs
          run_live specialist-crafting-smoke.mjs
          run_live map-journal-smoke.mjs
          run_live fen-smoke.mjs
          run_live contracts-smoke.mjs
          run_live stability-smoke.mjs
          run_live game-feel-smoke.mjs
          run_live economy2-smoke.mjs
          run_live combat-identity-smoke.mjs
          run_live art-direction-smoke.mjs
          run_live feedback-tuning-smoke.mjs
          run_live stonepine-smoke.mjs
          run_live stonepine-integration-smoke.mjs
          run_live biome-art-smoke.mjs
          run_live hollow-den-art-smoke.mjs
          run_live runtime-architecture-smoke.mjs
          run_live onboarding-smoke.mjs
          run_live balance-pacing-smoke.mjs
          run_live final-polish-smoke.mjs
          run_live build25-production-smoke.mjs
          run_live build26-production-smoke.mjs
          run_live build27-production-smoke.mjs
          run_live build28-production-smoke.mjs
          run_live build29-production-smoke.mjs
          run_live build30-production-smoke.mjs
