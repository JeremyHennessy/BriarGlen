name: Build 31 hosted Pages verification

on:
  pull_request:
    paths:
      - '.github/workflows/build31-live-verify.yml'
  workflow_dispatch:

jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Wait for Build 31 on GitHub Pages
        run: |
          set -e
          URL='https://jeremyhennessy.github.io/BriarGlen/src/runtime/release-info.js'
          ready=0
          for i in $(seq 1 36); do
            body="$(curl -fsSL "$URL?verify=c9d318dc6c0a3cac8cbb2bf9056c4ae1efedb700-$i" || true)"
            if printf '%s' "$body" | grep -Fq "version:'31'" && printf '%s' "$body" | grep -Fq "label:'Specialist Crafting'"; then
              echo "Hosted Pages reports Build 31 Specialist Crafting"
              ready=1
              break
            fi
            echo "Waiting for Pages deployment ($i/36)"
            sleep 5
          done
          test "$ready" = 1
      - name: Run hosted Build 31 regression matrix
        run: |
          BASE='https://jeremyhennessy.github.io/BriarGlen/?sha=c9d318dc6c0a3cac8cbb2bf9056c4ae1efedb700'
          node tests/smoke.mjs "$BASE" --live
          node tests/world-smoke.mjs "$BASE" --live
          node tests/controls-smoke.mjs "$BASE" --live
          node tests/aiming-gear-smoke.mjs "$BASE" --live
          node tests/skills-smoke.mjs "$BASE" --live
          node tests/crafting-smoke.mjs "$BASE" --live
          node tests/specialist-crafting-smoke.mjs "$BASE" --live
          node tests/map-journal-smoke.mjs "$BASE" --live
          node tests/fen-smoke.mjs "$BASE" --live
          node tests/contracts-smoke.mjs "$BASE" --live
          node tests/stability-smoke.mjs "$BASE" --live
          node tests/game-feel-smoke.mjs "$BASE" --live
          node tests/economy2-smoke.mjs "$BASE" --live
          node tests/combat-identity-smoke.mjs "$BASE" --live
          node tests/art-direction-smoke.mjs "$BASE" --live
          node tests/feedback-tuning-smoke.mjs "$BASE" --live
          node tests/stonepine-smoke.mjs "$BASE" --live
          node tests/stonepine-integration-smoke.mjs "$BASE" --live
          node tests/biome-art-smoke.mjs "$BASE" --live
          node tests/hollow-den-art-smoke.mjs "$BASE" --live
          node tests/runtime-architecture-smoke.mjs "$BASE" --live
          node tests/onboarding-smoke.mjs "$BASE" --live
          node tests/balance-pacing-smoke.mjs "$BASE" --live
          node tests/final-polish-smoke.mjs "$BASE" --live
          node tests/build25-production-smoke.mjs "$BASE" --live
          node tests/build26-production-smoke.mjs "$BASE" --live
          node tests/build27-production-smoke.mjs "$BASE" --live
          node tests/build28-production-smoke.mjs "$BASE" --live
          node tests/build29-production-smoke.mjs "$BASE" --live
          node tests/build30-production-smoke.mjs "$BASE" --live
