name: Navigation UI review (branch only)
on:
  push:
    branches: [custodian/ui-expedition-navigation]
    paths: [.github/workflows/navigation-ui-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve exact source and ancestry
        run: |
          set -eu
          base=ddb054d4b802d954856b00549102c1761fa9de4b
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor b25cce7600bea24bee42e689af9e84d713982b3e HEAD
          test "$(git rev-parse origin/checkpoint/pre-ui-phase-build-0.93-20261003)" = efb547dc5390a243c465c939f3b3fd27b0844381
          mkdir -p evidence/before evidence/source
          git archive "$base" src tests index.html styles.css .github/workflows/reboot-game-proof.yml | tar -x -C evidence/before
          git archive HEAD src tests index.html styles.css .github/workflows/reboot-game-proof.yml | tar -x -C evidence/source
          git diff "$base" -- src tests > evidence/candidate.diff
          git ls-tree -r HEAD > evidence/tree.txt
          git rev-parse HEAD > evidence/head.txt
          python3 - <<'PY'
          from pathlib import Path
          a=Path('evidence/before/src/game.js').read_text();b=Path('src/game.js').read_text()
          start='  const next=p.completed?'
          end='  const guide=document.getElementById'
          assert a[:a.index(start)]==b[:b.index(start)]
          assert a[a.index(end):]==b[b.index(end):]
          for f in ['index.html','styles.css','src/play-ui.js','src/play-ui.css','tests/play-ui.mjs','tests/smoke.mjs','.github/workflows/reboot-game-proof.yml']:
              assert Path(f).read_bytes()==Path('evidence/before',f).read_bytes(),f
          print('PASS exact byte preservation outside objective presentation and additive interaction test')
          PY
      - name: Install canonical browser and serve exact versions
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/game.log 2>&1 &
          python3 -m http.server 4174 --directory evidence/before >/tmp/before.log 2>&1 &
          sleep 2
      - name: Complete canonical gameplay and UI suite
        env:
          UI_EVIDENCE_DIR: evidence/canonical
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/full-proof.log
      - name: Actual before-after navigation and five-size interface proof
        run: |
          cat > .navigation-review.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {mkdir,writeFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          import {provePlayUi} from './tests/play-ui.mjs';
          const browser=await chromium.launch({headless:true}),records=[];
          const sizes=[{name:'desktop',width:1440,height:900,touch:false},{name:'landscape',width:844,height:390,touch:true},{name:'portrait',width:390,height:844,touch:true},{name:'small-landscape',width:667,height:375,touch:true},{name:'small-portrait',width:375,height:667,touch:true}];
          try{
            for(const version of ['before','after'])for(const vp of sizes){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.touch});
              const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));
              const dir=`evidence/${version}-screens`;await mkdir(dir,{recursive:true});
              const activate=async s=>{const l=page.locator(s);if(vp.touch)await l.tap();else await l.click();};
              await page.goto(`http://127.0.0.1:${version==='before'?4174:4173}/`,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');
              await page.screenshot({path:`${dir}/${vp.name}-default.png`});
              await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();for(const n of d.snapshot().npcs){d.npc(n.id).x=30;d.npc(n.id).y=30;}const l=d.landmarks().find(l=>l.id==='stonepine-trail-ledger');d.setPosition(l.x+130,l.y);d.advance(0);});
              await page.waitForTimeout(80);
              const canvas=page.locator('#game'),r=await canvas.boundingBox(),point={x:r.width/2-130,y:r.height/2};
              if(vp.touch)await canvas.tap({position:point});else await canvas.click({position:point});
              await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__.navigation().active);
              if(version==='after')await page.waitForFunction(()=>document.querySelector('#objective-direction').textContent.startsWith('Walking'));
              const direction=await page.locator('#objective-direction').innerText();
              if(version==='after')assert.match(direction,/Walking West · Stonepine Trail Ledger/);else assert.doesNotMatch(direction,/Walking/);
              await page.screenshot({path:`${dir}/${vp.name}-walking.png`});
              await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__.stonepineExpedition().started,null,{timeout:5000});
              await page.waitForTimeout(220);assert.doesNotMatch(await page.locator('#objective-direction').innerText(),/Walking/);
              records.push({version,vp,direction,arrivedAndStarted:true});
              if(version==='after'){
                process.env.UI_EVIDENCE_DIR='evidence/extended';await provePlayUi(page,vp);
                // Read-only diagnostic for the next slice: hold keyboard focus through native UI refresh.
                await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.setPosition(900,600);d.give('bow',1,2.8);d.advance(0);});
                await activate('[data-panel="pack"]');await page.locator('[data-equip="bow"]').focus();
                await page.waitForTimeout(650);
                records.push({focusDiagnostic:vp.name,control:'bow',retained:await page.locator('[data-equip="bow"]').evaluate(el=>el===document.activeElement)});
                await activate('[data-panel="character"]');await page.locator('[data-skill="guard"]').focus();await page.waitForTimeout(650);
                records.push({focusDiagnostic:vp.name,control:'guard',retained:await page.locator('[data-skill="guard"]').evaluate(el=>el===document.activeElement)});
                await page.addStyleTag({content:'body{padding:20px 12px 16px !important}'});await page.waitForTimeout(220);
                const b=await page.evaluate(()=>({w:innerWidth,h:innerHeight,sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,controls:['#hp','#energy','#attack-btn','#interact-btn','#quick-brace','#quick-tonic'].map(s=>document.querySelector(s).getBoundingClientRect().toJSON())}));
                assert.ok(b.sw<=b.w+1&&b.sh<=b.h+1,'Simulated inset overflow');for(const r of b.controls)assert.ok(r.left>=11&&r.right<=b.w-11&&r.top>=19&&r.bottom<=b.h-15,'Inset control unreachable');
                await page.screenshot({path:`${dir}/${vp.name}-insets.png`});
              }
              assert.deepEqual(errors,[]);await ctx.close();
            }
            console.log('PASS ordinary served before/after real input, five-size full UI, orientation, controls, populated panels, save and inset acceptance');
          }finally{await writeFile('evidence/visual-proof.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          set -o pipefail
          node .navigation-review.mjs 2>&1 | tee evidence/visual-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-ui-review
          path: evidence
          include-hidden-files: true
          retention-days: 14
