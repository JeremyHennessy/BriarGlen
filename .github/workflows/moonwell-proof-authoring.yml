name: Branch-only Moonwell proof authoring
on:
  push:
    branches: [custodian/0.89-moonwell-clock-proof-isolation]
    paths: [.github/workflows/moonwell-proof-authoring.yml]
permissions:
  contents: write
jobs:
  author:
    if: github.ref == 'refs/heads/custodian/0.89-moonwell-clock-proof-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact base and unchanged blobs
        run: |
          test "$(git rev-parse HEAD^)" = eca153bd9912523af5876faae89ed3752d5c42bb
          test "$(git hash-object src/game.js)" = f8a9f599a1d87ab005708f972849eef726821a18
          test "$(git hash-object tests/smoke.mjs)" = 3a44f808459adf45bd6bbd915535a2290a87482d
          test "$(git ls-remote origin refs/heads/custodian/0.89-moonwell-clock-proof-isolation | cut -f1)" = "$GITHUB_SHA"
      - name: Reproduce old save-write race and verify live-clock alternative
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/briar-clock.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build?.().version==='0.89.0');
            const old=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.setDay(1);d.save();const key=d.build().saveKey,s=JSON.parse(localStorage.getItem(key));s.world.day=2;localStorage.setItem(key,JSON.stringify(s));const edited=JSON.parse(localStorage.getItem(key)).world.day;d.save();return{edited,afterInterveningSave:JSON.parse(localStorage.getItem(key)).world.day};});
            await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__);
            const oldReload=await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.snapshot().day);
            const live=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.setDay(d.snapshot().day+1);d.save();d.save();return JSON.parse(localStorage.getItem(d.build().saveKey)).world.day;});
            await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__);
            const liveReload=await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.snapshot().day);
            console.log('CLOCK_FIXTURE_PROOF',JSON.stringify({old,oldReload,live,liveReload}));
            if(old.edited!==2||old.afterInterveningSave!==1||oldReload!==1||live!==2||liveReload!==2)throw new Error('Clock fixture hypothesis did not reproduce');
          } finally {await browser.close();}
          JS
      - name: Apply only the clock-fixture correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/smoke.mjs');s=p.read_text()
          old="    await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,key=d.build().saveKey,state=JSON.parse(localStorage.getItem(key));state.world.day+=1;state.world.minute=20*60;localStorage.setItem(key,JSON.stringify(state));});"
          new="    // Advance the live day before saving; keep the already-proven night phase so an intervening autosave cannot restore yesterday.\n    await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.setDay(d.snapshot().day+1);d.save();});"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/smoke.mjs
          git diff --check
          test "$(git hash-object src/game.js)" = f8a9f599a1d87ab005708f972849eef726821a18
      - name: Commit only the test change and remove this temporary job
        run: |
          test "$(git ls-remote origin refs/heads/custodian/0.89-moonwell-clock-proof-isolation | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/moonwell-proof-authoring.yml
          git add tests/smoke.mjs
          git diff --cached --stat
          git -c user.name='Briar Glen Custodian' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Test: advance Moonwell next-night fixture through live clock'
          git push origin HEAD:refs/heads/custodian/0.89-moonwell-clock-proof-isolation
