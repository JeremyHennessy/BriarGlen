name: Panel reading acceptance (temporary)
on:
  push:
    branches: [custodian/ui-panel-reading]
    paths: [.github/workflows/panel-reading-review.yml, .panel-reading-test.mjs]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 707dd5d2049fa7995a81c51b5ed89aeba5c21136
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact unchanged checkpoint and install pinned engines
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor efb547dc5390a243c465c939f3b3fd27b0844381 HEAD
          git merge-base --is-ancestor b25cce7600bea24bee42e689af9e84d713982b3e HEAD
          git diff --exit-code "$BASE" -- src tests index.html styles.css
          mkdir -p evidence/before evidence/source evidence/screens
          git archive "$BASE" src tests index.html styles.css | tar -x -C evidence/before
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 4173 >/tmp/briar.log 2>&1 &
          sleep 2
      - name: Prepare native before-after probe
        run: |
          cat > .reading-probe.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          import {chromium,webkit} from 'playwright';
          const after=process.argv[2]==='after',records=[];
          const sizes=[{name:'desktop',width:1440,height:900,touch:false},{name:'landscape',width:844,height:390,touch:true},{name:'portrait',width:390,height:844,touch:true},{name:'small-landscape',width:667,height:375,touch:true},{name:'small-portrait',width:375,height:667,touch:true}];
          const read=page=>page.evaluate(()=>{const p=window.__BRIAR_GLEN_DEBUG__.snapshot().player,el=document.querySelector('#panel-journal');return{x:p.x,y:p.y,hp:p.hp,energy:p.energy,coins:p.coins,inventory:p.inventory,scrollTop:el.scrollTop,overflow:el.scrollHeight>el.clientHeight+2};});
          try{for(const [engine,type] of Object.entries({chromium,webkit})){
            const browser=await type.launch();
            try{for(const vp of sizes){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.touch}),page=await context.newPage(),errors=[],r={engine,vp,after};records.push(r);page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>document.querySelector('#guide-preparation')?.textContent.includes('health'));
              const label=`${engine}-${vp.name}-${after?'after':'before'}`;
              await page.screenshot({path:`evidence/screens/${label}-default.png`});
              await page.locator('#objective-open').click();await page.keyboard.press('Tab');assert.equal(await page.locator('#panel-journal').evaluate(el=>document.activeElement===el),true);
              await page.screenshot({path:`evidence/screens/${label}-focused.png`});
              const before=await read(page);await page.keyboard.down('Space');await page.waitForTimeout(35);const during=await read(page);await page.keyboard.up('Space');await page.waitForTimeout(300);
              const space=await read(page);await page.screenshot({path:`evidence/screens/${label}-space.png`});
              if(after){assert.equal(during.energy,before.energy);assert.equal(during.x,before.x);assert.equal(during.y,before.y);assert.deepEqual(during.inventory,before.inventory);if(before.overflow)assert.ok(space.scrollTop>before.scrollTop,'Native Space must scroll, not merely suppress attack');}
              else{assert.ok(during.energy<before.energy-2,'Original panel Space must reproduce a real attack cost');assert.equal(space.scrollTop,before.scrollTop);}
              await page.keyboard.press('Home');await page.waitForTimeout(250);const arrowBefore=await read(page);await page.keyboard.down('ArrowDown');await page.waitForTimeout(250);await page.keyboard.up('ArrowDown');await page.waitForTimeout(250);const arrowAfter=await read(page);
              if(after){assert.equal(arrowAfter.x,arrowBefore.x);assert.equal(arrowAfter.y,arrowBefore.y);if(arrowBefore.overflow)assert.ok(arrowAfter.scrollTop>arrowBefore.scrollTop,'Native ArrowDown must scroll');}
              else{assert.ok(arrowAfter.y>arrowBefore.y+3);assert.equal(arrowAfter.scrollTop,arrowBefore.scrollTop);}
              Object.assign(r,{before,during,space,arrowBefore,arrowAfter});
              if(after){
                const {provePanelReading}=await import('./tests/panel-reading.mjs');await provePanelReading(page,{...vp,name:label});
                const check=async()=>{const g=await page.evaluate(()=>({w:innerWidth,h:innerHeight,sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,panels:document.querySelectorAll('.play-panel:not([hidden])').length,controls:['attack-btn','interact-btn','quick-brace','quick-tonic'].map(id=>{const el=document.getElementById(id),b=el.getBoundingClientRect(),hit=document.elementFromPoint(b.left+b.width/2,b.top+b.height/2);return{b:b.toJSON(),hit:hit===el||el.contains(hit)};})}));assert.equal(g.panels,1);assert.ok(g.sw<=g.w+1&&g.sh<=g.h+1);for(const c of g.controls)assert.ok(c.hit&&c.b.width>=44&&c.b.height>=44&&c.b.left>=0&&c.b.top>=0&&c.b.right<=g.w+1&&c.b.bottom<=g.h+1,'Persistent actions visible and hit-test accessible');return g;};
                r.geometry=await check();if(vp.touch){await page.setViewportSize({width:vp.height,height:vp.width});await page.waitForTimeout(250);await check();await page.setViewportSize({width:vp.width,height:vp.height});await page.waitForTimeout(250);await check();await page.addStyleTag({content:'body{padding:20px 12px 16px!important}#app{height:calc(100dvh - 36px)!important}'});await page.waitForTimeout(250);await check();await page.screenshot({path:`evidence/screens/${label}-insets.png`});}
              }
              assert.deepEqual(errors,[]);r.errors=errors;r.pass=true;await context.close();
            }}finally{await browser.close();}
          }console.log(`PASS ${after?'after':'before'} native reading control across ten engine/viewport cases; ${after?'all panels/state/activation/world controls, orientation and insets accepted':'original attack/movement defect reproduced'}`);}
          finally{await writeFile(`evidence/${after?'after':'before'}-probe.json`,JSON.stringify(records,null,2));}
          JS
          cp .reading-probe.mjs evidence/probe.mjs
      - name: Reproduce defect and inspect baseline presentation before changes
        run: node .reading-probe.mjs before
      - name: Apply only scoped UI listener and additive regression tests
        run: |
          set -eu
          python3 .panel-reading-author.py | tee evidence/preservation.log
          cp .panel-reading-test.mjs tests/panel-reading.mjs
          git diff --check
          node --check src/play-ui.js && node --check tests/play-ui.mjs && node --check tests/panel-reading.mjs
          git diff --exit-code "$BASE" -- src/game.js src/play-ui.css index.html styles.css tests/smoke.mjs tests/combat-ui.mjs tests/interaction-ui.mjs tests/live-ui-stability.mjs tests/skill-ui.mjs tests/expedition-guide.mjs .github/workflows/reboot-game-proof.yml
          cp -r src tests index.html styles.css evidence/source/
          git diff "$BASE" -- src tests > evidence/candidate.diff
          git diff --no-index /dev/null tests/panel-reading.mjs >> evidence/candidate.diff || test "$?" = 1
      - name: Ten native after cases with all panel reading and orientation proof
        env:
          UI_EVIDENCE_DIR: evidence/screens
        run: |
          set -o pipefail
          node .reading-probe.mjs after 2>&1 | tee evidence/after-probe.log
      - name: Full canonical Chromium game and UI proof
        env:
          UI_EVIDENCE_DIR: evidence/chromium-canonical
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/chromium-canonical.log
      - name: Same full canonical assertions with WebKit engine only
        env:
          UI_EVIDENCE_DIR: evidence/webkit-canonical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tests/smoke.mjs').read_text();a="import { chromium } from 'playwright';";assert s.count(a)==1
          Path('tests/.reading-webkit.mjs').write_text(s.replace(a,"import { webkit as chromium } from 'playwright';"))
          PY
          set -o pipefail
          node tests/.reading-webkit.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/webkit-canonical.log
      - name: Commit verified bounded candidate to unchanged owned branch
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/custodian/ui-panel-reading | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .panel-reading-author.py .panel-reading-test.mjs
          git add src/play-ui.js tests/play-ui.mjs tests/panel-reading.mjs
          git commit -m 'UI: let focused panels scroll without moving or attacking'
          git push origin HEAD:refs/heads/custodian/ui-panel-reading
          git rev-parse HEAD > evidence/candidate-head.txt
          git ls-tree -r HEAD > evidence/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-reading-acceptance
          path: evidence
          retention-days: 14
