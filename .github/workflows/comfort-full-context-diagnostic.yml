name: Comfort full-context diagnostic (never merge)
on:
  push:
    branches: [custodian/ui-outing-comfort]
    paths: [.github/workflows/comfort-full-context-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        candidate: [base, candidate]
    env:
      UI_EVIDENCE_DIR: evidence/screens
      ENGINE: ${{ matrix.engine }}
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact original baseline and browser
        run: |
          set -eu
          git diff --exit-code d253e62349e1a99b4bdb2291449b7c60626b7eca -- src tests index.html styles.css
          git merge-base --is-ancestor efb547dc5390a243c465c939f3b3fd27b0844381 HEAD
          mkdir -p evidence/source evidence/screens
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps $ENGINE
          if [ "$CANDIDATE" = candidate ]; then python3 .comfort-ui-author.py; fi
          cp -r src tests index.html styles.css evidence/source/
          git diff -- src tests > evidence/candidate.diff
          git rev-parse HEAD > evidence/author-head.txt
      - name: Preserve original assertions with passive full-context instrumentation
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          # All edits below are temporary runner copies, never staged or pushed.
          p=Path('tests/interaction-ui.mjs');s=p.read_text()
          a="el.scrollIntoView({block:'nearest'});return{b:el.getBoundingClientRect().toJSON(),p:document.querySelector('#panel-nearby').getBoundingClientRect().toJSON()};"
          b="""el.scrollIntoView({block:'nearest'});const panel=document.querySelector('#panel-nearby'),b=el.getBoundingClientRect().toJSON(),p=panel.getBoundingClientRect().toJSON();const record={selector:el.getAttribute('data-near')||el.tagName,b,p,scrollTop:panel.scrollTop,scrollHeight:panel.scrollHeight,clientHeight:panel.clientHeight,active:document.activeElement?.outerHTML,context:document.querySelector('#interaction-context')?.innerText,scrollBehavior:getComputedStyle(panel).scrollBehavior,windowScroll:[scrollX,scrollY],panelHidden:panel.hidden,connected:el.isConnected};(window.__reachabilityRecords??=[]).push(record);console.log('REACHABILITY '+JSON.stringify(record));return{b,p};"""
          assert s.count(a)==1;s=s.replace(a,b)
          a="assert.ok(b&&p&&b.y>=p.y-1&&b.y+b.height<=p.y+p.height+1,'Resident/help controls remain reachable');"
          b="""if(!(b&&p&&b.y>=p.y-1&&b.y+b.height<=p.y+p.height+1)){await shot('strict-failure');for(const delay of [0,50,250,1000]){await page.waitForTimeout(delay);console.log('REACHABILITY_SETTLE '+JSON.stringify({vp,selector,delay,now:await page.locator(selector).evaluate(el=>{const panel=document.querySelector('#panel-nearby');return{b:el.getBoundingClientRect().toJSON(),p:panel.getBoundingClientRect().toJSON(),scrollTop:panel.scrollTop,scrollHeight:panel.scrollHeight,clientHeight:panel.clientHeight,context:document.querySelector('#interaction-context')?.innerText,records:window.__reachabilityRecords};})}));}await shot('strict-delayed');}assert.ok(b&&p&&b.y>=p.y-1&&b.y+b.height<=p.y+p.height+1,'Resident/help controls remain reachable');"""
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=Path('tests/smoke.mjs');s=p.read_text()
          if os.environ['ENGINE']=='webkit':
              a="import { chromium } from 'playwright';";assert s.count(a)==1;s=s.replace(a,"import { webkit as chromium } from 'playwright';")
          a="const page=await context.newPage();";assert s.count(a)==1;s=s.replace(a,a+"page.on('console',m=>{if(m.text().startsWith('REACHABILITY '))console.log(m.text());});")
          p.write_text(s)
          PY
          python3 -m http.server 4173 >/tmp/briar.log 2>&1 &
          sleep 2
      - name: Full canonical including original strict reachability assertion
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/full-context.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfort-full-context-${{ matrix.engine }}-${{ matrix.candidate }}
          path: evidence
          retention-days: 14
