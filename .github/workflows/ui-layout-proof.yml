name: UI layout correction and visual proof
on:
  push:
    branches: [custodian/build-0.94-playability-shell]
    paths: [.github/workflows/ui-layout-proof.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply only screenshot-confirmed layout correction and proof
        run: |
          test "$(git rev-parse HEAD^)" = 3a8ed6ea182518bf0b63cf0c03eff490f488e110
          test "$(git hash-object src/play-ui.css)" = 463c2c348cfe4c2a671fd069e1249250ca565d0e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/play-ui.css');s=p.read_text();old='.sidebar{min-height:0;';assert s.count(old)==1;s=s.replace(old,'.sidebar{display:flex;flex-direction:column;min-height:0;')
          s=s.replace('body{padding:5px max(5px,env(safe-area-inset-right))','body{padding:max(5px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right))').replace('height:calc(100dvh - 5px - max(5px,env(safe-area-inset-bottom)))','height:calc(100dvh - max(5px,env(safe-area-inset-top)) - max(5px,env(safe-area-inset-bottom)))')
          s+='\n/* Keep primary touch targets usable at every supported orientation. */\n@media(max-width:1100px){.action-deck .dpad{grid-template-columns:repeat(3,44px)}.action-deck .dpad button,.action-deck .actions button,.panel-tabs button{min-width:44px;min-height:44px}}\n@media(orientation:landscape) and (max-height:550px){.action-deck .dpad{grid-template-columns:repeat(4,44px)}}\n';p.write_text(s)
          p=Path('tests/play-ui.mjs');s=p.read_text();old="panelW:panel.clientWidth,panelScrollW:panel.scrollWidth,";assert s.count(old)==1;s=s.replace(old,"panelW:panel.clientWidth,panelScrollW:panel.scrollWidth,panelBox:box('#panel-pack'),tabs:box('.panel-tabs'),tabBoxes:[...document.querySelectorAll('[data-panel]')].map(el=>el.getBoundingClientRect().toJSON()),")
          anchor="  assert.ok(layout.panelScrollW<=layout.panelW+1,"
          at=s.index(anchor);s=s[:at]+"  assert.ok(layout.panelBox.width>=layout.side.width-12&&layout.tabs.width>=layout.side.width-12&&layout.tabs.bottom<=layout.panelBox.top+1,`${vp.name}: legacy grid squeezed tabs beside content`);\n  for(const tab of layout.tabBoxes)assert.ok(tab.width>=44&&tab.height>=44,`${vp.name}: tab touch target too small`);\n"+s[at:];p.write_text(s)
          PY
          git diff --check
          node --check tests/play-ui.mjs
      - name: Full unchanged gameplay and expanded UI proof
        env:
          UI_EVIDENCE_DIR: ui-evidence
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/ui-visual.log 2>&1 &
          sleep 2
          node tests/smoke.mjs http://127.0.0.1:4173/
      - name: Screens and extra small-screen contract
        if: always()
        run: |
          mkdir -p ui-evidence/source/src ui-evidence/source/tests
          cp src/game.js src/play-ui.js src/play-ui.css ui-evidence/source/src/
          cp tests/smoke.mjs tests/play-ui.mjs ui-evidence/source/tests/
          cp index.html styles.css ui-evidence/source/
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch();
          try{for(const [name,width,height] of [['desktop',1440,900],['landscape',844,390],['portrait',390,844],['small-landscape',667,375],['small-portrait',375,667]]){
            const context=await browser.newContext({viewport:{width,height},hasTouch:name!=='desktop'}),page=await context.newPage();await page.goto('http://127.0.0.1:4173/');await page.waitForTimeout(250);
            const geometry=await page.evaluate(()=>{const rect=s=>document.querySelector(s).getBoundingClientRect().toJSON();return{canvas:rect('#game'),tabs:rect('.panel-tabs'),side:rect('.sidebar'),panel:rect('#panel-nearby'),scrollW:document.documentElement.scrollWidth,scrollH:document.documentElement.scrollHeight,actions:[...document.querySelectorAll('.action-deck button')].filter(e=>e.getBoundingClientRect().width>0).map(e=>e.getBoundingClientRect().toJSON())};});
            await page.screenshot({path:`ui-evidence/${name}-default.png`});writeFileSync(`ui-evidence/${name}-geometry.json`,JSON.stringify(geometry,null,2));
            assert.ok(geometry.canvas.width>=250&&geometry.canvas.height>=140,name+' world size');assert.ok(geometry.scrollW<=width+1&&geometry.scrollH<=height+1,name+' page overflow');
            assert.ok(geometry.tabs.bottom<=geometry.panel.top+1&&geometry.tabs.width>=geometry.side.width-12,name+' tab rail');
            for(const b of geometry.actions)assert.ok(b.width>=44&&b.height>=44&&b.x>=0&&b.right<=width&&b.bottom<=height,name+' action hit target');
            await page.locator('[data-panel="craft"]').click();await page.screenshot({path:`ui-evidence/${name}-make.png`});
            await context.close();
          }}finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briar-ui-0.94-visual-verified
          path: ui-evidence/
          retention-days: 30
      - name: Commit only verified UI correction and remove temporary job
        run: |
          test "$(git ls-remote origin refs/heads/custodian/build-0.94-playability-shell | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code -- src/game.js index.html src/play-ui.js tests/smoke.mjs styles.css .github/workflows/reboot-game-proof.yml
          git rm .github/workflows/ui-layout-proof.yml
          git add src/play-ui.css tests/play-ui.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix landscape tab rail and prove viewport-safe touch targets'
          git push origin HEAD:refs/heads/custodian/build-0.94-playability-shell
