name: Provider continuity proof
on:
  pull_request:
    paths:
      - 'src/game.js'
      - 'tests/provider-aging.mjs'
      - '.github/workflows/provider-continuity-proof.yml'
  push:
    branches: [main]
    paths:
      - 'src/game.js'
      - 'tests/provider-aging.mjs'
      - '.github/workflows/provider-continuity-proof.yml'
permissions:
  contents: read
jobs:
  provider-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check src/game.js && node --check tests/provider-aging.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 >/tmp/briar-provider.log 2>&1 &
          sleep 2
      - name: Provider continuity proof
        run: node tests/provider-aging.mjs http://127.0.0.1:4173/
