name: Commit verified exploration candidate (temporary)
on:
  push:
    branches: [custodian/ui-exploration-leads]
    paths: [.github/workflows/exploration-commit-verified.yml]
permissions:
  contents: write
  actions: read
jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE: e18b09e4c24ca0e05f51066e1f3f2c42cc20d460
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful exact-source acceptance jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          for job in [111559627671,111559627934]:
              req=urllib.request.Request(f'https://api.github.com/repos/JeremyHennessy/BriarGlen/actions/jobs/{job}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as res: data=json.load(res)
              assert data['run_id']==37244513944 and data['conclusion']=='success' and data['status']=='completed'
              for step in data['steps']:assert step['conclusion']=='success',step
              print('Verified green full canonical and seven-size native proof:',job)
          PY
      - name: Regenerate hard-pinned four files and remove only verified temporary tools
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/custodian/ui-exploration-leads | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code "$BASE" -- src tests index.html styles.css
          python3 .exploration-author-final.py
          python3 .exploration-rendered-sync.py
          python3 .detour-fixture-author.py
          test "$(git hash-object src/game.js)" = 97ca81a2f598e54a946dafbe26638512691a3aeb
          test "$(git hash-object src/play-ui.js)" = bc96a9b42d089d183312e027a6df45f665b0183e
          test "$(git hash-object tests/expedition-guide.mjs)" = 604017c8c8657b3c3927fdb24e6a70990b88acfe
          test "$(git hash-object tests/smoke.mjs)" = 3381a6b6b6f97d9315fd8284109cb0f62b15e84d
          # The author adds test-only frame observation to this temporary visual script.
          # Restore that already-archived working copy before normal removal; product files untouched.
          git restore -- .exploration-visual-final.mjs
          python3 - <<'PY'
          import subprocess,os
          final='.github/workflows/exploration-commit-verified.yml'
          expected={'.exploration-game-author.py','.exploration-game-helper-v2.txt','.exploration-game-helper.txt','.exploration-note.txt','.exploration-play-ui-author-v2.py','.exploration-play-ui-author.py','.exploration-author-final.py','.exploration-visual-final.mjs','.exploration-sync-final.py','.exploration-rendered-sync.py','.detour-fixture-author.py','.github/workflows/exploration-leads-review.yml','.github/workflows/exploration-keyboard-diagnostic.yml','.github/workflows/exploration-lifecycle-trace.yml','.github/workflows/exploration-close-layout-proof.yml','.github/workflows/detour-fixture-diagnostic.yml','.github/workflows/detour-isolation-proof.yml','.github/workflows/exploration-final-release.yml',final}
          added=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=A',os.environ['BASE'],'HEAD']).decode().splitlines())
          assert added==expected,(added,expected)
          subprocess.run(['git','rm','--',*sorted(added-{final})],check=True)
          PY
          git diff --check
          git add src/game.js src/play-ui.js tests/expedition-guide.mjs tests/smoke.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'UI: post-Stonepine exploration leads and deterministic detour test setup'
          git push origin HEAD:refs/heads/custodian/ui-exploration-leads
          git rev-parse HEAD
