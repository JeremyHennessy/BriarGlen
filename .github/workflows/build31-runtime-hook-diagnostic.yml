name: Build 31 runtime hook diagnostic

on:
  pull_request:
    paths:
      - 'tests/runtime-hook-cadence-probe.mjs'
      - '.github/workflows/build31-runtime-hook-diagnostic.yml'
  workflow_dispatch:

jobs:
  runtime-hook-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 > /tmp/briarglen-hook-diag.log 2>&1 &
          sleep 2
      - name: Measure desktop runtime hook progression
        run: node tests/runtime-hook-cadence-probe.mjs http://127.0.0.1:4173/
