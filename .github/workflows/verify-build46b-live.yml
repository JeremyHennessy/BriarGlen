name: Verify Build 46B live

on:
  pull_request:
    paths:
      - '.github/workflows/verify-build46b-live.yml'
  workflow_dispatch:

jobs:
  verify-live-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for Build 46B Pages source
        run: |
          set -e
          URL="https://jeremyhennessy.github.io/BriarGlen/src/v42/61-environment-variation.js?sha=90c8d7f6f668a1f343eb997e1a1ff7254887000c"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsSL "$URL" | grep -q "build46b-environment-v1"; then
              echo "Build 46B source is live"
              exit 0
            fi
            sleep 5
          done
          echo "Build 46B source not yet live" >&2
          exit 1
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify deployed Environment 46
        run: |
          node tests/environment46-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=90c8d7f6f668a1f343eb997e1a1ff7254887000c"
          node tests/environment46-performance-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=90c8d7f6f668a1f343eb997e1a1ff7254887000c"
          node tests/phone-ui-collision-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=90c8d7f6f668a1f343eb997e1a1ff7254887000c"
          node tests/tutorial-skip-smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=90c8d7f6f668a1f343eb997e1a1ff7254887000c"
