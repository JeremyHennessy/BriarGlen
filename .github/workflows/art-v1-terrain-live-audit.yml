name: Art v1 terrain live Pages audit

on:
  pull_request:
    paths:
      - '.github/workflows/art-v1-terrain-live-audit.yml'

jobs:
  terrain-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static integrity
        run: node tests/static-sanity.mjs
      - name: Wait for merged terrain route polish on GitHub Pages
        run: |
          BASE="https://jeremyhennessy.github.io/BriarGlen"
          SHA="cf6ca5d41c8057f2b45065798202b0d1b1cfaef7"
          for attempt in $(seq 1 72); do
            if curl -fsSL "$BASE/src/v47/68-art-v1-terrain-runtime.js?sha=$SHA" | grep -q 'art-v1-terrain-preview-v4-q75-base-only' \
              && curl -fsSL "$BASE/src/v47/69-art-v1-terrain-route-runtime.js?sha=$SHA" | grep -q 'art-v1-terrain-route-v1-q75' \
              && curl -fsSL "$BASE/src/runtime/boot.js?sha=$SHA" | grep -q '69-art-v1-terrain-route-runtime.js'; then
              echo "Art-v1 terrain route-polish production files are live on Pages"
              exit 0
            fi
            sleep 5
          done
          echo "Merged art-v1 terrain route-polish files were not observed on Pages"
          exit 1
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Live terrain phone proofs and rollback
        run: |
          URL="https://jeremyhennessy.github.io/BriarGlen/?sha=cf6ca5d41c8057f2b45065798202b0d1b1cfaef7"
          node tests/art-v1-terrain-smoke.mjs "$URL"
      - name: Live runtime layout UI and performance regression
        run: |
          URL="https://jeremyhennessy.github.io/BriarGlen/?sha=cf6ca5d41c8057f2b45065798202b0d1b1cfaef7"
          node tests/runtime-architecture-smoke.mjs "$URL" --live
          node tests/world-layout-v2-smoke.mjs "$URL" --live
          node tests/phone-ui-collision-smoke.mjs "$URL" --live
          node tests/render-performance-smoke.mjs "$URL" --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-v1-terrain-live-${{ github.sha }}
          path: artifacts/art-v1-terrain-*.png
          if-no-files-found: ignore
