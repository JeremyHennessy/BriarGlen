name: Reboot game proof
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check src/game.js && node --check tests/smoke.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 >/tmp/briar.log 2>&1 &
          sleep 2
      - name: Browser proof
        run: node tests/smoke.mjs http://127.0.0.1:4173/
      - name: Request GitHub Pages rebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/pages/builds"
      - name: Wait for exact Pages game bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          expected="$(git hash-object src/game.js)"
          for attempt in $(seq 1 18); do
            curl -fsSL "https://jeremyhennessy.github.io/BriarGlen/src/game.js?sha=$GITHUB_SHA&attempt=$attempt" -o /tmp/live-game.js || true
            if [ -s /tmp/live-game.js ]; then
              actual="$(git hash-object /tmp/live-game.js)"
              echo "Pages attempt $attempt: $actual"
              if [ "$actual" = "$expected" ]; then
                echo "GitHub Pages is serving the exact checked-out game blob."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Pages did not converge to expected game blob $expected"
          exit 1
      - name: Hosted proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tests/smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}"
