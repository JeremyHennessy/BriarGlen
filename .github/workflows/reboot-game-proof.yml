name: Reboot game proof
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check src/game.js && node --check src/play-ui.js && node --check tests/smoke.mjs && node --check tests/play-ui.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 >/tmp/briar.log 2>&1 &
          sleep 2
      - name: Browser proof
        env:
          UI_EVIDENCE_DIR: ui-evidence
        run: node tests/smoke.mjs http://127.0.0.1:4173/
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ github.sha }}
          path: ui-evidence
          if-no-files-found: error
      - name: Request GitHub Pages rebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/pages/builds"
      - name: Wait for exact Pages frontend bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for attempt in $(seq 1 18); do
            matched=true
            for asset in index.html styles.css src/game.js src/play-ui.js src/play-ui.css; do
              expected="$(git hash-object "$asset")"
              rm -f /tmp/live-asset
              if ! curl -fsSL --connect-timeout 10 --max-time 20 "https://jeremyhennessy.github.io/BriarGlen/$asset?sha=$GITHUB_SHA&attempt=$attempt" -o /tmp/live-asset; then
                matched=false
                continue
              fi
              actual="$(git hash-object /tmp/live-asset)"
              echo "Pages attempt $attempt $asset: $actual (expected $expected)"
              if [ "$actual" != "$expected" ]; then matched=false; fi
            done
            if [ "$matched" = true ]; then
              echo "GitHub Pages is serving the exact checked-out frontend assets."
              exit 0
            fi
            sleep 10
          done
          echo "Pages did not converge to all expected frontend blobs."
          exit 1
      - name: Hosted proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tests/smoke.mjs "https://jeremyhennessy.github.io/BriarGlen/?sha=${{ github.sha }}"
