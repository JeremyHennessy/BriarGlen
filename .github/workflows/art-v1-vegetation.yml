name: Art v1 vegetation proof
on:
  pull_request:
    paths:
      - 'assets/art-v1/vegetation/**'
      - 'src/v47/69-art-v1-vegetation-runtime.js'
      - 'src/runtime/boot.js'
      - 'tests/art-v1-vegetation-smoke.mjs'
      - '.github/workflows/art-v1-vegetation.yml'
  workflow_dispatch:
jobs:
  vegetation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify vegetation atlas transport
        run: |
          test -s assets/art-v1/vegetation/vegetation-atlas-v1.webp
          ACTUAL="$(sha256sum assets/art-v1/vegetation/vegetation-atlas-v1.webp | awk '{print $1}')"
          echo "vegetation atlas sha256=$ACTUAL"
          test "$ACTUAL" = '021473cbe15c03f63a69ab00bcbeb88fbcb39acdbf09228cfb79820ab13f01db'
      - name: Static sanity
        run: node tests/static-sanity.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve branch
        run: |
          python3 -m http.server 4173 > /tmp/briar-http.log 2>&1 &
          echo $! > /tmp/briar-http.pid
          sleep 2
      - name: Art-v1 vegetation proof
        run: node tests/art-v1-vegetation-smoke.mjs http://127.0.0.1:4173/
      - name: Canonical runtime and performance regression
        run: |
          node tests/runtime-architecture-smoke.mjs http://127.0.0.1:4173/
          node tests/world-layout-v2-smoke.mjs http://127.0.0.1:4173/
          node tests/phone-ui-collision-smoke.mjs http://127.0.0.1:4173/
          node tests/render-performance-smoke.mjs http://127.0.0.1:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-v1-vegetation-${{ github.sha }}
          path: |
            artifacts/art-v1-vegetation-*.png
            assets/art-v1/vegetation/vegetation-atlas-v1.webp
          if-no-files-found: ignore
