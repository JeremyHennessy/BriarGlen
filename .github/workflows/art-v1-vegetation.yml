name: Art v1 vegetation proof
on:
  pull_request:
    paths:
      - 'assets/art-v1/vegetation/**'
      - 'tools/art_v1/vegetation-atlas-v3.part*.b64'
      - 'tools/art_v1/materialize-vegetation-atlas.mjs'
      - 'src/v47/70-art-v1-vegetation-runtime.js'
      - 'src/runtime/boot.js'
      - 'tests/art-v1-vegetation-smoke.mjs'
      - '.github/workflows/art-v1-vegetation.yml'
  workflow_dispatch:
jobs:
  vegetation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize and verify vegetation v3 atlas
        run: |
          node tools/art_v1/materialize-vegetation-atlas.mjs
          git diff --exit-code -- assets/art-v1/vegetation/vegetation-atlas-v3.webp
      - name: Static sanity
        run: node tests/static-sanity.mjs
      - name: Verify active vegetation v3 files
        run: |
          test -s assets/art-v1/vegetation/vegetation-atlas-v3.webp
          test -s assets/art-v1/vegetation/vegetation-manifest-v3.json
          sha256sum assets/art-v1/vegetation/vegetation-atlas-v3.webp | grep 59a74c45c02d2f82d00ddf965a244d6eb3e59ae4bc07b03d2e72bff21811be56
          grep -q '"runtime_dimensions": \[512, 384\]' assets/art-v1/vegetation/vegetation-manifest-v3.json
          grep -q '"runtime_role_count": 9' assets/art-v1/vegetation/vegetation-manifest-v3.json
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve branch
        run: |
          python3 -m http.server 4173 > /tmp/briar-http.log 2>&1 &
          echo $! > /tmp/briar-http.pid
          sleep 2
      - name: Art-v1 vegetation proof
        run: node tests/art-v1-vegetation-smoke.mjs http://127.0.0.1:4173/
      - name: Canonical runtime and performance regression
        run: |
          node tests/runtime-architecture-smoke.mjs http://127.0.0.1:4173/
          node tests/world-layout-v2-smoke.mjs http://127.0.0.1:4173/
          node tests/phone-ui-collision-smoke.mjs http://127.0.0.1:4173/
          node tests/render-performance-smoke.mjs http://127.0.0.1:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-v1-vegetation-${{ github.sha }}
          path: |
            artifacts/art-v1-vegetation-*.png
            assets/art-v1/vegetation/vegetation-atlas-v3.webp
            assets/art-v1/vegetation/vegetation-manifest-v3.json
          if-no-files-found: ignore
