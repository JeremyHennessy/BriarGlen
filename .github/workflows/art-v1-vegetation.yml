name: Art v1 vegetation proof
on:
  pull_request:
    paths:
      - 'assets/art-v1/vegetation/**'
      - 'src/v47/70-art-v1-vegetation-runtime.js'
      - 'src/runtime/boot.js'
      - 'tests/art-v1-vegetation-smoke.mjs'
      - '.github/workflows/art-v1-vegetation.yml'
  workflow_dispatch:
jobs:
  vegetation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static sanity
        run: node tests/static-sanity.mjs
      - name: Verify vegetation runtime files
        run: |
          test -s assets/art-v1/vegetation/vegetation-atlas-v2.webp
          test -s assets/art-v1/vegetation/vegetation-manifest-v2.json
          sha256sum assets/art-v1/vegetation/vegetation-atlas-v2.webp | grep bdf4aee028dc7b4de4e64d79acf0df3f3b6a44c46478e543a480e41d01e37ae7
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve branch
        run: |
          python3 -m http.server 4173 > /tmp/briar-http.log 2>&1 &
          echo $! > /tmp/briar-http.pid
          sleep 2
      - name: Art-v1 vegetation proof
        run: node tests/art-v1-vegetation-smoke.mjs http://127.0.0.1:4173/
      - name: Canonical runtime and performance regression
        run: |
          node tests/runtime-architecture-smoke.mjs http://127.0.0.1:4173/
          node tests/world-layout-v2-smoke.mjs http://127.0.0.1:4173/
          node tests/phone-ui-collision-smoke.mjs http://127.0.0.1:4173/
          node tests/render-performance-smoke.mjs http://127.0.0.1:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-v1-vegetation-${{ github.sha }}
          path: artifacts/art-v1-vegetation-*.png
          if-no-files-found: ignore
