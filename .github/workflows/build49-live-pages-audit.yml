name: Build 49 live Pages audit

on:
  pull_request:
    paths:
      - '.github/workflows/build49-live-pages-audit.yml'

jobs:
  live-pages-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static integrity
        run: node tests/static-sanity.mjs
      - name: Wait for merged Build 49 on GitHub Pages
        run: |
          BASE="https://jeremyhennessy.github.io/BriarGlen"
          for attempt in $(seq 1 72); do
            if curl -fsSL "$BASE/src/v44/63-source-art47-runtime.js?sha=b9fabcef93c6cee65f4ea96f029b874b84f7a7d7" | grep -q 'build49-world-scale-reset-v1' \
              && curl -fsSL "$BASE/src/v46/67-scene-cohesion49-runtime.js?sha=b9fabcef93c6cee65f4ea96f029b874b84f7a7d7" | grep -q 'build49-hub-meadow-cohesion' \
              && curl -fsSL "$BASE/docs/WORLD_SCALE_CONTRACT.md?sha=b9fabcef93c6cee65f4ea96f029b874b84f7a7d7" | grep -q 'World Scale Contract'; then
              echo "Build 49 production files are live"
              exit 0
            fi
            sleep 5
          done
          echo "Build 49 production files were not observed on Pages"
          exit 1
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Live scale, visual and performance proof
        run: |
          URL="https://jeremyhennessy.github.io/BriarGlen/?sha=b9fabcef93c6cee65f4ea96f029b874b84f7a7d7"
          node tests/build49-hub-meadow-cohesion-smoke.mjs "$URL" --live
          node tests/build48-living-cast-smoke.mjs "$URL" --live
          node tests/build47-visual-rebuild-smoke.mjs "$URL"
          node tests/ground-v2-performance-smoke.mjs "$URL"
          node tests/render-performance-smoke.mjs "$URL"
      - name: Full live vertical-slice browser matrix
        run: |
          URL="https://jeremyhennessy.github.io/BriarGlen/?sha=b9fabcef93c6cee65f4ea96f029b874b84f7a7d7"
          run_live() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" -lt 3 ] && sleep $((attempt * 3))
            done
            return 1
          }
          run_live node tests/smoke.mjs "$URL" --live
          run_live node tests/world-smoke.mjs "$URL" --live
          run_live node tests/controls-smoke.mjs "$URL" --live
          run_live node tests/aiming-gear-smoke.mjs "$URL" --live
          run_live node tests/skills-smoke.mjs "$URL" --live
          run_live node tests/crafting-smoke.mjs "$URL" --live
          run_live node tests/specialist-crafting-smoke.mjs "$URL" --live
          run_live node tests/warden-response-smoke.mjs "$URL" --live
          run_live node tests/specialist-economy38-smoke.mjs "$URL" --live
          run_live node tests/phone-ui-collision-smoke.mjs "$URL" --live
          run_live node tests/tutorial-skip-smoke.mjs "$URL" --live
          run_live node tests/hud-notifications-smoke.mjs "$URL" --live
          run_live node tests/satchel-character-smoke.mjs "$URL" --live
          run_live node tests/map-journal-smoke.mjs "$URL" --live
          run_live node tests/map-journal35-smoke.mjs "$URL" --live
          run_live node tests/fen-smoke.mjs "$URL" --live
          run_live node tests/contracts-smoke.mjs "$URL" --live
          run_live node tests/stability-smoke.mjs "$URL" --live
          run_live node tests/game-feel-smoke.mjs "$URL" --live
          run_live node tests/economy2-smoke.mjs "$URL" --live
          run_live node tests/combat-identity-smoke.mjs "$URL" --live
          run_live node tests/combat-quality-smoke.mjs "$URL" --live
          run_live node tests/art-direction-smoke.mjs "$URL" --live
          run_live node tests/feedback-tuning-smoke.mjs "$URL" --live
          run_live node tests/stonepine-smoke.mjs "$URL" --live
          run_live node tests/stonepine-integration-smoke.mjs "$URL" --live
          run_live node tests/biome-art-smoke.mjs "$URL" --live
          run_live node tests/hollow-den-art-smoke.mjs "$URL" --live
          run_live node tests/runtime-architecture-smoke.mjs "$URL" --live
          run_live node tests/onboarding-smoke.mjs "$URL" --live
          run_live node tests/contextual-onboarding-smoke.mjs "$URL" --live
          run_live node tests/balance-pacing-smoke.mjs "$URL" --live
          run_live node tests/final-polish-smoke.mjs "$URL" --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build49-live-pages-${{ github.sha }}
          path: |
            artifacts/build49-cohesion-*.png
            artifacts/build48-cast-*.png
            artifacts/build47-rebuild-*.png
          if-no-files-found: ignore
