name: Provider aging branch proof
on:
  push:
    branches:
      - agent/provider-call-aging-proof-20260930
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check src/game.js && node --check tests/smoke.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 >/tmp/briar-provider-aging.log 2>&1 &
          sleep 2
      - name: Full browser proof
        run: node tests/smoke.mjs http://127.0.0.1:4173/
