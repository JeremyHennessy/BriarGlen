name: Branch-only earned Trail Pack authoring
on:
  push:
    branches: [custodian/build-0.92-earned-trail-pack]
    paths: [.github/workflows/trail-pack-authoring.yml]
permissions:
  contents: write
jobs:
  author:
    if: github.ref == 'refs/heads/custodian/build-0.92-earned-trail-pack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact fully verified parent and input blobs
        run: |
          test "$(git rev-parse HEAD^)" = "d16768cc43b32fbc34d5ca5bd8d68edecbddc383"
          test "$(git hash-object src/game.js)" = "002449c9cf2d864b1d068a75544bcb09d8ec5a74"
          test "$(git hash-object tests/smoke.mjs)" = "e29ac9d7ee28f8884c47289022856deee9116dab"
      - name: Apply bounded Trail Pack runtime and regression proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game.js'); text=p.read_text()
          def replace(old,new):
              global text
              assert text.count(old)==1, ('expected unique source',old,text.count(old))
              text=text.replace(old,new)
          replace("version:'0.91.0'","version:'0.92.0'")
          replace("    bedroll:{name:'Trail Bedroll',", "    trailpack:{name:'Trail Pack',weight:1,base:36,kind:'pack',color:'#b99878'},\n    bedroll:{name:'Trail Bedroll',")
          replace("    bedroll:{skill:'fieldcraft',", "    trailpack:{skill:'fieldcraft',level:1,input:{hide:2,wood:1},output:'trailpack'},\n    bedroll:{skill:'fieldcraft',")
          replace("  function inventoryWeight(){", "  function carryComfortLimit(){if(itemCount('trailpack')<1)return 18;const q=avgQuality('trailpack');return 18+(q>=2.6?4:q>=1.7?3:2);}\n  function inventoryWeight(){")
          replace("heavyPack=inventoryWeight()>18;", "heavyPack=inventoryWeight()>carryComfortLimit();")
          replace("itemDefs[id].kind!=='camp';", "itemDefs[id].kind!=='camp'&&itemDefs[id].kind!=='pack';")
          replace("function craft(id){const r=recipes[id];if(!r)return false;", "function craft(id){const r=recipes[id];if(!r)return false;if(id==='trailpack'&&!player.expeditions?.stonepine?.completed){toast('Complete the Stonepine expedition to learn the Trail Pack recipe');return false;}")
          replace("(isArtifact(id)||id==='bedroll')&&itemCount(id)>0", "(isArtifact(id)||id==='bedroll'||id==='trailpack')&&itemCount(id)>0")
          replace("toast(id==='bedroll'?'You already carry a Trail Bedroll.':", "toast(id==='trailpack'?'You already carry a Trail Pack.':id==='bedroll'?'You already carry a Trail Bedroll.':")
          replace("UI.packWeight.textContent=`${inventoryWeight().toFixed(1)} / 22 weight`;", "UI.packWeight.textContent=`${inventoryWeight().toFixed(1)} / 22 weight${itemCount('trailpack')>0?` · Trail Pack comfort ${carryComfortLimit()}`:''}`;")
          replace('<button data-craft="bedroll">Craft Trail Bedroll</button>', '<button data-craft="bedroll">Craft Trail Bedroll</button><button data-craft="trailpack" title="Complete the Stonepine expedition; costs 2 Wolf Hides and 1 Ashwood">Craft Trail Pack</button>')
          replace('Stonepine route proven · expedition complete.', 'Stonepine route proven · expedition complete. Trail Pack recipe learned: 2 hides + 1 Ashwood.')
          replace('Stonepine expedition complete · 18c · Fieldcraft +10 XP', 'Stonepine expedition complete · 18c · Fieldcraft +10 XP · Trail Pack recipe learned')
          p.write_text(text)
          p=Path('tests/smoke.mjs'); text=p.read_text().replace("'0.91.0'","'0.92.0'")
          before_start="    const stonepineExpeditionStart=await page.evaluate(()=>{"
          assert text.count(before_start)==1
          locked=r'''
              // The practical hauling recipe is earned, never a free starting capability.
              const lockedTrailPack=await page.evaluate(()=>{
                const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.setPosition(30,30);d.give('hide',2,2.8);d.give('wood',1,2.8);
                const before=d.snapshot().player,crafted=d.craft('trailpack'),after=d.snapshot().player;
                return{before,crafted,after,toast:document.getElementById('toast').textContent};
              });
              if(lockedTrailPack.crafted||lockedTrailPack.after.inventory.trailpack||JSON.stringify(lockedTrailPack.before)!==JSON.stringify(lockedTrailPack.after)||!lockedTrailPack.toast.includes('Complete the Stonepine expedition'))throw new Error(`${vp.name}: unearned Trail Pack consumed materials or bypassed expedition ${JSON.stringify(lockedTrailPack)}`);
          '''
          import textwrap
          text=text.replace(before_start,textwrap.dedent(locked)+before_start)
          marker="    const moonwellDay=await page.evaluate(()=>{"
          assert text.count(marker)==1
          proof=r'''
              // Completed 0.91 saves learn the recipe without another reward or a free pack.
              const trailPackLegacy=await page.evaluate(()=>{
                const d=window.__BRIAR_GLEN_DEBUG__;d.clearEnemies();d.setPosition(30,30);
                const before=d.snapshot().player,missing=d.craft('trailpack'),after=d.snapshot().player,toast=document.getElementById('toast').textContent;
                d.save();const key=d.build().saveKey,s=JSON.parse(localStorage.getItem(key));s.build='0.91.0';localStorage.setItem(key,JSON.stringify(s));
                const write=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){if(k===key)return;return write.call(this,k,v);};
                return{before,missing,after,toast};
              });
              if(!trailPackLegacy.before.expeditions.stonepine.completed||trailPackLegacy.missing||!trailPackLegacy.toast.includes('Missing materials')||JSON.stringify(trailPackLegacy.before)!==JSON.stringify(trailPackLegacy.after))throw new Error(`${vp.name}: earned Trail Pack bypassed real material cost ${JSON.stringify(trailPackLegacy)}`);
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build?.().version==='0.92.0');
              const trailPackSetup=await page.evaluate(()=>{
                const d=window.__BRIAR_GLEN_DEBUG__;d.clearEnemies();d.setPosition(30,30);const migrated=d.snapshot().player;
                d.give('hide',2,2.8);d.give('wood',1,2.8);return{migrated,before:d.snapshot().player};
              });
              if(!trailPackSetup.migrated.expeditions.stonepine.completed||trailPackSetup.migrated.inventory.trailpack||trailPackSetup.migrated.coins!==trailPackLegacy.before.coins||JSON.stringify(trailPackSetup.migrated.skills)!==JSON.stringify(trailPackLegacy.before.skills))throw new Error(`${vp.name}: completed 0.91 migration replayed rewards or granted a pack`);
              const makeTrailPack=page.locator('[data-craft="trailpack"]');if(vp.touch)await makeTrailPack.tap();else await makeTrailPack.click();
              const trailPackCrafted=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.advance(0);return{player:d.snapshot().player,saved:JSON.parse(localStorage.getItem(d.build().saveKey)).player,weightText:document.getElementById('pack-weight').textContent};});
              const earnedXP=s=>s.xp+20*s.level*(s.level-1),packBefore=trailPackSetup.before,packAfter=trailPackCrafted.player;
              if(packAfter.inventory.hide||packAfter.inventory.wood||packAfter.inventory.trailpack?.qty!==1||Math.abs(packAfter.inventory.trailpack.qualitySum-2.8)>1e-9||earnedXP(packAfter.skills.fieldcraft)-earnedXP(packBefore.skills.fieldcraft)!==10||packAfter.coins!==packBefore.coins||packAfter.equippedTool!==packBefore.equippedTool||packAfter.equippedWeapon!==packBefore.equippedWeapon||packAfter.equippedArmor!==packBefore.equippedArmor||JSON.stringify(trailPackCrafted.saved.inventory.trailpack)!==JSON.stringify(packAfter.inventory.trailpack)||!trailPackCrafted.weightText.includes('Trail Pack comfort 22'))throw new Error(`${vp.name}: real Trail Pack crafting lost cost/quality/equipment or progress ${JSON.stringify({packBefore,trailPackCrafted})}`);
              const trailPackDenied=await page.evaluate(()=>{
                const d=window.__BRIAR_GLEN_DEBUG__;d.give('hide',2,1);d.give('wood',1,1);const before=d.snapshot().player,duplicate=d.craft('trailpack'),after=d.snapshot().player;
                const cache=d.landmarks().find(l=>l.id==='stonepine-waycache');d.setPosition(cache.x,cache.y);const stashBefore={player:d.snapshot().player,cache:d.landmarks().find(l=>l.id===cache.id)},stored=d.waycacheStore('trailpack'),stashAfter={player:d.snapshot().player,cache:d.landmarks().find(l=>l.id===cache.id)};d.setPosition(30,30);d.save();
                return{before,duplicate,after,stored,stashBefore,stashAfter};
              });
              if(trailPackDenied.duplicate||JSON.stringify(trailPackDenied.before)!==JSON.stringify(trailPackDenied.after)||trailPackDenied.stored||JSON.stringify(trailPackDenied.stashBefore)!==JSON.stringify(trailPackDenied.stashAfter))throw new Error(`${vp.name}: singular Trail Pack duplicated or entered the stash ${JSON.stringify(trailPackDenied)}`);
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build?.().version==='0.92.0');
              const trailPackReload=await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.snapshot().player);
              if(!trailPackReload.expeditions.stonepine.completed||JSON.stringify(trailPackReload.inventory.trailpack)!==JSON.stringify(packAfter.inventory.trailpack)||trailPackReload.coins!==packAfter.coins)throw new Error(`${vp.name}: earned crafted pack did not persist`);
              // Isolate quality-dependent burden with equal total weight; the pack's own weight counts.
              const trailPackTravel=await page.evaluate(()=>{
                const d=window.__BRIAR_GLEN_DEBUG__,trial=(quality=null,iron=16,wood=0,ridge=false)=>{
                  d.reset();d.clearEnemies();if(quality===null)d.give('briarleaf',5,1);else d.give('trailpack',1,quality);
                  if(iron)d.give('iron',iron,1);if(wood)d.give('wood',wood,1);
                  d.setPosition(ridge?1900:300,ridge?500:900);d.setEnergy(100);d.advance(0);const before=d.snapshot().player,weightText=document.getElementById('pack-weight').textContent;
                  d.tapWorld(before.x+500,before.y);d.advance(1);const after=d.snapshot().player;return{distance:after.x-before.x,drain:before.energy-after.energy,weightText};
                };
                return{bare:trial(),plain:trial(1),good:trial(1.9),fine:trial(2.8),plainRelief:trial(1,15),bareLow:trial(null,15),goodHigh:trial(1.9,16,1),fineHigh:trial(2.8,16,1),overload:trial(2.8,18),lightBare:trial(null,0),lightPack:trial(2.8,0),ridgeBare:trial(null,16,0,true),ridgePack:trial(2.8,16,0,true)};
              });
              const near=(a,b)=>Math.abs(a-b)<1e-6,t=trailPackTravel;
              if(!near(t.bare.distance,170*.78)||!near(t.bare.drain,.7*1.35)||!near(t.plain.distance,t.bare.distance)||!near(t.good.distance,170)||!near(t.fine.distance,170)||!near(t.good.drain,.7)||!near(t.fine.drain,.7)||!t.plain.weightText.includes('comfort 20')||!t.good.weightText.includes('comfort 21')||!t.fine.weightText.includes('comfort 22'))throw new Error(`${vp.name}: Trail Pack quality did not apply bounded carry comfort ${JSON.stringify(t)}`);
              if(!near(t.plainRelief.distance,170)||!near(t.bareLow.distance,170*.78)||!near(t.goodHigh.distance,170*.78)||!near(t.fineHigh.distance,170)||!near(t.overload.distance,170*.78)||!near(t.overload.drain,.7*1.35)||!near(t.lightBare.distance,t.lightPack.distance)||!near(t.lightBare.drain,t.lightPack.drain)||!near(t.ridgeBare.distance,170*.82*.78)||!near(t.ridgePack.distance,170*.82)||!near(t.ridgeBare.drain,1.25*1.35)||!near(t.ridgePack.drain,1.25)||t.bare.weightText.includes('Trail Pack'))throw new Error(`${vp.name}: Trail Pack erased overload or changed light-load/terrain baseline ${JSON.stringify(t)}`);
              const freshTrailPack=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.give('hide',2,1);d.give('wood',1,1);return{made:d.craft('trailpack'),player:d.snapshot().player};});
              if(freshTrailPack.made||freshTrailPack.player.inventory.trailpack||freshTrailPack.player.expeditions.stonepine.completed)throw new Error(`${vp.name}: new game retained earned recipe or pack`);
          '''
          text=text.replace(marker,textwrap.dedent(proof)+marker)
          p.write_text(text)
          PY
          node --check src/game.js
          node --check tests/smoke.mjs
          git diff --check
      - name: Preflight full existing browser suite plus Trail Pack
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/trail-pack-server.log 2>&1 &
          sleep 2
          node tests/smoke.mjs http://127.0.0.1:4173/
      - name: Commit only feature and proof, remove authoring workflow
        run: |
          test "$(git ls-remote origin refs/heads/custodian/build-0.92-earned-trail-pack | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/trail-pack-authoring.yml
          git add src/game.js tests/smoke.mjs .github/workflows/trail-pack-authoring.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'BUILD 0.92: earned quality-aware Trail Pack hauling progression'
          test "$(git diff --name-only d16768cc43b32fbc34d5ca5bd8d68edecbddc383 HEAD | tr '\n' ' ')" = 'src/game.js tests/smoke.mjs '
          git diff --stat d16768cc43b32fbc34d5ca5bd8d68edecbddc383 HEAD
          git push origin HEAD:refs/heads/custodian/build-0.92-earned-trail-pack
