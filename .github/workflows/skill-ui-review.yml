name: Skill UI baseline (branch only)
on:
  push:
    branches: [custodian/ui-skill-readiness]
    paths: [.github/workflows/skill-ui-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact baseline
        run: |
          git merge-base --is-ancestor e6dd6005e3bf19fe7012fbc5543d33c2d2d1798d HEAD
          git diff --exit-code e6dd6005e3bf19fe7012fbc5543d33c2d2d1798d -- src tests index.html styles.css .github/workflows/reboot-game-proof.yml
          mkdir -p evidence
      - name: Install canonical browser and serve
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/skill-server.log 2>&1 &
          sleep 2
      - name: Real UI blocked-action reproduction
        run: |
          cat > .skill-baseline.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true}),records=[];
          try {for(const vp of [{name:'desktop',width:1440,height:900,touch:false},{name:'landscape',width:844,height:390,touch:true},{name:'portrait',width:390,height:844,touch:true}]){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.touch}),page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const activate=async s=>vp.touch?page.locator(s).tap():page.locator(s).click();
            await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');
            await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();for(const n of d.snapshot().npcs){d.npc(n.id).x=30;d.npc(n.id).y=30;}d.setPosition(900,600);d.setEnergy(0);d.advance(0);});
            await activate('[data-panel="character"]');
            for(const [id,message] of [['fieldcraft',/Too tired to survey/],['smithing',/Equip damaged gear/],['guard',/Too tired to brace/],['rapport',/No one close enough/]]){
              const button=page.locator(`[data-skill="${id}"]`);await button.scrollIntoViewIfNeeded();
              const before=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.setEnergy(0);return d.snapshot().player;});
              const text=await button.locator('..').innerText();assert.doesNotMatch(text,/\b(8|10) energy\b|1 Ashwood|1 Iron Ore/);
              await activate(`[data-skill="${id}"]`);assert.match(await page.locator('#toast').innerText(),message);
              const after=await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.snapshot().player);
              assert.deepEqual(after.skills,before.skills);assert.deepEqual(after.inventory,before.inventory);assert.equal(after.coins,before.coins);
              records.push({viewport:vp.name,id,text,rejection:await page.locator('#toast').innerText(),unchanged:true});
              await page.screenshot({path:`evidence/${vp.name}-${id}-before.png`});
            }
            assert.deepEqual(errors,[]);await context.close();
          }console.log('PASS exact-baseline real UI: four blocked skills lack their action requirements in all three viewports');}
          finally{await writeFile('evidence/baseline.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          node .skill-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-ui-baseline
          path: evidence
          retention-days: 14
