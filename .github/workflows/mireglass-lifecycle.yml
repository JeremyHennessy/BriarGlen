name: Branch-only Mireglass lifecycle
on:
  push:
    branches: [custodian/build-0.93-moss-fen-mirecaller]
    paths: [.github/workflows/mireglass-lifecycle.yml]
permissions:
  contents: write
jobs:
  lifecycle:
    if: github.ref == 'refs/heads/custodian/build-0.93-moss-fen-mirecaller'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unchanged candidate after isolated failed preflight
        run: |
          test "$(git rev-parse HEAD^)" = 4f15c1658f79696b6fcea13cccbee96a968592cd
          test "$(git hash-object src/game.js)" = 1d25a377249d23c208eea48a177f8f1536e6929c
      - name: Apply reproduced new-reward correction and isolated proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # Run 37161612258 / job 111316034146 reproduced the uncollected Lens leaking through reset.
          # Scope runtime correction to this new reward; preserve established ordinary-drop behaviour.
          p=Path('src/game.js');s=p.read_text();old="function reset(){world.minute=8*60;"
          assert s.count(old)==1
          s=s.replace(old,"function reset(){world.drops=world.drops.filter(d=>d.item!=='mireglass');world.minute=8*60;")
          p.write_text(s)
          p=Path('tests/smoke.mjs');s=p.read_text()
          anchor="    const mirePickup=await page.evaluate("
          extra="""    // Uncollected encounter loot belongs to this save, never the next new game.
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__BRIAR_GLEN_DEBUG__?.build?.().version==='0.93.0');
              const mireUncollected=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;return{enemy:{...d.enemy('mirecaller')},drops:d.drops().filter(x=>x.item==='mireglass'),coins:d.snapshot().player.coins};});
              if(!mireUncollected.enemy.dead||JSON.stringify(mireUncollected.drops)!==JSON.stringify(mireKill.drops)||mireUncollected.coins!==mireKill.after.coins)throw new Error(`${vp.name}: uncollected Mireglass did not survive reload without renewed reward ${JSON.stringify(mireUncollected)}`);
          """
          assert s.count(anchor)==1;s=s.replace(anchor,extra+anchor)
          # Reload legitimately restores unclaimed-cache guards; re-establish this stash-exclusion fixture's safe cache.
          # Do not clear the defeated Mirecaller, because its persistence is what the following test proves.
          old="const mireStash=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,cache="
          new="const mireStash=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;for(const e of d.enemies())if(e.encounter==='stonepine-waycache')d.enemy(e.id).dead=true;const cache="
          assert s.count(old)==1;s=s.replace(old,new)
          anchor="    const equipmentStart=await page.evaluate("
          extra="""    const mireNewGameLoot=await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.spawnMirecallerAt(1635,1100);d.setPosition(1600,1100);d.setEnemyHp('mirecaller',1);d.advance(.7);d.attack();const before=d.drops().filter(x=>x.item==='mireglass');d.reset();return{before,drops:d.drops().filter(x=>x.item==='mireglass'),enemy:{...d.enemy('mirecaller')},player:d.snapshot().player};});
              if(mireNewGameLoot.before.length!==1||mireNewGameLoot.drops.length||mireNewGameLoot.enemy.dead||mireNewGameLoot.player.inventory.mireglass||mireNewGameLoot.player.coins!==24)throw new Error(`${vp.name}: new game retained an unearned Mireglass drop ${JSON.stringify(mireNewGameLoot)}`);
          """
          assert s.count(anchor)==1;s=s.replace(anchor,extra+anchor);p.write_text(s)
          PY
          node --check src/game.js && node --check tests/smoke.mjs
          git diff --check
      - name: Full original and extended browser proof
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/mireglass.log 2>&1 &
          sleep 2
          node tests/smoke.mjs http://127.0.0.1:4173/
      - name: Commit exact tested correction and remove tooling
        run: |
          test "$(git ls-remote origin refs/heads/custodian/build-0.93-moss-fen-mirecaller | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object .github/workflows/reboot-game-proof.yml)" = 2dc5e4a39e7ab21d917a0c0af6afe69c0d5fc070
          git rm .github/workflows/mireglass-lifecycle.yml
          git add src/game.js tests/smoke.mjs
          test "$(git diff --cached --name-only | wc -l)" = 3
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep Mireglass reward in its earned game and prove uncollected reload'
          git push origin HEAD:refs/heads/custodian/build-0.93-moss-fen-mirecaller
