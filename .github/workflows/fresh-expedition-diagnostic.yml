name: Fresh-save expedition diagnostic
on:
  push:
    branches: [custodian/0.93-fresh-expedition-diagnostic]
    paths: [.github/workflows/fresh-expedition-diagnostic.yml]
permissions:
  contents: read
jobs:
  outing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unchanged game and original diagnostic
        run: |
          test "$(git rev-parse HEAD^)" = 24b864dc109bf0618b8a591f015ac8c5f727e918
          test "$(git hash-object src/game.js)" = 6f21f9f2c18500a50a8ed970b32618c218c2afba
          test "$(git hash-object tests/smoke.mjs)" = 94f9712afb59d7837fd77e149abe8b65b2614d4f
      - name: Reuse original route with evidence-based preparation correction
        run: |
          git show 24b864dc109bf0618b8a591f015ac8c5f727e918:.github/workflows/fresh-expedition-diagnostic.yml > /tmp/original-outing.yml
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          text=Path('/tmp/original-outing.yml').read_text()
          s=dedent(text.split("cat > fresh-outing.mjs <<'JS'\n",1)[1].split('\n          JS\n',1)[0])+'\n'
          def replace(old,new):
              global s
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new)
          # Initial run 37162074537: two worlds equipped a bow before crafting any arrows;
          # another left town at 10 HP. Correct only the controller, using real supplies.
          replace("const before=d.snapshot().player,profile=d.combatProfile()", "if(d.snapshot().player.hp<=70&&count('tonic')>0)button('#drink-tonic');const before=d.snapshot().player,profile=d.combatProfile()")
          replace("threats.some(e=>e.type==='briarwolf'&&e.windup>0)", "threats.some(e=>(e.type==='briarwolf'&&e.windup>0)||(e.type==='wolf'&&distance(e,before)<45&&before.equippedWeapon!=='bow'))")
          replace("stage='gather and hunt';gather('wood',2);hides(1);button('[data-craft=\"bow\"]');", "stage='prepare field medicine';gather('briarleaf',4);gather('mooncap',2);button('[data-craft=\"tonic\"]');button('[data-craft=\"tonic\"]');require(count('tonic')===2,'Medicine not prepared');walk(900,600);rest();log('medicine-prepared');stage='gather and hunt';gather('wood',3);hides(1);button('[data-craft=\"arrows\"]');button('[data-craft=\"bow\"]');")
          Path('fresh-outing.mjs').write_text(s)
          PY
          node --check fresh-outing.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/outing-server.log 2>&1 &
          sleep 2
          mkdir -p outings
          node fresh-outing.mjs
      - name: Preserve diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-expedition-0.93
          path: outings/
          retention-days: 14
      - name: Confirm no game or canonical proof changes
        if: always()
        run: |
          test "$(git hash-object src/game.js)" = 6f21f9f2c18500a50a8ed970b32618c218c2afba
          test "$(git hash-object tests/smoke.mjs)" = 94f9712afb59d7837fd77e149abe8b65b2614d4f
          git diff --exit-code -- src/game.js tests/smoke.mjs index.html src/style.css .github/workflows/reboot-game-proof.yml
