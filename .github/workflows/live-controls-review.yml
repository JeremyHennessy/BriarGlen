name: Live controls acceptance (branch only)
on:
  push:
    branches: [custodian/ui-live-control-stability]
    paths: [.github/workflows/live-controls-review.yml, .live-controls-author.py, tests/live-ui-stability.mjs]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact base and browser setup
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/custodian/ui-live-control-stability
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = b498ca646705bc85fe29ad3e6c45690276ed738c
          git merge-base --is-ancestor b498ca646705bc85fe29ad3e6c45690276ed738c HEAD
          test "$(git hash-object src/game.js)" = db8fce4e4df16bc0712aee5ff4ed4154b9b65c0b
          mkdir -p evidence/before evidence/source
          git archive b498ca646705bc85fe29ad3e6c45690276ed738c src tests index.html styles.css .github/workflows/reboot-game-proof.yml | tar -x -C evidence/before
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/game.log 2>&1 &
          python3 -m http.server 4174 --directory evidence/before >/tmp/before.log 2>&1 &
          sleep 2
      - name: Reproduce native skill and contextual focus failures on unchanged baseline
        run: |
          cat > .live-baseline.mjs <<'JS'
          import assert from 'node:assert/strict';import {mkdir,writeFile} from 'node:fs/promises';import {chromium} from 'playwright';
          const browser=await chromium.launch(),records=[];
          try{for(const vp of [{name:'desktop',width:1440,height:900},{name:'landscape',width:844,height:390},{name:'portrait',width:390,height:844}]){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}}),page=await context.newPage();
            await page.goto('http://127.0.0.1:4174/');await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');
            const dir='evidence/before-screens';await mkdir(dir,{recursive:true});await page.screenshot({path:`${dir}/${vp.name}-default.png`});
            await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();for(const n of d.snapshot().npcs){d.npc(n.id).x=30;d.npc(n.id).y=30;}d.setPosition(900,600);d.advance(0);});
            await page.locator('[data-panel="character"]').click();await page.locator('[data-skill="guard"]').focus();await page.waitForTimeout(650);
            const skillFocus=await page.locator('[data-skill="guard"]').evaluate(el=>el===document.activeElement);assert.equal(skillFocus,false);
            await page.screenshot({path:`${dir}/${vp.name}-skills-focus.png`});await page.keyboard.press('Enter');
            const xp=await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.snapshot().player.skills.guard.xp);assert.equal(xp,0,'Baseline delayed Enter is dropped');
            await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,n=d.npc('mira');n.x=900;n.y=600;d.advance(0);});
            await page.locator('[data-panel="nearby"]').click();await page.locator('[data-near="buy"]').focus();await page.waitForTimeout(650);
            const residentFocus=await page.locator('[data-near="buy"]').evaluate(el=>el===document.activeElement);assert.equal(residentFocus,false);await page.screenshot({path:`${dir}/${vp.name}-resident-focus.png`});
            await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__,l=d.landmarks().find(l=>l.id==='stonepine-waycache');d.setPosition(l.x,l.y);d.clearEnemies();d.advance(0);});
            await page.locator('#interact-btn').click();await page.evaluate(()=>window.__BRIAR_GLEN_DEBUG__.advance(0));await page.locator('[data-cache-store="bread"]').focus();await page.waitForTimeout(650);
            const stashFocus=await page.locator('[data-cache-store="bread"]').evaluate(el=>el===document.activeElement);assert.equal(stashFocus,false);await page.screenshot({path:`${dir}/${vp.name}-stash-focus.png`});
            records.push({vp,skillFocus,delayedEnterXp:xp,residentFocus,stashFocus});await context.close();
          }console.log('PASS baseline reproduction: native skill/resident/stash focus lost and delayed Enter dropped in all three viewports');}finally{await writeFile('evidence/baseline.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          set -o pipefail
          node .live-baseline.mjs 2>&1 | tee evidence/baseline.log
      - name: Apply bounded source-preserving presentation fix
        run: |
          set -o pipefail
          python3 .live-controls-author.py | tee evidence/preservation.log
          node --check src/game.js && node --check src/play-ui.js && node --check tests/play-ui.mjs && node --check tests/live-ui-stability.mjs
          git diff --check
          cp -r src tests index.html styles.css evidence/source/
          mkdir -p evidence/source/.github/workflows
          cp .github/workflows/reboot-game-proof.yml evidence/source/.github/workflows/
          git diff b498ca646705bc85fe29ad3e6c45690276ed738c -- src tests > evidence/candidate.diff
          test "$(git hash-object tests/smoke.mjs)" = 46f1961cd7538e5d8a38ef73f9c3e8b5c8382214
          test "$(git hash-object tests/interaction-ui.mjs)" = 8282fb0e32df684c1e6d4fe7ab5fd465d2e71c99
      - name: Full canonical game and strengthened UI proof
        env:
          UI_EVIDENCE_DIR: evidence/canonical
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ 2>&1 | tee evidence/full-proof.log
      - name: Five-size actual input and visual proof
        run: |
          cat > .live-extended.mjs <<'JS'
          import assert from 'node:assert/strict';import {mkdir,writeFile} from 'node:fs/promises';import {chromium} from 'playwright';import {provePlayUi} from './tests/play-ui.mjs';
          const browser=await chromium.launch(),records=[];process.env.UI_EVIDENCE_DIR='evidence/after-screens';await mkdir(process.env.UI_EVIDENCE_DIR,{recursive:true});
          try{for(const vp of [{name:'desktop',width:1440,height:900,touch:false},{name:'landscape',width:844,height:390,touch:true},{name:'portrait',width:390,height:844,touch:true},{name:'small-landscape',width:667,height:375,touch:true},{name:'small-portrait',width:375,height:667,touch:true}]){
            const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.touch}),page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');await page.screenshot({path:`${process.env.UI_EVIDENCE_DIR}/${vp.name}-default.png`});
            await provePlayUi(page,vp);
            await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.reset();d.clearEnemies();d.setPosition(900,600);for(const n of d.snapshot().npcs){d.npc(n.id).x=30;d.npc(n.id).y=30;}const n=d.npc('mira');n.x=900;n.y=600;n.name='Mira the Experienced Herbalist of Briar Glen and the Greenwood';d.advance(0);});
            await page.locator('[data-panel="nearby"]').click();await page.locator('[data-near="buy"]').focus();await page.waitForTimeout(650);assert.equal(await page.locator('[data-near="buy"]').evaluate(el=>el===document.activeElement),true);
            await page.screenshot({path:`${process.env.UI_EVIDENCE_DIR}/${vp.name}-long-context.png`});
            await page.addStyleTag({content:'body{padding:20px 12px 16px !important}'});await page.waitForTimeout(220);
            const geometry=await page.evaluate(()=>({w:innerWidth,h:innerHeight,sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,controls:['#hp','#energy','#attack-btn','#interact-btn','#quick-brace','#quick-tonic'].map(s=>document.querySelector(s).getBoundingClientRect().toJSON())}));
            assert.ok(geometry.sw<=geometry.w+1&&geometry.sh<=geometry.h+1,'Inset stress overflow');for(const b of geometry.controls)assert.ok(b.left>=11&&b.right<=geometry.w-11&&b.top>=19&&b.bottom<=geometry.h-15,'Inset control out of reach');
            await page.screenshot({path:`${process.env.UI_EVIDENCE_DIR}/${vp.name}-insets.png`});assert.deepEqual(errors,[]);records.push({vp,geometry,errors});await ctx.close();
          }console.log('PASS five-size native UI/input, long-context, populated panels, insets, orientation, keyboard/touch and screenshots');}finally{await writeFile('evidence/extended.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          set -o pipefail
          node .live-extended.mjs 2>&1 | tee evidence/extended.log
      - name: Commit only tested candidate to exact owned branch
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/custodian/ui-live-control-stability
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = b498ca646705bc85fe29ad3e6c45690276ed738c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js tests/play-ui.mjs tests/live-ui-stability.mjs
          git commit -m 'UI: retain live controls and preserve context-safe keyboard focus'
          git push origin HEAD:refs/heads/custodian/ui-live-control-stability
          git rev-parse HEAD > evidence/candidate-head.txt
          git ls-tree -r HEAD > evidence/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-controls-acceptance
          path: evidence
          include-hidden-files: true
          retention-days: 14
