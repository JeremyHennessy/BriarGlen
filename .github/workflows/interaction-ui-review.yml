name: Contextual Use review (branch only)
on:
  push:
    branches: [custodian/ui-contextual-use]
    paths: [.github/workflows/interaction-ui-review.yml, tests/interaction-ui.mjs]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply bounded presentation patch to exact base
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/custodian/ui-contextual-use
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = d84d354aaf5918805160377e76efdebee686a984
          git merge-base --is-ancestor d84d354aaf5918805160377e76efdebee686a984 HEAD
          mkdir -p evidence/source evidence/before
          git archive d84d354aaf5918805160377e76efdebee686a984 index.html styles.css src tests .github/workflows/reboot-game-proof.yml | tar -x -C evidence/before
          python3 .interaction-ui-author.py | tee evidence/preservation.log
          node --check src/game.js && node --check src/play-ui.js && node --check tests/play-ui.mjs && node --check tests/interaction-ui.mjs && node --check tests/smoke.mjs
          git diff --check
          cp -r src tests index.html styles.css evidence/source/
          mkdir -p evidence/source/.github/workflows
          cp .github/workflows/reboot-game-proof.yml evidence/source/.github/workflows/
          git diff d84d354aaf5918805160377e76efdebee686a984 -- src tests > evidence/candidate.diff
          git rev-parse HEAD > evidence/author-head.txt
      - name: Install canonical browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Full canonical gameplay and UI proof
        env:
          UI_EVIDENCE_DIR: evidence/canonical
        run: |
          set -o pipefail
          node tests/smoke.mjs http://127.0.0.1:4173/ | tee evidence/full-proof.log
      - name: Five-size visual, interaction, long-content and inset proof
        run: |
          cat > .interaction-visual.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {mkdir,writeFile} from 'node:fs/promises';
          import {chromium} from 'playwright';
          import {provePlayUi} from './tests/play-ui.mjs';
          const browser=await chromium.launch();const records=[];
          try{for(const vp of [{name:'desktop-large',width:1440,height:900,touch:false},{name:'landscape',width:844,height:390,touch:true},{name:'portrait',width:390,height:844,touch:true},{name:'small-landscape',width:667,height:375,touch:true},{name:'small-portrait',width:375,height:667,touch:true}]){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.touch});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/');await page.waitForFunction(()=>document.documentElement.dataset.playUi==='ready');await page.waitForTimeout(220);await mkdir('evidence/screens',{recursive:true});await page.screenshot({path:`evidence/screens/${vp.name}-default.png`});
            await provePlayUi(page,vp);
            await page.evaluate(()=>{const d=window.__BRIAR_GLEN_DEBUG__;d.setPosition(900,600);for(const n of d.snapshot().npcs){const live=d.npc(n.id);live.x=30;live.y=30;}const n=d.npc('mira');n.x=900;n.y=600;n.name='Mira the Very Experienced Village Herbalist With a Long Display Name';for(const id of ['wood','iron','hide','bread','briarleaf','mooncap','tonic','arrows','bow','blade','pick','jerkin','bedroll','trailpack'])d.give(id,1,2.8);d.advance(0);});
            assert.match(await page.locator('#interaction-target').textContent(),/Long Display Name/);
            for(const id of ['nearby','pack','craft','character','journal']){
              if(vp.touch)await page.locator(`[data-panel="${id}"]`).tap();else await page.locator(`[data-panel="${id}"]`).click();
              const geometry=await page.locator(`#panel-${id}`).evaluate(el=>({w:el.clientWidth,sw:el.scrollWidth}));assert.ok(geometry.sw<=geometry.w+1,`${vp.name} ${id}: long content overflow`);assert.equal(await page.locator('.play-panel:visible').count(),1);
            }
            if(vp.touch)await page.locator('[data-panel="nearby"]').tap();else await page.locator('[data-panel="nearby"]').click();
            await page.locator('#panel-nearby').evaluate(el=>el.scrollTop=0);await page.screenshot({path:`evidence/screens/${vp.name}-long-context.png`});
            if(vp.name==='portrait'||vp.name==='landscape'){
              await page.addStyleTag({content:'body{padding:20px 12px 16px !important}'});await page.waitForTimeout(220);
              const g=await page.evaluate(()=>({w:innerWidth,h:innerHeight,sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,controls:['#hp','#energy','#attack-btn','#interact-btn','#quick-brace','#quick-tonic'].map(s=>document.querySelector(s).getBoundingClientRect().toJSON())}));
              assert.ok(g.sw<=g.w+1&&g.sh<=g.h+1);for(const b of g.controls)assert.ok(b.left>=12&&b.right<=g.w-11&&b.top>=20&&b.bottom<=g.h-15,'Inset stress inaccessible control');records.push({vp,inset:g});await page.screenshot({path:`evidence/screens/${vp.name}-inset.png`});
            }
            assert.deepEqual(errors,[]);records.push({vp,complete:true});await context.close();
          }console.log('PASS five-size extended playability, default and long-content screenshots, all panels, keyboard/touch/orientation and inset stress');}finally{await writeFile('evidence/visual-proof.json',JSON.stringify(records,null,2));await browser.close();}
          JS
          set -o pipefail
          UI_EVIDENCE_DIR=evidence/screens node .interaction-visual.mjs | tee evidence/visual-proof.log
      - name: Commit tested candidate to exact owned branch
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/custodian/ui-contextual-use
          test "$(git ls-remote origin refs/heads/custodian/ui-contextual-use | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = d84d354aaf5918805160377e76efdebee686a984
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js src/play-ui.js src/play-ui.css tests/play-ui.mjs
          git commit -m 'UI: explain reachable Use actions and movement without changing gameplay'
          git push origin HEAD:refs/heads/custodian/ui-contextual-use
          git rev-parse HEAD > evidence/candidate-head.txt
          git ls-tree -r HEAD > evidence/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextual-use-candidate
          path: evidence
          include-hidden-files: true
          retention-days: 14
