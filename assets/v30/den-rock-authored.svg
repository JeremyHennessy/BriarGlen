<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <defs>
    <linearGradient id="rearBasalt" x1="25" y1="21" x2="122" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65524c"/>
      <stop offset=".48" stop-color="#433b3b"/>
      <stop offset="1" stop-color="#272629"/>
    </linearGradient>
    <linearGradient id="frontBasalt" x1="42" y1="54" x2="112" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#534542"/>
      <stop offset="1" stop-color="#2d2b2e"/>
    </linearGradient>
    <linearGradient id="heat" x1="54" y1="39" x2="106" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc276"/>
      <stop offset=".45" stop-color="#e86d43"/>
      <stop offset="1" stop-color="#87352c"/>
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Three separate basalt masses create a craggy volcanic cluster rather than one rune-shaped slab. -->
    <path d="M18 98 22 73 34 52 48 46 56 27 72 18 85 31 88 50 79 71 66 93Z"
          fill="url(#rearBasalt)" stroke="#211e20" stroke-width="4.5"/>
    <path d="M61 101 66 71 77 54 87 37 102 31 116 44 120 62 112 82 101 104Z"
          fill="#4b3f3e" stroke="#211e20" stroke-width="4.5"/>
    <path d="M92 104 104 78 119 66 134 68 145 83 142 102 128 110 107 109Z"
          fill="url(#frontBasalt)" stroke="#211e20" stroke-width="4"/>

    <!-- Facet planes make the stones feel carved by heat and pressure. -->
    <path d="M30 70 43 51 57 45 69 28 77 42 70 62 55 73Z" fill="#7b6157" opacity=".32"/>
    <path d="M74 74 84 56 96 40 108 47 111 63 98 71 87 88Z" fill="#6a504a" opacity=".28"/>
    <path d="M108 88 120 72 133 74 141 84 130 91 119 104Z" fill="#604843" opacity=".34"/>

    <!-- Heat cracks are short, branching fractures embedded inside individual rocks. -->
    <path d="M55 42 61 54 56 64 65 72" fill="none" stroke="#6d2d29" stroke-width="6" opacity=".76"/>
    <path d="M55 42 61 54 56 64 65 72" fill="none" stroke="url(#heat)" stroke-width="2.6"/>
    <path d="M92 50 98 61 94 70 103 77" fill="none" stroke="#6d2d29" stroke-width="5.5" opacity=".72"/>
    <path d="M92 50 98 61 94 70 103 77" fill="none" stroke="url(#heat)" stroke-width="2.3"/>
    <path d="M123 77 128 84 125 91" fill="none" stroke="#c75237" stroke-width="2.2" opacity=".8"/>

    <!-- Chips and subdued highlights keep the forms geological instead of icon-like. -->
    <path d="M38 54 49 48M74 31l6 8M101 43l8 5M118 75l10 4"
          stroke="#ac7c6c" stroke-width="1.8" opacity=".2"/>
    <path d="M15 106 22 99 31 103 30 111 20 113Z" fill="#383335" stroke="#211e20" stroke-width="2.5"/>
    <path d="M137 108 144 102 152 106 149 113 141 115Z" fill="#332f31" stroke="#211e20" stroke-width="2.5"/>
    <ellipse cx="82" cy="109" rx="53" ry="5" fill="#171719" opacity=".3"/>
  </g>
</svg>
